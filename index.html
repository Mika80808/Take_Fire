  $('menu-item-icon').style.display = isChild ? 'flex' : 'none';
  $('menu-item-div').style.display  = isUnc ? 'none' : 'block';
  $('menu-item-del').style.display  = isUnc ? 'none' : 'flex';

  menu.style.visibility = 'hidden';
  menu.style.display = 'flex';
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = e.clientX + 10;
  let top  = e.clientY;
  if (left + mw > window.innerWidth - 8) left = e.clientX - mw - 10;
  if (left < 8) left = 8;
  if (top + mh > window.innerHeight - 8) top = window.innerHeight - mh - 8;
  if (top < 8) top = 8;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  menu.style.visibility = 'visible';
}

async function getOrderedFolderMessages(folder) {
  const msgs = await idbGetMessagesByIds(folder.msgIds);
  const orderMap = new Map(folder.msgIds.map((id, i) => [id, i]));
  msgs.sort((a, b) => (orderMap.get(a.id) ?? 0) - (orderMap.get(b.id) ?? 0));
  return msgs;
}

$('menu-item-exp').addEventListener('click', async () => {
  if (!activeFolderIdForMenu) return;
  let folderExports = [];
  let folderName = '';
  let separateExport = false;

  if (activeFolderIdForMenu === '__unc__') {
    const cls = classifiedIds();
    const msgs = await idbGetUnclassifiedMessages(cls);
    folderExports = [{ name: t('folder.uncategorized'), msgs }];
    folderName = t('folder.uncategorized');
  } else {
    const folder = S.folders.find(f => f.id === activeFolderIdForMenu);
    if (!folder) return;
    folderName = folder.name;
    const children = S.folders
      .filter(f => f.parentId === folder.id)
      .sort((a, b) => S.folderSort === 'desc' ? b.createdAt - a.createdAt : a.createdAt - b.createdAt);

    if (!folder.parentId && children.length > 0) {
      const selectedResult = await new Promise(resolve => {
        showModal({
          title: t('menu.exportTxt'),
          customHtml: `
            <div class="modal-checklist">
              <label class="modal-check-item modal-check-item-main">
                <input type="checkbox" data-export-folder-id="${escAttr(folder.id)}" checked>
                <span>${esc(folder.name)}</span>
              </label>
              ${children.map(child => `
                <label class="modal-check-item modal-check-item-sub">
                  <input type="checkbox" data-export-folder-id="${escAttr(child.id)}" checked>
                  <span>${esc(child.name)}</span>
                </label>
              `).join('')}
            </div>
            <label class="modal-check-item modal-check-separate">
              <input type="checkbox" data-export-separate>
              <span>${esc(t('folder.exportSeparate'))}</span>
            </label>
          `,
          onOpen: body => {
            // 主資料夾的勾選框身兼「全選 / 全不選」：勾選/取消會連動所有子資料夾；
            // 子資料夾被個別調整時，主資料夾維持自身勾選狀態，僅顯示 indeterminate 視覺提示
            const mainCb = body.querySelector('.modal-check-item-main input[data-export-folder-id]');
            const childCbs = [...body.querySelectorAll('.modal-check-item-sub input[data-export-folder-id]')];
            const syncMainIndeterminate = () => {
              const checkedCount = childCbs.filter(el => el.checked).length;
              mainCb.indeterminate = checkedCount > 0 && checkedCount < childCbs.length;
            };
            mainCb.addEventListener('change', () => {
              childCbs.forEach(el => { el.checked = mainCb.checked; });
              mainCb.indeterminate = false;
            });
            childCbs.forEach(el => el.addEventListener('change', syncMainIndeterminate));
          },
          confirmText: t('menu.exportTxt'),
          valueResolver: body => ({
            ids: [...body.querySelectorAll('[data-export-folder-id]:checked')].map(el => el.dataset.exportFolderId),
            separate: body.querySelector('[data-export-separate]').checked
          }),
          onConfirm: resolve,
          onCancel: () => resolve(null)
        });
      });

      if (!selectedResult || selectedResult.ids.length === 0) return;
      separateExport = selectedResult.separate;

      // 匯出順序一律依建立時間由舊到新（時間軸正確），不受側欄排序方向 S.folderSort 影響
      const selectedFolders = [folder, ...children]
        .filter(f => selectedResult.ids.includes(f.id))
        .sort((a, b) => a.createdAt - b.createdAt);
      folderExports = await Promise.all(selectedFolders.map(async f => ({
        name: f.name,
        msgs: await getOrderedFolderMessages(f)
      })));
    } else {
      const msgs = await getOrderedFolderMessages(folder);
      folderExports = [{ name: folder.name, msgs }];
    }
  }

  const nonEmptyExports = folderExports
    .map(item => ({ ...item, msgs: item.msgs.filter(msg => msg.type === 'msg') }))
    .filter(item => item.msgs.length > 0);

  if (nonEmptyExports.length === 0) {
    showModal({ title: t('folder.cannotExport'), desc: t('folder.noContent'), confirmText: t('msg.ok') });
    return;
  }

  const msgsToTxt = msgs => msgs.map(msg =>
    `[${msg.tsStr}] ${displayNameOf(msg.name)}:\n${msg.lines.join('\n')}\n`
  ).join('\n');

  const downloadTxt = (name, content) => {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  if (separateExport && nonEmptyExports.length > 1) {
    // 個別匯出：每個資料夾各自產生一個 TXT 檔（瀏覽器連續多次下載時稍微錯開，避免被視為多重下載而擋下）
    nonEmptyExports.forEach((item, idx) => {
      const firstDate = extractDateFromMsg(item.msgs[0] || null);
      const fileName = `${firstDate ? `${firstDate}_` : ''}${item.name}.txt`;
      setTimeout(() => downloadTxt(fileName, msgsToTxt(item.msgs)), idx * 200);
    });
    return;
  }

  let txtContent = '';
  const multipleFolders = nonEmptyExports.length > 1;
  nonEmptyExports.forEach((item, idx) => {
    if (multipleFolders) txtContent += `=== ${item.name} ===\n\n`;
    txtContent += msgsToTxt(item.msgs) + '\n';
    if (multipleFolders && idx < nonEmptyExports.length - 1) txtContent += '\n';
  });

  const firstExportMsg = nonEmptyExports[0]?.msgs?.[0] || null;
  const firstDate = extractDateFromMsg(firstExportMsg);
  downloadTxt(`${firstDate ? `${firstDate}_` : ''}${folderName}.txt`, txtContent);
});

/* ══════════════════════════════════════════════════════════
   Jump To Event Helper
══════════════════════════════════════════════════════════ */
// 顯示某一天的所有事件清單（點擊行事曆日期時），可從中選擇要跳轉的事件
let _calPopupCleanup = null;
function closeDayEventsPopup() {
  const pop = $('cal-day-popup');
  if (pop) pop.style.display = 'none';
  if (_calPopupCleanup) { _calPopupCleanup(); _calPopupCleanup = null; }
}
function showDayEventsPopup(dayEvents, cellDateStr, anchorEl) {
  let pop = $('cal-day-popup');
  if (!pop) {
    pop = document.createElement('div');
    pop.id = 'cal-day-popup';
    document.body.appendChild(pop);
  }
  // 只有一筆事件時直接跳轉，不需要再選
  if (dayEvents.length === 1) { closeDayEventsPopup(); jumpToEvent(dayEvents[0], cellDateStr); return; }

  pop.innerHTML = '';
  const header = document.createElement('div');
  header.className = 'cal-popup-date';
  const d = new Date(cellDateStr);
  header.textContent = _curLang === 'en'
    ? d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
    : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  pop.appendChild(header);

  const ordered = [...dayEvents].sort((a, b) => (a._slot ?? 0) - (b._slot ?? 0));
  ordered.forEach(evt => {
    const item = document.createElement('div');
    item.className = 'cal-popup-item';
    const dot = document.createElement('span');
    dot.className = 'cal-popup-dot';
    dot.style.background = `var(--c-cat-${evt.cat})`;
    const textWrap = document.createElement('div');
    textWrap.className = 'cal-popup-text';
    const title = document.createElement('div');
    title.className = 'cal-popup-title';
    title.textContent = evt.title || t('event.unnamed');
    const folder = document.createElement('div');
    folder.className = 'cal-popup-folder';
    folder.textContent = evt.folderName || '';
    textWrap.appendChild(title);
    textWrap.appendChild(folder);
    item.appendChild(dot);
    item.appendChild(textWrap);
    item.addEventListener('click', (e) => { e.stopPropagation(); closeDayEventsPopup(); jumpToEvent(evt, cellDateStr); });
    pop.appendChild(item);
  });

  // 先顯示以取得尺寸，再定位於日期格旁，避免超出視窗
  pop.style.visibility = 'hidden';
  pop.style.display = 'flex';
  const rect = anchorEl.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = rect.left;
  let top = rect.bottom + 4;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (left < 8) left = 8;
  if (top + ph > window.innerHeight - 8) top = rect.top - ph - 4;
  if (top < 8) top = 8;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.visibility = 'visible';

  // 點擊他處或捲動、按 Esc 時關閉
  const onOutside = (e) => { if (!pop.contains(e.target) && e.target !== anchorEl) closeDayEventsPopup(); };
  const onKey = (e) => { if (e.key === 'Escape') closeDayEventsPopup(); };
  setTimeout(() => document.addEventListener('mousedown', onOutside), 0);
  document.addEventListener('keydown', onKey);
  window.addEventListener('scroll', closeDayEventsPopup, { once: true, capture: true });
  _calPopupCleanup = () => {
    document.removeEventListener('mousedown', onOutside);
    document.removeEventListener('keydown', onKey);
  };
}

async function jumpToEvent(evt, cellDateStr) {
  if (S.view !== evt.folderId) await switchView(evt.folderId, evt.folderName);
  await _renderDonePromise;
  const card = $(`note-card-${evt.id}`);
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    card.style.boxShadow = '0 0 0 3px var(--c-primary)';
    setTimeout(() => card.style.boxShadow = '', 1500);
  }
  const msgs = visibleMsgs();
  const targetMsg = msgs.find(m => extractDateFromMsg(m) === cellDateStr);
  if (targetMsg) {
    const row = document.querySelector(`.msg-row[data-id="${CSS.escape(targetMsg.id)}"]`);
    if (row) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const bubble = row.querySelector('.msg-bubble');
      if (bubble) {
        bubble.style.boxShadow = '0 0 0 3px var(--c-primary)';
        setTimeout(() => bubble.style.boxShadow = '', 1500);
      }
    }
  }
}

function getEventFoldersForCurrentView() {
  if (S.view === null) return [];
  const folder = S.folders.find(f => f.id === S.view);
  if (!folder) return [];
  if (folder.parentId) return [folder];
  const children = S.folders
    .filter(f => f.parentId === folder.id)
    .sort((a, b) => S.folderSort === 'desc' ? b.createdAt - a.createdAt : a.createdAt - b.createdAt);
  return [folder, ...children];
}

function renderRight() {
  const noteList   = $('note-list');
  const rightTitle = $('right-header');
  noteList.innerHTML = '';
  renderCalendarGrid();

  if (S.view === null) {
    if (S.rightTab === 'events') rightTitle.textContent = t('right.calendar');
    noteList.innerHTML = `<div class="right-empty">${t('right.selectFolder')}</div>`;
    return;
  }

  const folder = S.folders.find(f => f.id === S.view);
  if (!folder) return;
  const eventFolders = getEventFoldersForCurrentView();
  const scopedNotes = eventFolders.flatMap(f => (f.notes || []).map((note, ni) => ({
    note,
    noteIndex: ni,
    sourceFolder: f
  })));

  if (S.rightTab === 'events') {
    rightTitle.innerHTML = `<span>${esc(folder.name)} · ${esc(t('right.eventSuffix'))}</span>`;
    const addBtn = document.createElement('button');
    addBtn.className = 'icon-btn';
    addBtn.title = t('right.addEvent');
    addBtn.textContent = '＋';
    addBtn.style.fontSize = '16px';
    addBtn.addEventListener('click', () => {
      let defaultDate = '';
      const msgs = visibleMsgs();
      if (msgs.length > 0) defaultDate = extractDateFromMsg(msgs[0]);
      if (!defaultDate) defaultDate = toDateStr(new Date());
      folder.notes.push({ id: uid(), title: '', body: '', date: defaultDate, endDate: '', cat: 'life' });
      S.noteEditId = folder.notes[folder.notes.length - 1].id;
      renderRight();
      save();
    });
    rightTitle.appendChild(addBtn);
  }

  scopedNotes.forEach(({ note, noteIndex: ni, sourceFolder }) => {
    const isEditingBody = S.noteEditId === note.id;
    const card = document.createElement('div');
    card.className = 'note-card';
    card.id = `note-card-${note.id}`;

    // 依據分類設定色彩變數
    const catClass = CAT_INFO[note.cat || 'life'].class;

    const metaRow = document.createElement('div');

    const dateIn = document.createElement('input');

    dateIn.className = 'note-date-inline';
    dateIn.value = note.date || '';
    dateIn.addEventListener('change', () => {
      note.date = dateIn.value;

      if (!note.endDate) endDateIn.value = note.date || '';
      renderCalendarGrid(); save();
    });
    metaRow.appendChild(dateIn);

    const sepArrow = document.createElement('span');
    sepArrow.textContent = '~';
    sepArrow.style.opacity = '0.5';

    const endDateIn = document.createElement('input');
    endDateIn.type = 'date';
    endDateIn.className = 'note-date-inline';
    endDateIn.value = note.endDate || note.date || '';
    endDateIn.title = t('event.endDate');
    endDateIn.style.opacity = note.endDate ? '1' : '0.5';
    endDateIn.addEventListener('change', () => {
      note.endDate = endDateIn.value;
      endDateIn.style.opacity = note.endDate ? '1' : '0.5';
      renderCalendarGrid();
      save();
    });
    metaRow.appendChild(sepArrow);
    metaRow.appendChild(endDateIn);

    const sepDot = document.createElement('span');
    sepDot.textContent = '·';
    sepDot.style.opacity = '0.5';
    sepDot.style.margin = '0 4px';
    metaRow.appendChild(sepDot);

    const catIn = document.createElement('select');
    catIn.className = 'note-cat-inline';
    Object.keys(CAT_INFO).forEach(key => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = CAT_INFO[key].label;
      catIn.appendChild(opt);
    });
    catIn.value = note.cat || 'life';
    catIn.addEventListener('change', () => {
      note.cat = catIn.value;
      const newCatClass = CAT_INFO[note.cat].class;
      card.style.setProperty('--note-color', `var(--c-cat-${newCatClass})`);
      renderCalendarGrid();
      save();
    });
    metaRow.appendChild(catIn);

    card.appendChild(metaRow);

    // ── 3. 內文區塊（預設兩行預覽，點擊展開編輯，失焦摺疊） ──
    const preview = document.createElement('div');
    preview.className = 'note-body-preview';
    const updatePreview = () => {
      if (note.body && note.body.trim()) {
        preview.textContent = note.body;
        preview.classList.remove('empty');
      } else {
        preview.textContent = t('event.bodyPh');
        preview.classList.add('empty');
      }
    };
    updatePreview();

    const bodyIn = document.createElement('textarea');
    bodyIn.className = 'note-body-inline';
    bodyIn.id = `note-body-inline-${note.id}`;
    bodyIn.placeholder = t('event.bodyPh');
    bodyIn.value = note.body || '';

    const openEditor = () => {
      preview.style.display = 'none';
      bodyIn.style.display = 'block';
      bodyIn.style.height = 'auto';
      bodyIn.style.height = bodyIn.scrollHeight + 'px';
      bodyIn.focus();
    };

    const closeEditor = () => {
      updatePreview();
      bodyIn.style.display = 'none';
      preview.style.display = '';   // 清除 inline style，讓 CSS 的 display:-webkit-box 生效
      if (S.noteEditId === note.id) S.noteEditId = null;
    };

    // 新增後自動開啟編輯
    if (isEditingBody) {
      preview.style.display = 'none';
      bodyIn.style.display = 'block';
      setTimeout(() => {
        bodyIn.style.height = 'auto';
        bodyIn.style.height = bodyIn.scrollHeight + 'px';
        bodyIn.focus();
      }, 0);
    } else {
      bodyIn.style.display = 'none';
    }

    preview.addEventListener('click', openEditor);

    bodyIn.addEventListener('input', function() {
      note.body = this.value;
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      save();
    });

    // 整張卡片失焦時才收起（避免卡片內部元素互相切換時誤收）
    card.addEventListener('focusout', (e) => {
      if (bodyIn.style.display === 'none') return;
      const next = e.relatedTarget;
      if (next && card.contains(next)) return;
      closeEditor();
    });

    card.appendChild(preview);
    card.appendChild(bodyIn);

    noteList.appendChild(card);
  });
}

// 避免 input 事件每打一字就觸發整個日曆重繪
let _calRedrawTimer = null;
function renderCalendarGridDebounced() {
  if (_calRedrawTimer) return;
  _calRedrawTimer = setTimeout(() => { _calRedrawTimer = null; renderCalendarGrid(); }, 200);
}

function renderCalendarGrid() {
  const wrap = $('right-calendar-wrap');
  wrap.style.display = 'block';

  const year = S.calDate.getFullYear();
  const month = S.calDate.getMonth();
  $('cal-title').textContent = _curLang === 'en'
    ? new Date(year, month, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' })
    : `${year}年 ${month + 1}月`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();

  const grid = $('cal-grid');
  grid.innerHTML = '';

  let allMonthEvents = [];
  // 行事曆亮點顯示「所有」資料夾的事件，而非僅限目前檢視的資料夾
  const eventFolders = S.folders;
  eventFolders.forEach(f => {
    (f.notes || []).forEach(n => {
      if (n.date) {
        const startStr = n.date;
        const endStr = (n.endDate && n.endDate >= n.date) ? n.endDate : n.date;
        allMonthEvents.push({ ...n, startStr, endStr, folderId: f.id, folderName: f.name });
      }
    });
  });
  allMonthEvents.sort((a, b) => {
    if (a.startStr !== b.startStr) return a.startStr.localeCompare(b.startStr);
    return b.endStr.localeCompare(a.endStr);
  });

  const activeSlots = [];
  allMonthEvents.forEach(evt => {
    let slot = 0;
    while (activeSlots[slot] && activeSlots[slot] >= evt.startStr) slot++;
    activeSlots[slot] = evt.endStr;
    evt._slot = slot;
  });

  let totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
  
  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    let cellDateStr = '';
    
    if (i < firstDay) {
      const num = document.createElement('span');
      num.textContent = prevMonthDays - firstDay + i + 1;
      cell.appendChild(num);
      cell.classList.add('muted');
    } else if (i >= firstDay + daysInMonth) {
      const num = document.createElement('span');
      num.textContent = i - firstDay - daysInMonth + 1;
      cell.appendChild(num);
      cell.classList.add('muted');
    } else {
      const day = i - firstDay + 1;
      const num = document.createElement('span');
      num.textContent = day;
      cell.appendChild(num);
      cellDateStr = toDateStr(new Date(year, month, day));
      if (cellDateStr === toDateStr(new Date())) cell.classList.add('today');

      const dayEvents = allMonthEvents.filter(evt => cellDateStr >= evt.startStr && cellDateStr <= evt.endStr);
      if (dayEvents.length > 0) {
        cell.classList.add('has-event');
        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'cal-events';
        const maxVisible = 3;
        const maxSlot = Math.max(...dayEvents.map(e => e._slot));
        const visibleSlots = Math.min(maxVisible, maxSlot + 1);
        for(let s = 0; s < visibleSlots; s++) {
          const evt = dayEvents.find(e => e._slot === s);
          const bar = document.createElement('div');
          if (evt) {
            let type = 'mid';
            if (evt.startStr === evt.endStr) type = 'single';
            else if (cellDateStr === evt.startStr) type = 'start';
            else if (cellDateStr === evt.endStr) type = 'end';
            bar.className = `cal-bar bar-${evt.cat} ${type}`;
            bar.title = evt.title || t('event.unnamed');
            if (i % 7 === 6 && (type === 'start' || type === 'mid')) { bar.style.marginRight = '4px'; bar.style.borderTopRightRadius = '3px'; bar.style.borderBottomRightRadius = '3px'; }
            if (i % 7 === 0 && (type === 'end' || type === 'mid')) { bar.style.marginLeft = '4px'; bar.style.borderTopLeftRadius = '3px'; bar.style.borderBottomLeftRadius = '3px'; }
            bar.addEventListener('click', (e) => { e.stopPropagation(); jumpToEvent(evt, cellDateStr); });
          } else bar.className = 'cal-bar empty';
          eventsContainer.appendChild(bar);
        }
        const hiddenCount = dayEvents.filter(e => e._slot >= maxVisible).length;
        if (hiddenCount > 0) {
          const more = document.createElement('div');
          more.className = 'cal-more';
          more.textContent = `+${hiddenCount}`;
          more.title = tf('event.moreN', hiddenCount);
          more.addEventListener('click', (e) => { e.stopPropagation(); showDayEventsPopup(dayEvents, cellDateStr, cell); });
          eventsContainer.appendChild(more);
        }
        cell.appendChild(eventsContainer);
      }
      cell.addEventListener('click', () => { if (dayEvents.length > 0) showDayEventsPopup(dayEvents, cellDateStr, cell); });
      if (dayEvents.length > 0) addKeyActivation(cell);
    }
    grid.appendChild(cell);
  }
}

  revokeMp3Url(song.id);

  idbDeleteCover(song.id).catch(() => {});

  renderSongsList();
}

    rightGroup.appendChild(saveBtn);

    actionsRow.appendChild(delFormBtn);
    actionsRow.appendChild(rightGroup);
    editMode.appendChild(actionsRow);

    delFormBtn.addEventListener('click', () => deleteSong(song));

    saveBtn.addEventListener('click', () => {
      // 根據互斥鎖定狀態儲存：有 MP3 就清空網址，反之保留網址
      if (song.mp3Url) {
        song.url = ''; 
      } else {
        song.url = linkIn.value;
      }
      song.title = titleIn.value;
      song.lyrics = lyricIn.value;
      delete song._isNew;
      delete song._isEditing;

      renderSongsList();
    });

    cancelBtn.addEventListener('click', () => {
      if (song._isNew) {
        deleteSong(song);
      } else {
        delete song._isEditing;
        save();
        renderSongsList();
      }
    });

    // ── VIEW MODE ──
    const viewMode = document.createElement('div');
    viewMode.style.display = isEditState ? 'none' : 'flex';
    viewMode.style.flexDirection = 'column';
    viewMode.style.gap = '12px';

    const headerRow = document.createElement('div');
    headerRow.style.display = 'flex';
    headerRow.style.justifyContent = 'space-between';
    headerRow.style.alignItems = 'flex-start';

    const viewTitle = document.createElement('div');
    viewTitle.style.fontSize = '16px';
    viewTitle.style.fontWeight = '700';
    viewTitle.style.color = 'var(--c-text)';
    viewTitle.textContent = song.title || t('song.unnamed');

    const viewActions = document.createElement('div');
    viewActions.style.display = 'flex';
    viewActions.style.gap = '4px';

    const btnEdit = document.createElement('button');
    btnEdit.className = 'icon-btn';
    btnEdit.innerHTML = '✎';
    btnEdit.title = t('song.editTip');
    btnEdit.addEventListener('click', () => {
      song._isEditing = true;
      renderSongsList();
    });

    const btnDel = document.createElement('button');
    btnDel.className = 'icon-btn';
    btnDel.innerHTML = '✕';
    btnDel.title = t('song.delTip');
    btnDel.addEventListener('click', () => deleteSong(song));

    viewActions.appendChild(btnEdit);
    viewActions.appendChild(btnDel);
    headerRow.appendChild(viewTitle);
    headerRow.appendChild(viewActions);
    viewMode.appendChild(headerRow);

    // 檢視模式版面：封面+播放器（左）與歌詞（右）
    const viewBody = document.createElement('div');
    viewBody.className = 'song-view-body';
    const mediaCol = document.createElement('div');
    mediaCol.className = 'song-media';
    viewBody.appendChild(mediaCol);
    viewMode.appendChild(viewBody);

    // Cover（與 Official Site MUSIC 同一張封面，從 IDB 載入後存於 song.cover）
    if (song.cover) {
      const coverWrap = document.createElement('div');
      coverWrap.className = 'song-view-cover';
      const img = document.createElement('img');
      img.src = normalizeCoverSrc(song.cover);
      img.loading = 'lazy';
      coverWrap.appendChild(img);
      mediaCol.appendChild(coverWrap);
    }

    // Embed Wrap
    const embedWrap = document.createElement('div');
    embedWrap.className = 'song-embed-wrap';
    const updateEmbed = () => {
       if (song.mp3Url) {
         embedWrap.style.display = 'block';
         embedWrap.style.background = 'transparent';
         embedWrap.innerHTML = `<audio controls src="${escAttr(song.mp3Url)}" style="width: 100%; height: 40px; outline: none; border-radius: 4px;"></audio>`;
         const audioEl = embedWrap.querySelector('audio');
         if (audioEl) {
           audioEl.addEventListener('play', () => {
             document.querySelectorAll('.song-embed-wrap audio').forEach(a => {
               if (a !== audioEl) try { a.pause(); } catch (_) {}
             });
             stopOfficialMusicPlayback();
           });
         }
       } else {
         embedWrap.style.background = 'var(--c-primary-char)';
         const html = buildEmbedHtml(song.url, 'large');
         embedWrap.style.display = html ? 'block' : 'none';
         embedWrap.innerHTML = html;
         const iframeEl = embedWrap.querySelector('iframe');
         if (iframeEl) {
           armSinglePlaybackIframe(iframeEl, 'story', song.url, 'large');
           const stopOthers = () => enforceSingleSongPlayback({ exceptStoryIframe: iframeEl });
           embedWrap.addEventListener('pointerdown', stopOthers, true);
           embedWrap.addEventListener('click', stopOthers, true);
         }
        }
    };
    updateEmbed();
    mediaCol.appendChild(embedWrap);

    // Lyrics View
    if (song.lyrics) {
      const lyricWrapper = document.createElement('div');
      lyricWrapper.className = 'lyric-wrapper';
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'lyric-toggle';
      toggleBtn.type = 'button';
      toggleBtn.innerHTML = `<span>${esc(t('song.expandLyric'))}</span><span class="lyric-icon" style="transition: transform 0.3s; font-size: 10px;">▼</span>`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'lyric-content';
      const innerDiv = document.createElement('div');
      innerDiv.className = 'lyric-inner';

      const displayDiv = document.createElement('div');
      displayDiv.className = 'song-lyrics-display';
      displayDiv.textContent = song.lyrics;
      displayDiv.title = t('song.dblToEdit');
      displayDiv.addEventListener('dblclick', () => {
        song._isEditing = true;
        renderSongsList();
      });

      innerDiv.appendChild(displayDiv);
      contentDiv.appendChild(innerDiv);

      // 左右分欄展開時，讓歌詞可視高度與「封面＋播放器」欄切齊，超過則於欄內捲動
      const syncLyricHeight = () => {
        const isRow = viewBody.classList.contains('lyrics-open')
          && getComputedStyle(viewBody).flexDirection === 'row';
        if (isRow) {
          const mediaH = mediaCol.getBoundingClientRect().height;
          const toggleH = toggleBtn.getBoundingClientRect().height;
          innerDiv.style.maxHeight = Math.max(160, mediaH - toggleH - 8) + 'px';
          innerDiv.style.overflowY = 'auto';
        } else {
          innerDiv.style.maxHeight = '';
          innerDiv.style.overflowY = '';
        }
      };
      // 封面圖片載入或面板寬度變化會改變左欄高度，需同步重算
      let mediaRO = null;
      const ensureLyricObserver = () => {
        if (mediaRO) return;
        mediaRO = new ResizeObserver(syncLyricHeight);
        mediaRO.observe(mediaCol);
      };
      const releaseLyricObserver = () => {
        if (!mediaRO) return;
        mediaRO.disconnect();
        mediaRO = null;
      };
      _songRenderCleanups.push(releaseLyricObserver);

      toggleBtn.addEventListener('click', () => {
        const isExpanded = contentDiv.classList.toggle('expanded');
        viewBody.classList.toggle('lyrics-open', isExpanded);
        toggleBtn.querySelector('span').textContent = isExpanded ? t('song.collapseLyric') : t('song.expandLyric');
        toggleBtn.querySelector('.lyric-icon').style.transform = isExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
        if (isExpanded) ensureLyricObserver();
        else releaseLyricObserver();
        syncLyricHeight();
      });

      lyricWrapper.appendChild(toggleBtn);
      lyricWrapper.appendChild(contentDiv);
      viewBody.appendChild(lyricWrapper);
    }

    card.appendChild(viewMode);
    card.appendChild(editMode);
    frag.appendChild(card);
  });
  songList.appendChild(frag);
}

$('file-input').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  // 顯示 loading
  $('mid-header-title').textContent = t('imp.importing');
  $('message-list').innerHTML = `<div class="empty-state"><small>${esc(t('msg.parsing'))}</small></div>`;

  // 取得已存在的 fingerprints（去重用）
  const existingFps = await idbGetAllFingerprints();

  let hasNew = false;

  for (const file of files) {
    const text = await file.text();

    // 從標題區塊擷取角色名稱
    const headerMatch = text.match(/^={10,}\r?\n(.+?)\s*-\s*.+?\r?\n/);
    if (headerMatch && headerMatch[1]) {
      const charName = headerMatch[1].trim();
      if (charName) {
        S.nameOrder = S.nameOrder.filter(n => n !== charName);
        S.nameOrder.unshift(charName);
      }
    }

    const parsed = parseTxt(text);
    parsed.forEach(m => { if (m.type === 'msg') registerName(m.name); });

    // 過濾重複，加上 fp
    const toInsert = [];
    for (const msg of parsed) {
      const fp = msgFingerprint(msg);
      if (!existingFps.has(fp)) {
        existingFps.add(fp);
        toInsert.push({ ...msg, fp });
        hasNew = true;
      }
    }

    // 分批寫入 IDB（每批 500 則，讓 UI 保持回應）
    const BATCH = 500;
    for (let i = 0; i < toInsert.length; i += BATCH) {
      await idbPutMessages(toInsert.slice(i, i + BATCH));
      await new Promise(r => setTimeout(r, 0));
    }
    // 即時更新計數（不需重掃 IDB）
    if (toInsert.length > 0) adjustUnclassifiedCount(toInsert.length);
  }

  if (hasNew) S.view = null;

  updateMidHeaderTitle();

  renderFolders();
  await renderMsgs();
  renderRight();
  save();
  updateAvatarSlotUI();
  e.target.value = '';
});

/* ══════════════════════════════════════════════════════════
   Column Resizers
══════════════════════════════════════════════════════════ */
(function() {
  function initResizer(resizerId, targetId, side) {
    const resizer = $(resizerId);
    const target  = $(targetId);
    let startX, startW;
    resizer.addEventListener('mousedown', e => {
      e.preventDefault();
      startX = e.clientX;
      startW = target.getBoundingClientRect().width;
      resizer.classList.add('resizing');
      function onMove(e) {
        const delta = side === 'left' ? e.clientX - startX : startX - e.clientX;
        target.style.width = Math.max(100, startW + delta) + 'px';
      }
      function onUp() {
        resizer.classList.remove('resizing');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }
  initResizer('resizer-left',  'col-left',  'left');
  initResizer('resizer-right', 'col-right', 'right');

  const btnMid = $('toggle-mid-col');
  const btnRight = $('toggle-right-col');
  const ICON_FULLSCREEN = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="M120-120v-200h80v120h120v80H120Zm520 0v-80h120v-120h80v200H640ZM120-640v-200h200v80H200v120h-80Zm640 0v-120H640v-80h200v200h-80Z"/></svg>`;
  const ICON_CLOSE_FULLSCREEN = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true"><path d="m136-80-56-56 264-264H160v-80h320v320h-80v-184L136-80Zm344-400v-320h80v184l264-264 56 56-264 264h184v80H480Z"/></svg>`;
  let fullscreenTarget = '';

  function refreshColumnToggleUI() {
    const isMidFull = fullscreenTarget === 'mid';
    const isRightFull = fullscreenTarget === 'right';
    btnMid.innerHTML = isMidFull ? ICON_CLOSE_FULLSCREEN : ICON_FULLSCREEN;
    btnRight.innerHTML = isRightFull ? ICON_CLOSE_FULLSCREEN : ICON_FULLSCREEN;
    btnMid.title = isMidFull ? t('mid.restoreMid') : t('mid.fullscreenTip');
    btnRight.title = isRightFull ? t('mid.restoreRight') : t('right.fullscreenTip');
    document.body.classList.toggle('mid-fullscreen', isMidFull);
    document.body.classList.toggle('right-fullscreen', isRightFull);
  }

  btnMid.addEventListener('click', () => {
    fullscreenTarget = fullscreenTarget === 'mid' ? '' : 'mid';
    refreshColumnToggleUI();
  });

  btnRight.addEventListener('click', () => {
    fullscreenTarget = fullscreenTarget === 'right' ? '' : 'right';
    refreshColumnToggleUI();
  });

  refreshColumnToggleUI();

  // 點擊外部自動摺疊歌詞
  document.addEventListener('click', (e) => {
    if (S.rightTab === 'songs') {
      document.querySelectorAll('.lyric-wrapper').forEach(wrapper => {
        const content = wrapper.querySelector('.lyric-content');
        if (content && content.classList.contains('expanded') && !wrapper.contains(e.target)) {
           content.classList.remove('expanded');
           const btnSpan = wrapper.querySelector('.lyric-toggle span');
           const btnIcon = wrapper.querySelector('.lyric-icon');
           if (btnSpan) btnSpan.textContent = t('song.expandLyric');
           if (btnIcon) btnIcon.style.transform = 'rotate(0deg)';
        }
      });
    }
  });
})();

$('btn-scroll-top').addEventListener('click', () => {
  $('message-list').scrollTo({ top: 0, behavior: 'smooth' });
});
$('btn-scroll-bottom').addEventListener('click', () => {
  const list = $('message-list');
  list.scrollTo({ top: list.scrollHeight, behavior: 'smooth' });
  // .msg-row uses content-visibility:auto, so off-screen rows only report their
  // real height once they're revealed near the viewport. As the scroll moves
  // down, more rows get revealed and scrollHeight keeps growing, so a single
  // snap-to-bottom can still undershoot. Keep chasing the bottom each frame
  // until scrollHeight stops changing.
  let lastHeight = -1, stableFrames = 0, ticks = 0;
  (function chase() {
    list.scrollTop = list.scrollHeight;
    stableFrames = list.scrollHeight === lastHeight ? stableFrames + 1 : 0;
    lastHeight = list.scrollHeight;
    ticks++;
    if (stableFrames < 3 && ticks < 90) requestAnimationFrame(chase);
  })();
});

let _cgNbIdx = 0;
let _cgNbTimer = null;

function openCGNotebook() {
  const d = $('cg-nb-drawer'); if (!d) return;
  if (_cgNbIdx >= SS.members.length) _cgNbIdx = 0;
  buildCGNbTabs();
  cgNbSelect(_cgNbIdx);

  $('cg-nb-overlay')?.classList.add('open');
  $('cg-nb-fab')?.classList.add('cg-nb-hidden');
  setTimeout(() => $('cg-nb-text')?.focus(), 280);
}

function closeCGNotebook() {
  const d = $('cg-nb-drawer'); if (!d) return;
  flushCGNbSave();
  d.classList.remove('open');
  d.setAttribute('aria-hidden', 'true');
  $('cg-nb-overlay')?.classList.remove('open');
  $('cg-nb-fab')?.classList.remove('cg-nb-hidden');
}

function buildCGNbTabs() {
  const wrap = $('cg-nb-tabs'); if (!wrap) return;
  wrap.innerHTML = '';
  SS.members.forEach((m, i) => {
    const b = document.createElement('div');
    b.className = 'cg-nb-tab' + (i === _cgNbIdx ? ' active' : '');
    b.textContent = m.name || t('member.unnamed');
    b.title = b.textContent;
    b.addEventListener('click', () => cgNbSelect(i));
    wrap.appendChild(b);
  });
}

function cgNbSelect(i) {
  if (i !== _cgNbIdx) flushCGNbSave();
  _cgNbIdx = i;
  $('cg-nb-tabs')?.querySelectorAll('.cg-nb-tab').forEach((b, idx) => b.classList.toggle('active', idx === i));
  const ta = $('cg-nb-text');
  if (ta) ta.value = SS.members[i]?.cgNote || '';
  updateCGNbCount();
}

function updateCGNbCount() {
  const ta = $('cg-nb-text'), out = $('cg-nb-count');
  if (ta && out) out.textContent = ta.value.length + ' ' + t('nb.chars');
}

function scheduleCGNbSave() {
  clearTimeout(_cgNbTimer);
  _cgNbTimer = setTimeout(flushCGNbSave, 500);
}

function flushCGNbSave() {
  clearTimeout(_cgNbTimer); _cgNbTimer = null;
  const ta = $('cg-nb-text'); if (!ta) return;
  const m = SS.members[_cgNbIdx]; if (!m) return;
  if (m.cgNote === ta.value) return;
  m.cgNote = ta.value;
  saveSite();
  flashCGNbSaved();
}

function flashCGNbSaved() {
  const el = $('cg-nb-saved'); if (!el) return;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1200);
}

(function initCGNotebook() {
  $('cg-nb-fab')?.addEventListener('click', openCGNotebook);
  $('cg-nb-close')?.addEventListener('click', closeCGNotebook);
  $('cg-nb-overlay')?.addEventListener('click', closeCGNotebook);
  $('cg-nb-text')?.addEventListener('input', () => { updateCGNbCount(); scheduleCGNbSave(); });

async function fetchRemotePosters() {
  if (!CG_INDEX_URL) return [];
  try {
    const res = await fetch(CG_INDEX_URL);
    if (!res.ok) return [];
    const list = await res.json();
    return list.map(item => ({ ...item, id: 'remote_' + item.src, isLocal: false }));
  } catch(e) { return []; }
}

  const grid = $('poster-grid');
  grid.innerHTML = '';

  posters.forEach((poster, idx) => {
    const cell = document.createElement('div');
    cell.className = 'poster-cell';

    const img = document.createElement('img');
    img.src = poster.src;
    img.alt = poster.label || '';

    const overlay = document.createElement('div');
    overlay.className = 'poster-cell-overlay';

    // 刪除按鈕（hover 時顯示，僅本機圖片）

    editBtn.className = 'poster-edit-btn';
    editBtn.textContent = '✎';
    editBtn.title = t('poster.edit');
    editBtn.addEventListener('click', e => { e.stopPropagation(); openLightbox(idx); });
    cell.appendChild(editBtn);

    cell.appendChild(img);
    cell.appendChild(overlay);
    cell.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(cell);
  });

  const addCell = document.createElement('div');
  addCell.className = 'poster-add-cell';

async function renderPoster() {
  const grid = $('poster-grid');
  grid.innerHTML = `<div style="padding:40px;color:var(--c-hint);text-align:center;grid-column:1/-1">${esc(t('msg.loading'))}</div>`;

  const [remote, localRecords] = await Promise.all([
    fetchRemotePosters(),
    idbGetAllPosters(),
  ]);

  // 本機圖片：從 blob 建立 objectURL（跳過 blob 遺失的記錄）
  const local = localRecords
    .filter(rec => rec.blob instanceof Blob)
    .map(rec => ({
      id      : rec.id,
      src     : getPosterObjectUrl(rec),
      label   : rec.label || '',
      title   : rec.title || '',
      caption : rec.caption || '',
      noteId  : rec.noteId || rec.folderId || '',
      isLocal : true,
    }));

  const remoteIds = new Set(remote.map(p => p.id));
  const merged = [...remote, ...local.filter(p => !remoteIds.has(p.id))];
  SS.posters = merged;

  buildPosterGrid(merged);
}

/* ── 圖片壓縮：長邊縮至 1600px、轉存 WebP（不支援則退回 JPEG/PNG），
   手機拍照動輒 5–10MB，壓縮後通常只剩十分之一，大幅節省 IndexedDB 空間 ── */
const IMG_MAX_EDGE  = 1600;
const IMG_QUALITY   = 0.82;
const IMG_SKIP_SIZE = 400 * 1024; // 小檔且不需縮邊就直接存原檔

async function compressImage(file, maxEdge = IMG_MAX_EDGE, quality = IMG_QUALITY) {
  // GIF（動畫）、SVG（向量）等格式不重壓，避免破壞內容
  if (!/^image\/(jpeg|png|webp)$/i.test(file.type)) return file;
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { return file; } // 解碼失敗就存原檔
  const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.size <= IMG_SKIP_SIZE) { bmp.close(); return file; }
  const canvas = document.createElement('canvas');
  canvas.width  = Math.max(1, Math.round(bmp.width  * scale));
  canvas.height = Math.max(1, Math.round(bmp.height * scale));
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  bmp.close();
  const toBlob = type => new Promise(res => canvas.toBlob(res, type, quality));
  let out = await toBlob('image/webp');
  if (!out || out.type !== 'image/webp') {
    // 舊瀏覽器不支援 WebP 編碼：PNG 保留透明度，其餘轉 JPEG
    out = await toBlob(file.type === 'image/png' ? 'image/png' : 'image/jpeg');
  }
  if (!out || out.size >= file.size) return file; // 沒有變小就不採用
  const ext = { 'image/webp': '.webp', 'image/jpeg': '.jpg', 'image/png': '.png' }[out.type] || '';
  return new File([out], file.name.replace(/\.[^.]+$/, '') + ext, { type: out.type });
}

$('pm-upload-area').addEventListener('click', () => $('pm-file-input').click());
let _pmPickSeq = 0;
$('pm-file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const seq = ++_pmPickSeq;
  const stored = await compressImage(file);
  if (seq !== _pmPickSeq) return; // 使用者已改選其他圖片
  _pmFile = stored;
  const url = URL.createObjectURL(stored);
  const preview = $('pm-preview');
  preview.src = url;
  preview.style.display = 'block';
  $('pm-placeholder').style.display = 'none';
});

$('pm-save').addEventListener('click', async () => {
  const caption = $('pm-caption').value.trim();
  const title   = '';
  const noteId  = $('pm-folder').value;

  if (_pmPosterId === null) {
    if (!_pmFile) return;
    const id  = uid();
    const src = URL.createObjectURL(_pmFile);
    _posterUrlCache.set(id, src);
    SS.posters.push({ id, src, title, caption, noteId, label: _pmFile.name, isLocal: true });
    idbPutPoster({ id, blob: _pmFile, title, caption, noteId, label: _pmFile.name }).catch(err => { console.warn('IDB write:', err); notifyStorageError(err, 'media'); });
  } else {
    const idx = SS.posters.findIndex(p => p.id === _pmPosterId);
    if (idx !== -1) {
      SS.posters[idx] = { ...SS.posters[idx], title, caption, noteId };
      if (_pmFile) {
        if (_posterUrlCache.has(_pmPosterId)) URL.revokeObjectURL(_posterUrlCache.get(_pmPosterId));
        const src = URL.createObjectURL(_pmFile);
        _posterUrlCache.set(_pmPosterId, src);
        SS.posters[idx].src = src;
        idbPutPoster({ id: _pmPosterId, blob: _pmFile, title, caption, noteId, label: _pmFile.name }).catch(err => { console.warn('IDB write:', err); notifyStorageError(err, 'media'); });
      } else {
        const records = await idbGetAllPosters();
        const rec = records.find(r => r.id === _pmPosterId);
        if (rec) idbPutPoster({ ...rec, title, caption, noteId }).catch(err => { console.warn('IDB write:', err); notifyStorageError(err, 'media'); });
      }
    }
  }

  $('poster-modal-overlay').classList.remove('open');
  buildPosterGrid(SS.posters);
});

$('pm-del').addEventListener('click', async () => {
  if (_pmPosterId === null) return;
  if (_posterUrlCache.has(_pmPosterId)) {
    URL.revokeObjectURL(_posterUrlCache.get(_pmPosterId));
    _posterUrlCache.delete(_pmPosterId);
  }
  await idbDeletePoster(_pmPosterId);
  const idx = SS.posters.findIndex(p => p.id === _pmPosterId);
  if (idx !== -1) SS.posters.splice(idx, 1);
  $('poster-modal-overlay').classList.remove('open');
  buildPosterGrid(SS.posters);
});

function showChapterChip(ids, folder, selValue) {
  const tag = $(ids.tag);
  const sel = $(ids.sel);
  if (folder) {
    $(ids.link).textContent = '→ ' + folder.name;
    tag.style.display = 'inline-flex';
    sel.style.display = 'none';
    sel.value = selValue || folder.id;
  } else {
    tag.style.display = 'none';
    sel.style.display = '';
    sel.value = '';
  }

$('pm-folder').addEventListener('change', () => {

});

$('pm-chapter-remove').addEventListener('click', () => {

});

function _pmGetFolder(evtId) {
  if (!evtId) return null;
  // 直接 folder ID（新格式）
  const direct = S.folders.find(f => f.id === evtId);
  if (direct) return direct;
  // 舊格式：note_ 前綴
  if (evtId.startsWith('note_')) {
    const noteId = evtId.slice(5);
    for (const f of S.folders) {
      if ((f.notes || []).some(n => n.id === noteId)) return f;
    }
  }
  // 舊格式：tourEvent folderId
  const evt = SS.tourEvents.find(t => t.id === evtId);
  return evt?.folderId ? S.folders.find(f => f.id === evt.folderId) || null : null;
}

$('ig-modal-nav-next').addEventListener('click', e => { e.stopPropagation(); igModalNav(1); });

$('ig-modal-save').addEventListener('click', async () => {
  const idx = SS.lightboxIdx;
  const poster = SS.posters[idx];
  if (!poster) return;
  const caption = $('ig-modal-caption').value.trim();

  SS.posters[idx] = { ...poster, caption, noteId };

$('ig-modal-del').addEventListener('click', async () => {
  const idx = SS.lightboxIdx;
  const poster = SS.posters[idx];
  if (!poster) return;

/* ══════════════════════════════════════════════════════════
   MUSIC PAGE
══════════════════════════════════════════════════════════ */
// 用 song.id（而非 index）記錄待匯入目標，避免選檔期間列表重排/刪除導致套錯歌
let _pendingCoverSongId = null;
let _pendingMp3SongId   = null;
let _activeMusicAudio = null;
let _activeMusicBtn = null;
let _activeMusicCard = null;
const MUSIC_PLAY_ICON_SVG  = `<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M8 5v14l11-7z"/></svg>`;
const MUSIC_PAUSE_ICON_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

function stopEmbeddedIframes(selector, exceptIframe = null) {
  document.querySelectorAll(selector).forEach(iframe => {
    if (iframe === exceptIframe) return;
    const sourceUrl = iframe.dataset.sourceUrl || '';
    const size = iframe.dataset.embedSize || 'large';
    const kind = iframe.dataset.singlePlaybackKind || 'story';
    const embedSrc = iframe.dataset.origSrc || iframe.src || '';
    if (!sourceUrl) {
      if (iframe.src && iframe.src !== 'about:blank') iframe.src = 'about:blank';
      return;
    }
    if (isSunoEmbedSrc(embedSrc)) {
      const placeholder = createStoppedEmbedPlaceholder(sourceUrl, kind, size);
      if (iframe.parentNode) iframe.parentNode.replaceChild(placeholder, iframe);
      return;
    }
    const html = buildEmbedHtml(sourceUrl, size);
    if (!html) {
      iframe.src = 'about:blank';
      return;
    }
    const host = document.createElement('div');
    host.innerHTML = html;
    const nextIframe = host.querySelector('iframe');
    if (!nextIframe || !iframe.parentNode) return;
    armSinglePlaybackIframe(nextIframe, kind, sourceUrl, size);
    iframe.parentNode.replaceChild(nextIframe, iframe);
  });
}

function isSunoEmbedSrc(src) {
  try {
    const url = new URL(src);
    return url.hostname.toLowerCase().replace(/^www\./, '') === 'suno.com'
      && url.pathname.startsWith('/embed/');
  } catch (_) {
    return false;
  }
}

function createStoppedEmbedPlaceholder(sourceUrl, kind, size = 'large') {
  const holder = document.createElement('button');
  holder.type = 'button';
  holder.style.width = '100%';
  holder.style.height = `${size === 'small' ? 80 : 120}px`;
  holder.style.border = 'none';
  holder.style.borderRadius = 'inherit';
  holder.style.background = 'rgb(var(--c-primary-rgb) / 0.10)';
  holder.style.color = 'var(--c-text)';
  holder.style.cursor = 'pointer';
  holder.style.font = 'inherit';
  holder.style.fontSize = '12px';
  holder.style.letterSpacing = '0.4px';
  holder.textContent = document.documentElement.lang === 'zh-TW' ? '重新載入播放器' : 'Reload player';
  holder.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    const html = buildEmbedHtml(sourceUrl, size);
    if (!html) return;
    const host = document.createElement('div');
    host.innerHTML = html;
    const iframe = host.querySelector('iframe');
    if (!iframe || !holder.parentNode) return;
    armSinglePlaybackIframe(iframe, kind, sourceUrl, size);
    holder.parentNode.replaceChild(iframe, holder);
  });
  return holder;
}

function armSinglePlaybackIframe(iframe, kind, sourceUrl = '', size = 'large') {
  if (!iframe) return;
  if (!iframe.dataset.origSrc) iframe.dataset.origSrc = iframe.src;
  iframe.dataset.singlePlaybackKind = kind;
  iframe.dataset.sourceUrl = sourceUrl || iframe.dataset.sourceUrl || '';
  iframe.dataset.embedSize = size;
  const handler = () => {
    if (iframe.dataset.origSrc && iframe.src === 'about:blank') {
      iframe.src = iframe.dataset.origSrc;
    }
    if (kind === 'story') enforceSingleSongPlayback({ exceptStoryIframe: iframe });
    else enforceSingleSongPlayback({ exceptOfficialIframe: iframe });
  };
  iframe.addEventListener('pointerdown', handler);
  iframe.addEventListener('focus', handler);
}

function stopStorySongPlayback(exceptAudio = null, exceptIframe = null) {
  document.querySelectorAll('.song-embed-wrap audio').forEach(audio => {
    if (audio === exceptAudio) return;
    try { audio.pause(); } catch (_) {}
  });
  stopEmbeddedIframes('.song-embed-wrap iframe', exceptIframe);
}

function stopOfficialMusicPlayback(exceptAudio = null, exceptIframe = null) {
  if (_activeMusicAudio && _activeMusicAudio !== exceptAudio) {
    try { _activeMusicAudio.pause(); } catch (_) {}
    if (_activeMusicBtn) _activeMusicBtn.innerHTML = MUSIC_PLAY_ICON_SVG;
    const prevCard = _activeMusicBtn?.closest('.music-card');
    if (prevCard) prevCard.classList.remove('is-playing');
    _activeMusicAudio = null;
    _activeMusicBtn = null;
  }
  stopEmbeddedIframes('.music-embed-wrap iframe', exceptIframe);
}

function enforceSingleSongPlayback(opts = {}) {
  stopStorySongPlayback(opts.exceptStoryAudio || null, opts.exceptStoryIframe || null);
  stopOfficialMusicPlayback(opts.exceptOfficialAudio || null, opts.exceptOfficialIframe || null);
}

function renderMusicPage() {
  const grid = $('music-grid');
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  _activeMusicCard = null;

  const makeCoverPlaceholder = () => {
    const ph = document.createElement('div');
    ph.className = 'music-cover-placeholder';
    ph.innerHTML = `<svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
    return ph;
  };

  if (!S.songs.length) {
    const em = document.createElement('div');
    em.className = 'music-empty-state';
    em.textContent = t('song.empty');
    grid.appendChild(em);
    return;
  }

  S.songs.forEach((song, idx) => {
    const card = document.createElement('div');
    card.className = 'music-card';

    /* ── 預設佔位（提前宣告，封面取色時需要引用） ── */
    const defaultSpace = document.createElement('div');
    defaultSpace.className = 'music-default-space';

    /* ── 封面 ── */
    const coverDiv = document.createElement('div');
    coverDiv.className = 'music-cover';

    const coverSrc = normalizeCoverSrc(song.cover || '');
    if (coverSrc) {
      const img = document.createElement('img');
      // 遠端圖片需 CORS 才能讀 pixel 取色；blob:/data: 不受影響
      if (/^https?:/i.test(coverSrc)) img.crossOrigin = 'anonymous';
      img.src = coverSrc;
      img.loading = 'lazy';
      img.onload  = () => extractCoverColor(img, card);
      img.onerror = () => { img.remove(); coverDiv.appendChild(makeCoverPlaceholder()); };
      coverDiv.appendChild(img);
    } else {
      coverDiv.appendChild(makeCoverPlaceholder());
    }

    const coverUpload = document.createElement('div');
    coverUpload.className = 'music-cover-upload';
    coverUpload.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M5 20h14v-2H5v2zm7-16-5 5h3v7h4V9h3l-5-5z"/></svg><span style="font-size:11px;letter-spacing:1px">${esc(t('song.changeCover'))}</span>`;
    coverUpload.addEventListener('click', e => { e.stopPropagation(); _pendingCoverSongId = song.id; $('music-cover-input').click(); });
    coverDiv.appendChild(coverUpload);

    const coverTitle = document.createElement('div');
    coverTitle.className = 'music-cover-title';
    coverTitle.textContent = song.title || t('song.unnamedSingle');
    coverDiv.appendChild(coverTitle);

    /* ── 黑膠唱片 ── */
    const vinylWrapper = document.createElement('div');
    vinylWrapper.className = 'music-vinyl-wrapper';
    vinylWrapper.title = t('song.vinylTip');
    const vinylDisc = document.createElement('div');
    vinylDisc.className = 'music-vinyl-disc';
    vinylWrapper.appendChild(vinylDisc);

    /* ── 展開面板 ── */
    const expandWrap = document.createElement('div');
    expandWrap.className = 'music-expand-wrap';

    /* 播放器欄 */
    const playerPanel = document.createElement('div');
    playerPanel.className = 'music-player-panel';

    const hasEmbed = !song.mp3Url && !!song.url;
    // 宣告於 if/else 之外，closeCard 兩種卡片型態都會引用
    let audioPlayer = null;

    if (hasEmbed) {
      const embedHtml = buildEmbedHtml(song.url, 'large');
      if (embedHtml) {
        const ew = document.createElement('div');
        ew.className = 'music-embed-wrap';
        ew.innerHTML = embedHtml;
        // 記住原始 src，以便關閉後重新開啟時還原
        const iframe = ew.querySelector('iframe');
        if (iframe) {
          iframe.dataset.origSrc = iframe.src;
          armSinglePlaybackIframe(iframe, 'official', song.url, 'large');
          const stopOthers = () => enforceSingleSongPlayback({ exceptOfficialIframe: iframe });
          ew.addEventListener('pointerdown', stopOthers, true);
          ew.addEventListener('click', stopOthers, true);
        }
        playerPanel.appendChild(ew);
      }
    } else {
      /* MP3 播放器 */
      const playBtn = document.createElement('button');
      playBtn.className = 'play-btn';
      playBtn.innerHTML = MUSIC_PLAY_ICON_SVG;

      const mp3Bar = document.createElement('div');
      mp3Bar.className = 'music-mp3-bar';
      const timeRow = document.createElement('div');
      timeRow.className = 'music-mp3-time';
      const curEl = document.createElement('span'); curEl.textContent = '0:00';
      const seek = document.createElement('input');
      seek.type = 'range'; seek.className = 'music-mp3-seek';
      seek.value = '0'; seek.min = '0'; seek.max = '100';
      const durEl = document.createElement('span'); durEl.textContent = '0:00';
      timeRow.appendChild(curEl); timeRow.appendChild(seek); timeRow.appendChild(durEl);
      mp3Bar.appendChild(timeRow);

      const mp3UpBtn = document.createElement('button');
      mp3UpBtn.className = 'music-upload-mp3';
      mp3UpBtn.innerHTML = song.mp3Url
        ? `<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg> ${esc(t('song.uploadedMp3'))}`
        : `<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M5 20h14v-2H5v2zm7-16-5 5h3v7h4V9h3l-5-5z"/></svg> ${esc(t('song.uploadMp3'))}`;
      mp3UpBtn.addEventListener('click', e => { e.stopPropagation(); _pendingMp3SongId = song.id; $('music-mp3-input').click(); });

      const fmtTime = s => {
        const m = Math.floor(s / 60), sec = Math.floor(s % 60);
        return `${m}:${sec.toString().padStart(2, '0')}`;
      };

      const initAudio = async () => {
        if (audioPlayer) return true;
        if (song.mp3Url) {
          audioPlayer = new Audio(song.mp3Url);
        } else {
          try {
            const db = await openPosterDB();
            const rec = await new Promise((res, rej) => {
              const tx = db.transaction('song_mp3s', 'readonly');
              const req = tx.objectStore('song_mp3s').get(song.id);
              req.onsuccess = () => res(req.result);
              req.onerror = e => rej(e.target.error);
            });
            if (!rec?.blob) return false;
            revokeMp3Url(song.id);
            const url = URL.createObjectURL(rec.blob);
            _mp3UrlCache.set(song.id, url);
            song.mp3Url = url;
            song.mp3FileName = rec.fileName || '';
            audioPlayer = new Audio(url);
            mp3Bar.style.display = '';
          } catch(e) { return false; }
        }
        audioPlayer.addEventListener('timeupdate', () => {
          if (!audioPlayer.duration) return;
          seek.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          curEl.textContent = fmtTime(audioPlayer.currentTime);
        });
        audioPlayer.addEventListener('loadedmetadata', () => { durEl.textContent = fmtTime(audioPlayer.duration); });
        audioPlayer.addEventListener('ended', () => {
          playBtn.innerHTML = MUSIC_PLAY_ICON_SVG;
          card.classList.remove('is-playing');
          seek.value = 0; curEl.textContent = '0:00';
          if (_activeMusicAudio === audioPlayer) { _activeMusicAudio = null; _activeMusicBtn = null; }
        });
        return true;
      };

      playBtn.addEventListener('click', async e => {
        e.stopPropagation();
        const ok = await initAudio();
        if (!ok) return;
        if (audioPlayer.paused) {
          enforceSingleSongPlayback({ exceptOfficialAudio: audioPlayer });
          audioPlayer.play().catch(() => {});
          playBtn.innerHTML = MUSIC_PAUSE_ICON_SVG;
          card.classList.add('is-playing');
          _activeMusicAudio = audioPlayer; _activeMusicBtn = playBtn;
        } else {
          audioPlayer.pause();
          playBtn.innerHTML = MUSIC_PLAY_ICON_SVG;
          card.classList.remove('is-playing');
          if (_activeMusicAudio === audioPlayer) { _activeMusicAudio = null; _activeMusicBtn = null; }
        }
      });

      seek.addEventListener('input', () => {
        if (audioPlayer && audioPlayer.duration)
          audioPlayer.currentTime = (seek.value / 100) * audioPlayer.duration;
      });

      playerPanel.appendChild(playBtn);
      if (!song.mp3Url) mp3Bar.style.display = 'none';
      playerPanel.appendChild(mp3Bar);
      playerPanel.appendChild(mp3UpBtn);
    }

    expandWrap.appendChild(playerPanel);

    /* 歌詞欄 */
    let lyricsPanel = null;
    if (song.lyrics) {
      lyricsPanel = document.createElement('div');
      lyricsPanel.className = 'music-lyrics-panel';
      const lbl = document.createElement('div');
      lbl.className = 'music-lyrics-label';
      lbl.textContent = 'Lyrics';
      const lyrTxt = document.createElement('div');
      lyrTxt.className = 'music-lyrics-text';
      lyrTxt.textContent = song.lyrics;
      lyricsPanel.appendChild(lbl);
      lyricsPanel.appendChild(lyrTxt);
      expandWrap.appendChild(lyricsPanel);
    }

    const calcExpandWidth = () => { let w = 320; if (lyricsPanel) w += 420; return w; };

    // 停止指定卡片內的嵌入式 iframe（清空 src 以中斷播放）
    const stopCardEmbed = (targetCard) => {
      const iframe = targetCard.querySelector('.music-embed-wrap iframe');
      if (iframe) iframe.src = 'about:blank';
    };

    const openCard = () => {
      if (_activeMusicCard && _activeMusicCard !== card) {
        // 停止前一張卡片的嵌入式播放
        stopCardEmbed(_activeMusicCard);
        // 停止前一張卡片的 MP3 播放
        if (_activeMusicAudio) {
          _activeMusicAudio.pause();
          if (_activeMusicBtn) _activeMusicBtn.innerHTML = MUSIC_PLAY_ICON_SVG;
          _activeMusicAudio = null; _activeMusicBtn = null;
          _activeMusicCard.classList.remove('is-playing');
        }
        const prevWrap = _activeMusicCard.querySelector('.music-expand-wrap');
        if (prevWrap) prevWrap.style.width = '0';
        _activeMusicCard.classList.remove('is-open');
      }
      expandWrap.style.width = calcExpandWidth() + 'px';
      card.classList.add('is-open');
      _activeMusicCard = card;
      if (hasEmbed) enforceSingleSongPlayback({ exceptOfficialIframe: card.querySelector('.music-embed-wrap iframe') });
      // 重新開啟時還原 iframe src（若之前被清空）
      if (hasEmbed) {
        const iframe = card.querySelector('.music-embed-wrap iframe');
        if (iframe && iframe.dataset.origSrc && iframe.src !== iframe.dataset.origSrc) {
          iframe.src = iframe.dataset.origSrc;
        }
      }
    };
    const closeCard = () => {
      expandWrap.style.width = '0';
      card.classList.remove('is-open');
      if (_activeMusicCard === card) _activeMusicCard = null;
      // 停止嵌入式 iframe 播放
      stopCardEmbed(card);
      if (_activeMusicAudio) {
        _activeMusicAudio.pause();
        if (_activeMusicBtn) _activeMusicBtn.innerHTML = MUSIC_PLAY_ICON_SVG;
        _activeMusicAudio = null; _activeMusicBtn = null;
      }
      // 釋放 Audio buffer，避免反覆切換卡片時記憶體累積
      if (audioPlayer) {
        try { audioPlayer.pause(); audioPlayer.removeAttribute('src'); audioPlayer.load(); } catch {}
        audioPlayer = null;
      }
      card.classList.remove('is-playing');
    };

    vinylWrapper.addEventListener('click', () => {
      card.classList.contains('is-open') ? closeCard() : openCard();
    });

    card.appendChild(vinylWrapper);
    card.appendChild(coverDiv);
    card.appendChild(defaultSpace);
    card.appendChild(expandWrap);
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

$('music-cover-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file || _pendingCoverSongId === null) return;
  if (!String(file.type || '').startsWith('image/')) {
    e.target.value = '';
    _pendingCoverSongId = null;
    return;
  }
  const song = S.songs.find(s => s.id === _pendingCoverSongId);
  if (!song) { e.target.value = ''; _pendingCoverSongId = null; return; }
  // 存入前先壓縮（封面顯示最大 160px，800px 已綽綽有餘）
  const stored = await compressImage(file, 800);
  // 釋放舊的 objectURL
  revokeCoverUrl(song.id);
  // 建立新的 objectURL
  const objectUrl = URL.createObjectURL(stored);
  _coverUrlCache.set(song.id, objectUrl);
  song.cover = objectUrl;
  // 非同步存入 IDB
  idbPutCover({ songId: song.id, blob: stored, fileName: stored.name || '' })
    .catch(err => { console.warn('IDB cover write:', err); notifyStorageError(err, 'media'); });
  save();
  renderMusicPage();
  // 更新歌單編輯表單內的封面狀態文字（若正在編輯中），不再重新渲染整個列表以保留輸入內容
  const statusEl = document.getElementById(`cover-status-${song.id}`);
  if (statusEl) statusEl.textContent = t('song.uploadedCover');
  e.target.value = '';
  _pendingCoverSongId = null;
});

$('music-mp3-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file || _pendingMp3SongId === null) return;
  const song = S.songs.find(s => s.id === _pendingMp3SongId);
  if (!song) { e.target.value = ''; _pendingMp3SongId = null; return; }
  revokeMp3Url(song.id);
  if (song.mp3Url && String(song.mp3Url).startsWith('blob:')) URL.revokeObjectURL(song.mp3Url);
  const objectUrl = URL.createObjectURL(file);
  _mp3UrlCache.set(song.id, objectUrl);
  song.mp3Url = objectUrl;
  song.mp3FileName = file.name || '';
  idbPutMp3({ songId: song.id, blob: file, fileName: song.mp3FileName }).catch(err => { console.warn('IDB mp3 write:', err); notifyStorageError(err, 'media'); });
  save();
  renderMusicPage();
  
  // 更新歌單編輯表單內的狀態與鎖定邏輯，不再重新渲染整個列表以保留輸入內容
  const statusEl = document.getElementById(`mp3-status-${song.id}`);
  if (statusEl) statusEl.textContent = tf('song.uploadedAs', song.mp3FileName || t('song.mp3File'));
  
  const linkIn = document.getElementById(`url-input-${song.id}`);
  if (linkIn) {
    linkIn.disabled = true;
    linkIn.style.opacity = '0.5';
  }
  const clearUrlBtn = document.getElementById(`clear-url-${song.id}`);
  if (clearUrlBtn) clearUrlBtn.style.display = 'none';

  const mp3Btn = document.getElementById(`mp3-btn-${song.id}`);
  if (mp3Btn) mp3Btn.style.display = 'none';
  
  const mp3Clear = document.getElementById(`mp3-clear-${song.id}`);
  if (mp3Clear) mp3Clear.style.display = 'inline-flex';

  e.target.value = '';
  _pendingMp3SongId = null;
});

// 開啟「新增歌曲」編輯卡；若已有編輯中的卡片則捲動聚焦（右欄與官網 MUSIC 頁共用）
function startNewSong() {
  const existingNewIdx = S.songs.findIndex(s => s._isNew || s._isEditing);
  if (existingNewIdx !== -1) {
    const existingCard = document.querySelector(`.song-card[data-idx="${existingNewIdx}"]`);
    if (existingCard) {
      existingCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const firstInput = existingCard.querySelector('input.song-input, textarea.song-input');
      if (firstInput) firstInput.focus();
    }
    return;
  }
  S.songs.unshift({ id: uid(), title: '', url: '', lyrics: '', _isNew: true });
  renderSongsList();
  const newCard = document.querySelector('.song-card[data-idx="0"]');
  if (newCard) {
    const firstInput = newCard.querySelector('input.song-input, textarea.song-input');
    if (firstInput) firstInput.focus();
  }
}

$('music-add-btn').addEventListener('click', () => {
  // 切換到 Story Mode 歌單並打開新增表單
  switchMode('story');
  switchRightTab('songs');
  startNewSong();
});

/* ══════════════════════════════════════════════════════════
   TOUR PAGE
══════════════════════════════════════════════════════════ */
function renderTourPage() {
  const list = $('tour-list');
  list.innerHTML = '';

  // 合併 tourEvents（獨立新增）與 folder notes（cat=work）
  const workNotes = [];
  S.folders.forEach(f => {
    f.notes.forEach(n => {
      if (n.cat === 'work') {
        workNotes.push({
          id       : 'note_' + n.id,
          date     : n.date || '',
          time     : n.time     || '',
          title    : n.title    || t('tour.unnamedWork'),
          location : n.location || '',
          body     : n.body     || '',
          folderId : f.id,
          folderName: f.name,
          _fromNote: true,
        });
      }
    });
  });

  // 排序：有日期的先依日期升冪 + 時間升冪；無日期（TBD）排到最後
  const parseTimeKey = t => {
    if (!t) return 99999;
    const m = String(t).match(/(\d{1,2})\s*[:：]\s*(\d{1,2})/);
    if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    return 99998; // 「全天」之類字串排在有時間之後、TBD 之前
  };
  const all = [...SS.tourEvents, ...workNotes].sort((a, b) => {
    const aEmpty = !a.date, bEmpty = !b.date;
    if (aEmpty && !bEmpty) return 1;
    if (!aEmpty && bEmpty) return -1;
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return parseTimeKey(a.time) - parseTimeKey(b.time);
  });

  if (all.length === 0) {
    list.innerHTML = `<div class="tour-empty">${esc(t('tour.empty'))}<br><small>${esc(t('tour.emptyHint'))}</small></div>`;
    return;
  }

  // 今天（YYYY-MM-DD）— 用本地時區計算，避免時區位移
  const todayStr = toDateStr(new Date());

  all.forEach(evt => {
    const row = document.createElement('div');
    row.className = 'tour-row';

    // 日期
    const dateCell = document.createElement('div');
    dateCell.className = 'tour-date-cell';
    if (evt.date) {
      dateCell.innerHTML = `<div class="tour-date-main">${esc(evt.date)}</div>`;
    } else {
      dateCell.innerHTML = `<div class="tour-date-main">TBD</div>`;
    }

    // 工作內容（body 預覽：去換行、超過 50 字加 …）
    const titleCell = document.createElement('div');
    titleCell.className = 'tour-title-cell';
    let preview = '';
    if (evt.body) {
      const flat = evt.body.replace(/\s+/g, ' ').trim();
      preview = flat.length > 50 ? flat.slice(0, 50) + '…' : flat;
    }
    titleCell.innerHTML = `<div class="tour-title-main">${esc(evt.title)}</div>${preview ? `<div class="tour-body-preview">${esc(preview)}</div>` : ''}`;

    // 地點（唯讀顯示）
    const locCell = document.createElement('div');
    locCell.className = 'tour-location';
    locCell.textContent = evt.location || '—';

    // 時間（唯讀顯示）
    const timeCell = document.createElement('div');
    timeCell.className = 'tour-time-cell';
    timeCell.textContent = evt.time || '—';

    // 狀態 + 連結
    const linkCell = document.createElement('div');
    linkCell.className = 'tour-link-cell';

    // 狀態以「日期 vs 今天」判斷；無日期視為待定
    let status; // 'done' | 'upcoming' | 'tbd'
    if (!evt.date) status = 'tbd';
    else if (evt.date < todayStr) status = 'done';
    else status = 'upcoming';

    const folder = evt.folderId ? S.folders.find(f => f.id === evt.folderId) : null;
    const hasValidFolder = !!folder; // 防孤立 folderId

    const badge = document.createElement('span');
    badge.className = `tour-badge ${status}`;
    badge.textContent = status === 'done' ? t('tour.done') : status === 'tbd' ? t('tour.tbd') : t('tour.upcoming');
    linkCell.appendChild(badge);

    // 章節連結插槽（永遠保留位置以避免 ✎ 漂移）
    const chapterSlot = document.createElement('span');
    chapterSlot.className = 'tour-chapter-slot';
    if (hasValidFolder) {
      const chapterBtn = document.createElement('button');
      chapterBtn.className = 'tour-chapter-link';
      chapterBtn.textContent = `→ ${folder.name}`;
      chapterBtn.addEventListener('click', () => {
        switchMode('story');
        switchView(folder.id, folder.name);
      });
      chapterSlot.appendChild(chapterBtn);
    }
    linkCell.appendChild(chapterSlot);

    // ✎ 獨立為第 6 欄，固定在最右
    const editBtn = document.createElement('button');
    editBtn.className = 'tour-row-edit-btn';
    editBtn.textContent = '✎';
    editBtn.title = t('poster.edit');
    editBtn.addEventListener('click', () => openTourModal(evt.id));

    row.appendChild(dateCell);
    row.appendChild(titleCell);
    row.appendChild(locCell);
    row.appendChild(timeCell);
    row.appendChild(linkCell);
    row.appendChild(editBtn);
    list.appendChild(row);
  });
}

/* ── Tour Modal ── */
$('tour-add-btn').addEventListener('click', () => openTourModal(null));
$('tm-cancel').addEventListener('click', () => $('tour-modal-overlay').classList.remove('open'));
$('tour-modal-overlay').addEventListener('click', e => { if (e.target === $('tour-modal-overlay')) $('tour-modal-overlay').classList.remove('open'); });

function openTourModal(tourId) {
  SS.editingTourId = tourId;
  const isEdit = tourId !== null;

  // 判斷來源：note_ 前綴 → 從 folder notes 取資料
  let evt = null;
  let isFromNote = false;
  if (isEdit && String(tourId).startsWith('note_')) {
    isFromNote = true;
    const noteId = tourId.replace(/^note_/, '');
    for (const f of S.folders) {
      const n = f.notes.find(n => n.id === noteId);
      if (n) { evt = { ...n, folderId: f.id }; break; }
    }
  } else if (isEdit) {
    evt = SS.tourEvents.find(t => t.id === tourId) || null;
  }

  $('tour-modal-title').textContent = isEdit ? t('tm.titleEdit') : t('tm.titleAdd');
  $('tm-date').value     = evt?.date     || '';
  $('tm-time').value     = evt?.time     || '';
  $('tm-title').value    = evt?.title    || '';
  $('tm-location').value = evt?.location || '';
  $('tm-body').value     = evt?.body     || '';
  // 編輯模式才顯示刪除；_fromNote 的按鈕文字改為「前往章節」
  if (isEdit) {
    const delBtn = $('tm-del');
    delBtn.style.display = 'block';
    delBtn.textContent = isFromNote ? t('tour.toChapter') : t('modal.delete');
    delBtn.title = isFromNote ? t('tour.delNeedChapter') : '';
    delBtn.dataset.fromNote = isFromNote ? '1' : '';
  } else {
    $('tm-del').style.display = 'none';
  }

  // 填充資料夾選項：階層樹狀顯示（主資料夾 → 縮排子資料夾）
  const sel = $('tm-folder');
  fillFolderSelect(sel, t('tm.notLinked'));

  // 若 folderId 指到已刪除的 folder，補一個 placeholder option
  if (evt?.folderId && !S.folders.some(f => f.id === evt.folderId)) {
    const opt = document.createElement('option');
    opt.value = evt.folderId;
    opt.textContent = t('tm.deleted');
    sel.appendChild(opt);
  }
  sel.value = evt?.folderId || '';

  $('tour-modal-overlay').classList.add('open');
  setTimeout(() => $('tm-title').focus(), 50);
}

$('tm-save').addEventListener('click', () => {
  const data = {
    date     : $('tm-date').value,
    time     : $('tm-time').value.trim(),
    title    : $('tm-title').value.trim(),
    location : $('tm-location').value.trim(),
    body     : $('tm-body').value.trim(),
    folderId : $('tm-folder').value,
  };
  if (!data.title) {
    // 給使用者明確回饋：標題必填
    const inp = $('tm-title');
    inp.focus();
    inp.classList.add('tm-input-error');
    setTimeout(() => inp.classList.remove('tm-input-error'), 1200);
    return;
  }

  const now = Date.now();
  if (SS.editingTourId !== null && String(SS.editingTourId).startsWith('note_')) {
    // 寫回 folder note（保留 cat 等欄位，只更新工作行程相關欄位）
    const noteId = SS.editingTourId.replace(/^note_/, '');
    let saved = false;
    for (const f of S.folders) {
      const n = f.notes.find(n => n.id === noteId);
      if (n) {
        n.title    = data.title;
        n.date     = data.date;
        n.time     = data.time;
        n.location = data.location;
        n.body     = data.body;
        saved = true;
        break;
      }
    }
    if (!saved) return; // 找不到對應 note，中止
    save(); // S.folders → tak_fire_v2
  } else if (SS.editingTourId !== null) {
    const idx = SS.tourEvents.findIndex(t => t.id === SS.editingTourId);
    if (idx !== -1) SS.tourEvents[idx] = { ...SS.tourEvents[idx], ...data, updatedAt: now };
    saveSite();
  } else {
    SS.tourEvents.push({ id: uid(), ...data, createdAt: now, updatedAt: now });
    saveSite();
  }
  $('tour-modal-overlay').classList.remove('open');
  renderTourPage();
});

$('tm-del').addEventListener('click', () => {
  if (!SS.editingTourId) return;
  $('tour-modal-overlay').classList.remove('open');
  if ($('tm-del').dataset.fromNote === '1') {
    // 跳回對應章節，讓使用者在那邊操作
    const noteId = String(SS.editingTourId).replace(/^note_/, '');
    let targetFolder = null;
    for (const f of S.folders) {
      if (f.notes.find(n => n.id === noteId)) { targetFolder = f; break; }
    }
    if (targetFolder) {
      switchMode('story');
      switchView(targetFolder.id, targetFolder.name);
    }
  } else {
    SS.tourEvents = SS.tourEvents.filter(t => t.id !== SS.editingTourId);
    saveSite();
    renderTourPage();
  }
});

/* ══════════════════════════════════════════════════════════
   ABOUT PAGE
══════════════════════════════════════════════════════════ */
// 將元素變成可編輯欄位：blur 提交（trim 後傳給 onCommit）、單行時 Enter 結束、貼上強制純文字
function makeEditable(el, onCommit, { singleLine = true } = {}) {
  el.contentEditable = 'true';
  el.addEventListener('blur', () => onCommit(el.textContent.trim()));
  if (singleLine) el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  el.addEventListener('paste', e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });
}

function renderAbout() {
  const grid = $('members-grid');
  grid.innerHTML = '';
  SS.members.forEach((m, idx) => {
    const card = document.createElement('div');
    card.className = 'member-card';
    card.style.animationDelay = `${idx * 0.1}s`;

    const photo = document.createElement('div');
    photo.className = 'member-photo';
    if (m.photo) {
      const img = document.createElement('img');
      img.src = m.photo;
      photo.appendChild(img);
    } else {
      photo.textContent = '♪';
    }
    photo.title = t('member.photoTip');
    photo.style.cursor = 'pointer';
    photo.addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        if (!SS.members[idx].id) SS.members[idx].id = uid();
        const key = `member_photo_${SS.members[idx].id}`;
        // 存入前先壓縮
        const stored = await compressImage(file, IMG_MAX_EDGE);
        // 釋放舊的 objectURL
        if (m.photo && m.photo.startsWith('blob:')) URL.revokeObjectURL(m.photo);
        // 存入 IDB
        await idbPutAsset(key, stored).catch(err => { console.warn('IDB member photo write:', err); notifyStorageError(err, 'media'); });
        // 建立新的 objectURL
        const objectUrl = URL.createObjectURL(stored);
        SS.members[idx].photo = objectUrl;
        saveSite();
        renderAbout();
      };
      inp.click();
    });

    const info = document.createElement('div');
    info.className = 'member-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'member-name';
    nameEl.textContent = m.name;
    nameEl.title = t('member.nameTip');
    makeEditable(nameEl, val => { SS.members[idx].name = val || m.name; saveSite(); });

    const roleEl = document.createElement('div');
    roleEl.className = 'member-role';
    roleEl.textContent = m.role;
    roleEl.title = t('member.roleTip');
    makeEditable(roleEl, val => { SS.members[idx].role = val || m.role; saveSite(); });

    const statsEl = document.createElement('div');
    statsEl.className = 'member-stats';
    ['height', 'mbti', 'zodiac'].forEach(key => {
      const row = document.createElement('div');
      row.className = 'member-stat';
      row.textContent = m[key] || '';
      makeEditable(row, val => { SS.members[idx][key] = val; saveSite(); });
      statsEl.appendChild(row);
    });

    const bioEl = document.createElement('div');
    bioEl.className = 'member-bio';
    bioEl.textContent = m.bio;
    bioEl.title = t('member.bioTip');
    makeEditable(bioEl, val => { SS.members[idx].bio = val || m.bio; saveSite(); }, { singleLine: false });

    info.appendChild(nameEl);
    info.appendChild(roleEl);
    info.appendChild(bioEl);
    info.appendChild(statsEl);

    card.appendChild(photo);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

/* ── Mobile Drawers ── */
(function initMobileDrawers() {
  const isMobile = () => window.innerWidth <= 768;
  const closeDrawers = () => document.body.classList.remove('mobile-left-open', 'mobile-right-open');

  $('mobile-left-btn').addEventListener('click', () => {
    document.body.classList.remove('mobile-right-open');
    document.body.classList.toggle('mobile-left-open');
  });
  $('mobile-right-btn').addEventListener('click', () => {
    document.body.classList.remove('mobile-left-open');
    document.body.classList.toggle('mobile-right-open');
  });
  $('mobile-drawer-overlay').addEventListener('click', closeDrawers);

  // 選好資料夾後自動收起左抽屜，直接看故事內容
  $('folder-list').addEventListener('click', e => {
    if (isMobile() && e.target.closest('.folder-item')) closeDrawers();
  });
  // 切到官網模式時收起抽屜
  $('btn-site-mode').addEventListener('click', closeDrawers);

  // 手機上不套用桌面的欄位收合／全螢幕狀態，避免主畫面被藏住
  const resetDesktopColumnStates = () => {
    if (!isMobile()) return;
    $('col-mid')?.classList.remove('collapsed');
    $('col-right')?.classList.remove('collapsed');
    document.body.classList.remove('mid-fullscreen', 'right-fullscreen');
  };
  resetDesktopColumnStates();
  window.addEventListener('resize', () => {
    if (!isMobile()) closeDrawers();
    else resetDesktopColumnStates();
  });
})();

}).catch(() => {});

try { lsRemove('tak_fire_posters'); } catch(e) {}
