<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Take Fire Official Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>

/* ── Color Tokens ──────────────────────────────────────── */
:root {
  color-scheme: dark;
  /* 主題主色 — Jazz (深色) 預設 */
  --c-primary        : #d4d4d4;
  --c-primary-rgb    : 180 180 200;
  --c-button         : #558bff;
  --c-primary-user   : #2a2a2a;
  --c-primary-char   : #1a1a1a;

  /* 透明度衍生 */
  --c-primary-mute   : rgb(var(--c-primary-rgb) / 0.1);
  --c-primary-border : rgb(var(--c-primary-rgb) / 0.12);

  /* 火焰特效色 */
  --c-fire           : 220 60 0;

  /* 中性色系 — 深色 */
  --c-bg             : #121212;
  --c-bg-rgb         : 18 18 18;
  --c-text           : #e0e0e0;
  --c-text-rgb       : 224 224 224;
  --c-text-action    : #aaaaaa;
  --c-text-mute      : #888888;

  /* 功能說明文字 */
  --c-hint           : #666666;

  /* 功能色 */
  --c-danger         : #d9534f;
  --c-danger-rgb     : 217 83 79;

  /* 陰影（以 shadow-color 為基底，加深透明度建立立體層次） */
  --shadow-color     : 200 200 180;
  --shadow-sm        : 0 2px 4px  rgb(var(--shadow-color) / 0.08);
  --shadow-md        : 0 6px 8px rgb(var(--shadow-color) / 0.12);
  --shadow-lg        : 0 12px 32px rgb(var(--shadow-color) / 0.18);
  --shadow-float     : 0 8px 24px rgb(var(--shadow-color) / 0.25);

  /* 日曆分類 bar 色（固定，不跟主題換） */
  --c-cat-life       : #60dd6b;
  --c-cat-date       : #ff93d2;
  --c-cat-work       : #0284fd;
  --c-cat-plot       : #f7bd00;

  /* 圓角 */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
}

/* ── Reset & Base ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, select, textarea { font-family: inherit; }

body {
  /* 陰影聚合變數必須在 body 解析，主題在 body[data-theme] 覆寫的 --shadow-color 才會生效 */
  --shadow-sm: 0 2px 4px  rgb(var(--shadow-color) / 0.08);
  --shadow-md: 0 6px 8px rgb(var(--shadow-color) / 0.12);
  --shadow-lg: 0 12px 32px rgb(var(--shadow-color) / 0.18);
  background: var(--c-bg);
  color: var(--c-text);
  font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
  height: 100vh;
  display: flex;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.6;
  letter-spacing: 0.3px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* ── Elegant Scrollbar ─────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { 
  background: rgb(var(--c-text-rgb, 0 0 0) / 0.15); 
  border-radius: 8px; 
}
::-webkit-scrollbar-thumb:hover { 
  background: rgb(var(--c-text-rgb, 0 0 0) / 0.30); 
}

/* ── Modern Button Base ────────────────────────────────── */
.btn-modern {
  width: 100%;
  padding: 10px 12px;
  background: var(--c-primary-mute);
  color: var(--c-primary);
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  transition: background 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-modern:hover { 
  background: rgb(var(--c-primary-rgb) / 0.12);
}
.btn-modern.dashed {
  background: transparent;
  border: 1.5px dashed var(--c-primary-border);
  color: var(--c-text-mute);
}
.btn-modern.dashed:hover {
  border-color: var(--c-primary);
  color: var(--c-primary);
  background: var(--c-primary-mute);
}

/* ══════════════════════════════════════════════════════════
   LEFT COLUMN
══════════════════════════════════════════════════════════ */
#col-left {
  width: 240px;
  flex-shrink: 0;
  background: transparent;
  box-shadow: inset -1px 0 0 rgb(var(--c-primary-rgb) / 0.10);
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  gap: 6px;
  overflow: hidden;
  height: 100%;
  border-right: none;
}

#folder-list {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding-right: 6px;
}

.upload-btn {
  background: transparent;
  color: var(--c-text-mute);
  justify-content: center;
  box-shadow: none;
  border: 1.5px dashed var(--c-primary-border);
  margin-bottom: 8px;
  padding: 8px 12px;
  font-size: 13px;
}
.upload-btn:hover {
  background: var(--c-primary-mute);
  color: var(--c-primary);
  border-color: var(--c-primary);
}

.sec-header-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 12px 4px 6px;
}

.sec-label {
  font-size: 11px;
  color: var(--c-hint);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 500;
}

/* Folder items */
.folder-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--c-text);
  font-size: 13px;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  user-select: none;
  position: relative;
  border: 1px solid transparent; /* 預留邊框空間，避免 hover 時跳動 */
}
/* 共用：主色 mute 背景 + 主色文字（互動 hover 反饋） */
.folder-item:hover,
.cal-day:hover > span,
.note-action-btn:hover,
.folder-menu-item:hover,
.tour-row-edit-btn:hover { background: var(--c-primary-mute); color: var(--c-primary); }

/* 使活躍資料夾看起來像張卡片 */
.folder-item.active { 
  background: var(--c-primary-mute);
  color: var(--c-primary); 
  font-weight: 600; 
  border-color: rgb(var(--c-primary-rgb) / 0.15);
  box-shadow: var(--shadow-sm);
}
.folder-item.drag-over {
  background: var(--c-primary-mute);
  outline: 2px dashed var(--c-primary);
  outline-offset: -2px;
  color: var(--c-primary);
}

.folder-icon { font-size: 15px; flex-shrink: 0; opacity: 0.8; display: flex; align-items: center; justify-content: center; }
.active .folder-icon { opacity: 1; }
.folder-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-count { 
  font-size: 11px; 
  color: var(--c-text-mute); 
  flex-shrink: 0;
  background: rgb(var(--c-text-rgb, 0 0 0) / 0.08);
  padding: 2px 6px;
  border-radius: 8px;
}
.active .folder-count {
  background: rgb(var(--c-primary-rgb) / 0.20);
  color: var(--c-primary);
}

.folder-btns { display: none; gap: 2px; flex-shrink: 0; }
.folder-item:hover .folder-btns { display: flex; }

.icon-btn {
  background: none;
  border: none;
  color: var(--c-text-mute);
  cursor: pointer;
  padding: 4px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1;
  transition: background 0.15s ease, color 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover { color: var(--c-primary); background: var(--c-primary-mute); }

.new-folder-input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  background: transparent;
}

.new-folder-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--c-text);
  font-size: 13px;
  font-family: inherit;
  min-width: 0;
}
.new-folder-input::placeholder { color: var(--c-text-mute); }

.new-folder-hint {
  font-size: 12px;
  font-weight: 500;
  color: var(--c-hint);
  padding: 6px 4px 0;
  letter-spacing: 0.5px;
}

/* ══════════════════════════════════════════════════════════
   MIDDLE COLUMN
══════════════════════════════════════════════════════════ */
#col-mid {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  position: relative;
  /* 賦予中間主舞台明顯的邊界與陰影，區分左右兩欄 */
  z-index: 10;
  box-shadow: 0 0 32px rgb(var(--shadow-color) / 0.08);
  border-left: 1px solid rgb(var(--c-text-rgb) / 0.06);
  border-right: 1px solid rgb(var(--c-text-rgb) / 0.06);
}
#col-mid.collapsed {
  flex: 0 0 34px;
  width: 34px;
  min-width: 34px;
}
#col-mid.collapsed > :not(.col-toggle-btn) { display: none !important; }

#mid-header {
  padding: 16px 24px;
  background: rgb(var(--c-bg-rgb) / 0.80);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgb(var(--c-text-rgb) / 0.04);
  font-size: 16px;
  color: var(--c-text);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 10;
}
#mid-header-title { font-weight: 600; letter-spacing: 0.5px; }

#message-list {
  flex: 1;
  overflow-y: auto;
  padding: 24px 60px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  z-index: 2;
}

/* ── Message Blocks ──────────────────────────────────── */
.msg-row {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  user-select: none;
  cursor: pointer;
  transition: background 0.2s;
  padding: 24px 16px;
  margin: 0 -16px;
  content-visibility: auto;
  contain-intrinsic-size: auto 100px;
  border-bottom: none;
}
.msg-row.player { flex-direction: row-reverse; }

.msg-row:hover {
  border-radius: var(--radius-lg);
}

.msg-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--c-primary-mute);
  color: var(--c-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 16px;
  flex-shrink: 0;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.msg-avatar img { 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
  border-radius: 50%; 
}
.msg-row.player .msg-avatar { display: flex; }

.msg-col {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 75%;
  min-width: 0;
}
.msg-row.player .msg-col { align-items: flex-end; }

.msg-name {
  font-size: calc(11px * var(--font-scale, 1));
  color: var(--c-text-mute);
  padding: 0 4px;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.msg-row.player .msg-name { display: block; text-align: right; }

.msg-wrap {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.msg-row.player .msg-wrap { flex-direction: row-reverse; }

.msg-time {
  font-size: calc(10px * var(--font-scale, 1));
  color: rgb(var(--c-text-rgb, 0 0 0) / 0.35);
  flex-shrink: 0;
  align-self: flex-end;
  margin-bottom: 4px;
  white-space: nowrap;
  font-weight: 500;
}

/* Modern Bubble */
.msg-bubble {
  border-radius: var(--radius-xl);
  padding: 14px 20px;
  line-height: 1.6;
  font-size: calc(14.5px * var(--font-scale, 1));
  border: 1px solid rgb(var(--c-primary-rgb) / 0.25);
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
  word-break: break-word;
}

.msg-row.character .msg-bubble {
  background: var(--c-primary-char);
  border-bottom-left-radius: 6px;
}
.msg-row.player .msg-bubble {
  background: var(--c-primary-user);
  border-bottom-right-radius: 6px;
  color: var(--c-text);
}

/* Hover Effect */
.msg-row:hover .msg-bubble {
  box-shadow: var(--shadow-md);
}

/* Selection */
.msg-row.sel-range,
.msg-system-divider.sel-range {
  background: rgb(var(--c-primary-rgb) / 0.08);
  border-radius: var(--radius-sm);
}
.msg-row.sel-range .msg-bubble,
.msg-system-divider.sel-range .msg-system-text {
  outline: 2px solid rgb(var(--c-primary-rgb) / 0.6);
  outline-offset: 1px;
}
.msg-row.sel-anchor,
.msg-system-divider.sel-anchor {
  background: rgb(var(--c-primary-rgb) / 0.07);
  border-radius: var(--radius-sm);
}
.msg-row.sel-anchor .msg-bubble,
.msg-system-divider.sel-anchor .msg-system-text {
  outline: 2.5px solid rgb(var(--c-primary-rgb) / 0.9);
  outline-offset: 1px;
}
.msg-row.dragging,
.msg-system-divider.dragging { opacity: 0.8; }

/* Text */
.t-speech { color: inherit; }
.t-action  { color: var(--c-text-action); opacity: 0.85; }

.bubble-line { display: block; }
.bubble-blank { line-height: 1; }

.bubble-divider {
  border: none;
  border-top: 1px solid rgb(var(--c-text-rgb, 0 0 0) / 0.12);
  margin: 12px 0;
}

.msg-separator {
  text-align: center;
  color: rgb(var(--c-text-rgb, 0 0 0) / 0.25);
  letter-spacing: 12px;
  font-size: 14px;
  padding: 24px 0;
  cursor: default;
  user-select: none;
  content-visibility: auto;
  contain-intrinsic-size: auto 70px;
}

.msg-system-divider {
  margin: 20px 0 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
  border-radius: var(--radius-lg);
  content-visibility: auto;
  contain-intrinsic-size: auto 80px;
}
.msg-system-divider::before,
.msg-system-divider::after {
  content: '';
  width: min(480px, 92%);
  height: 1px;
  background: rgb(var(--c-primary-rgb) / 0.25);
}
.msg-system-text {
  max-width: min(560px, 92%);
  width: min(560px, 92%);
  text-align: center;
  color: #fff;
  font-size: calc(14.5px * var(--font-scale, 1));
  line-height: 1.6;
  white-space: pre-wrap;
  padding: 12px 20px;
  /* 不使用底色，統一白色文字 + 黑色光暈（halo），在任何背景圖與主題下都清晰可辨。
     以多層、由濃到淡、半徑漸大的柔和陰影堆疊，加上一點向下偏移，讓光暈更自然不死硬。 */
  text-shadow:
    0 1px 2px rgb(0 0 0 / 0.55),
    0 0 6px rgb(0 0 0 / 0.45),
    0 0 12px rgb(0 0 0 / 0.4),
    0 0 20px rgb(0 0 0 / 0.3);
}
/* 系統訊息內的動作描述文字（*...*）統一白字，避免淺色/粉色主題下的特殊色配黑光暈看不清 */
.msg-system-text .t-action { color: #fff; opacity: 1; }

.empty-state {
  text-align: center;
  color: var(--c-hint);
  padding: 100px 24px;
  font-size: 13px;
  font-weight: 500;
  line-height: 2.0;
}
.empty-state small { font-size: 12px; display: block; margin-top: 8px; color: var(--c-hint); }

/* ══════════════════════════════════════════════════════════
   RIGHT COLUMN
══════════════════════════════════════════════════════════ */
#col-right {
  width: 280px;
  flex-shrink: 0;
  background: transparent;
  box-shadow: inset 1px 0 0 rgb(var(--c-primary-rgb) / 0.10);
  border-left: none;
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: opacity 0.2s;
}
#col-right.collapsed {
  width: 34px !important;
  min-width: 34px;
}
#col-right.collapsed > :not(.col-toggle-btn) { display: none !important; }

/* ── Right Tab Display Toggles ── */
#col-right[data-tab="events"] #song-list { display: none !important; }
#col-right[data-tab="songs"] #right-calendar-wrap,
#col-right[data-tab="songs"] #note-list { display: none !important; }

.right-tabs {
  display: flex;
  background: rgb(var(--c-text-rgb, 0 0 0) / 0.04);
  padding: 8px 8px 0;
  gap: 4px;
  flex-shrink: 0;
}
.right-tab {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--c-text-mute);
  transition: background 0.2s, color 0.2s;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  outline: none;
  font-family: inherit;
}
.right-tab:hover { color: var(--c-primary); background: rgb(var(--c-primary-rgb) / 0.08); }

/* 選取標籤加上實體色與指示線，讓層次更分明 */
.right-tab.active {
  color: var(--c-primary);
  font-weight: 600;
  background: var(--c-bg);
  box-shadow: 0 -4px 12px rgb(var(--shadow-color) / 0.06);
  position: relative;
}
.right-tab.active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--c-primary);
  border-radius: 2px 2px 0 0;
}

/* ── Calendar Grid in Right Column ── */
#right-calendar-wrap {
  padding: 16px;
  border-bottom: none;
  background: transparent;
  flex-shrink: 0;
}
.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-weight: 600;
  font-size: 14px;
  color: var(--c-text);
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--c-text-mute);
  margin-bottom: 8px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  column-gap: 0;
  row-gap: 0;
}
.cal-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 12px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s, color 0.2s;
  font-weight: 500;
  padding: 6px 2px 12px;
  min-height: 42px;
}
.cal-day > span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-bottom: 4px;
}
.cal-day.muted { color: rgb(var(--c-text-rgb, 0 0 0) / 0.25); font-weight: 400; }
.cal-day.has-event > span { color: var(--c-text); }
.cal-day.today > span {
  background: var(--c-button) !important;
  color: #fff !important;
  box-shadow: 0 2px 8px rgb(var(--c-primary-rgb) / 0.40);
}

/* ── Calendar Collapse ── */
#cal-body-container {
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#cal-body-container.collapsed {
  grid-template-rows: 0fr;
}
#cal-body-wrap {
  min-height: 0;
  overflow: hidden;
  padding-bottom: 4px; /* 給予收起時的一點緩衝 */
}

/* ── Calendar Continuous Events (Bars) ── */
.cal-events {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 2px;
  pointer-events: none;
  flex-shrink: 0;
}
.cal-more {
  font-size: 9px;
  color: rgb(var(--c-text-rgb, 0 0 0) / 0.45);
  text-align: center;
  line-height: 1;
  pointer-events: auto;
  cursor: pointer;
  padding: 1px 0;
}
.cal-bar {
  height: 6px;
  pointer-events: auto;
  cursor: pointer;
  transition: opacity 0.2s;
  opacity: 0.85;
}
.cal-bar:hover { opacity: 1; }
.cal-bar.empty { background: transparent; pointer-events: none; }

.cal-bar.single { border-radius: 4px; margin: 0 4px; }
.cal-bar.start  { border-top-left-radius: 4px; border-bottom-left-radius: 4px; margin-left: 4px; margin-right: 0; }
.cal-bar.end    { border-top-right-radius: 4px; border-bottom-right-radius: 4px; margin-left: 0; margin-right: 4px; }
.cal-bar.mid    { margin: 0; border-radius: 0; }

.bar-life { background: var(--c-cat-life); }
.bar-date { background: var(--c-cat-date); }
.bar-work { background: var(--c-cat-work); }
.bar-plot { background: var(--c-cat-plot); }

/* ── Note List & Song List ───────────────────────────────── */
#note-list, #song-list {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

#song-list {
  padding: 16px 20px; /* 增加左右 padding 讓面板窄一點點 */
}

.right-empty {
  color: var(--c-hint);
  font-size: 12px;
  font-weight: 500;
  padding: 24px 12px;
  text-align: center;
  line-height: 1.8;
}
.col-toggle-btn {
  position: absolute;
  top: 10px;
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--c-text-mute);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  transition: background 0.2s, color 0.2s;
}
.col-toggle-btn:hover,
.col-toggle-btn:focus-visible,
.col-toggle-btn:active {
  color: var(--c-primary);
  background: rgb(var(--c-primary-rgb) / 0.18);
}
.col-toggle-btn svg { width: 14px; height: 14px; fill: currentColor; }
#toggle-mid-col { right: 8px; }
#toggle-right-col { left: 10px; }

body.mid-fullscreen #resizer-right,
body.mid-fullscreen #col-right { display: none !important; }
body.right-fullscreen #resizer-right,
body.right-fullscreen #col-mid,
body.right-fullscreen #resizer-left { display: none !important; }
body.mid-fullscreen #col-mid,
body.right-fullscreen #col-right {
  flex: 1 1 auto !important;
  width: auto !important;
  min-width: 0 !important;
}

/* Modern Note Card (Solid Surface for hierarchy) */
.note-card {
  position: relative;
  background: linear-gradient(0deg, rgb(var(--c-primary-rgb) / 0.05), rgb(var(--c-primary-rgb) / 0.05)), var(--c-bg);
  border-radius: 8px var(--radius-lg) var(--radius-lg) var(--radius-lg);
  padding: 16px 20px 16px 24px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color 0.2s;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgb(var(--c-primary-rgb) / 0.12);
  overflow: hidden;
  min-width: 0;
}
.note-card:hover {
  border-color: rgb(var(--c-primary-rgb) / 0.28);
}

.note-color-bar {
  position: absolute;
  left: -1px;
  top: 24px;
  width: 4px;
  height: 24px;
  background: var(--note-color, var(--c-primary));
  border-radius: 0 4px 4px 0;
}

/* ── 新版事件排版 ── */
.note-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.note-title-inline {
  background: transparent; border: none; color: var(--c-text); font-size: 16px; font-weight: 700; outline: none; flex: 1; min-width: 0; letter-spacing: 0.5px; padding: 0; font-family: inherit; margin-top: 0; overflow: hidden; text-overflow: ellipsis;
}
.note-title-inline::placeholder { color: var(--c-text-mute); font-weight: 500; }

.note-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.2s;
  flex-shrink: 0;
}
.note-card:hover .note-actions { opacity: 1; }

.note-action-btn {
  width: 26px; height: 26px;
  border-radius: 8px; background: transparent; border: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--c-text-mute); font-size: 13px; cursor: pointer; transition: background 0.2s, color 0.2s;
}
.note-action-btn.danger:hover { background: rgb(var(--c-danger-rgb)/0.1); color: var(--c-danger); }

.note-meta-row {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--note-color, var(--c-text-mute));
  margin-top: 2px;
  flex-wrap: wrap;
  min-width: 0;
}

.note-date-inline {
  background: transparent; border: none; color: inherit; font-family: inherit; font-size: inherit; font-weight: inherit; padding: 0 1px 0 0; outline: none; cursor: pointer; letter-spacing: 0.4px; width: 100px; min-width: 0; flex-shrink: 1;
}
.note-date-inline::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; margin-left: 0; }

.note-cat-inline {
  background: transparent; border: none; color: inherit; font-family: inherit; font-size: inherit; font-weight: inherit; padding: 0; outline: none; cursor: pointer; appearance: none; min-width: 3em; flex-shrink: 0;
}
.note-cat-inline option { color: var(--c-text); background: var(--c-bg); }

.note-body-inline {
  background: transparent; border: none; color: var(--c-text); font-size: 13.5px; outline: none; width: 100%; min-height: 40px; resize: none; overflow: hidden; line-height: 1.6; padding: 0; font-family: inherit; margin-top: 6px;
}
.note-body-inline::placeholder { color: rgb(var(--c-text-rgb, 0 0 0) / 0.3); }
.note-body-preview {
  color:  var(--c-text);
  font-size: 13.5px;
  line-height: 1.6;
  margin-top: 6px;
  white-space: pre-wrap;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  cursor: pointer;
}
.note-body-preview.empty { color: rgb(var(--c-text-rgb, 0 0 0) / 0.35); font-style: italic; }

/* ── Songs specific styles (Solid Surface) ── */
.song-card {
  background: var(--c-bg); 
  border-radius: 8px; 
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transition: box-shadow 0.2s, transform 0.2s;
  box-shadow: 0 4px 16px rgb(var(--shadow-color) / 0.05), inset 0 0 0 1px rgb(var(--c-primary-rgb) / 0.10);
  overflow: hidden;
  flex-shrink: 0;
  cursor: grab;
}
.song-card:active { cursor: grabbing; }
.song-card.dragging { opacity: 0.4; transform: scale(0.98); pointer-events: none; }
.song-card.drag-over-top { box-shadow: 0 -4px 0 var(--c-primary), 0 4px 16px rgb(var(--shadow-color) / 0.05) !important; border-radius: 4px 4px 8px 8px; }
.song-card.drag-over-bottom { box-shadow: 0 4px 0 var(--c-primary), 0 4px 16px rgb(var(--shadow-color) / 0.05) !important; border-radius: 8px 8px 4px 4px; }

.song-card:hover {
  box-shadow: 0 8px 24px rgb(var(--shadow-color) / 0.08), inset 0 0 0 1px rgb(var(--c-primary-rgb) / 0.20);
}

/* ── Songs Form & Display Styles ── */
.btn-pill-solid {
  background: var(--c-button);
  color: #fff;
  padding: 8px 18px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 12px rgb(var(--c-primary-rgb) / 0.25);
  transition: box-shadow 0.2s, transform 0.2s;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.btn-pill-solid:hover { box-shadow: 0 6px 16px rgb(var(--c-primary-rgb) / 0.35); }

.song-edit-form { display: flex; flex-direction: column; gap: 20px; cursor: default; }
.song-form-title { font-size: 18px; font-weight: 700; color: var(--c-text); margin-bottom: 4px; letter-spacing: 0.5px; }
.song-field,
.lyric-wrapper { display: flex; flex-direction: column; gap: 8px; }
.song-label { font-size: 11px; font-weight: 700; color: var(--c-hint); letter-spacing: 0.5px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
.song-input {
  background: rgb(var(--c-text-rgb, 0 0 0) / 0.03); /* 更乾淨的淺灰色底 */
  border: 1px solid transparent;
  color: var(--c-text);
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: border 0.2s, background 0.2s;
}
.song-input:focus { border-color: var(--c-primary); background: var(--c-bg); box-shadow: 0 0 0 3px rgb(var(--c-primary-rgb) / 0.1); }
.song-input::placeholder { color: var(--c-text-mute); opacity: 0.6; }
.song-textarea { resize: vertical; min-height: 120px; line-height: 1.6; max-height: 250px; overflow-y: auto; }
.song-textarea::-webkit-scrollbar { width: 4px; }
.song-textarea::-webkit-scrollbar-thumb { background: rgb(var(--c-text-rgb, 0 0 0) / 0.15); border-radius: 4px; }

/* 編輯歌曲時，讓歌詞輸入區可向下延展到接近視窗底部 */
.song-card.is-editing {
  min-height: calc(100vh - 220px);
  min-height: calc(100dvh - 220px);
}
.song-card.is-editing .song-edit-form {
  flex: 1;
  min-height: 0;
}
.song-card.is-editing .lyric-field {
  flex: 1;
  min-height: 0;
}
.song-card.is-editing .song-textarea {
  flex: 1;
  min-height: 260px;
  max-height: none;
}
.song-card.is-editing .song-actions {
  margin-top: auto;
}

.song-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.song-actions-right { display: flex; gap: 8px; } /* 縮小按鈕間距 */
.song-upload-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.song-mp3-upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid rgb(var(--c-text-rgb, 0 0 0) / 0.12);
  background: rgb(var(--c-text-rgb, 0 0 0) / 0.03);
  color: var(--c-text-mute);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.song-mp3-upload-btn:hover {
  border-color: rgb(var(--c-primary-rgb) / 0.4);
  color: var(--c-primary);
  background: rgb(var(--c-primary-rgb) / 0.08);
}
.song-mp3-upload-btn svg { flex-shrink: 0; }
.song-mp3-status { font-size: 12px; color: var(--c-hint); text-align: right; word-break: break-all; }
.song-btn-cancel { background: rgb(var(--c-text-rgb, 0 0 0) / 0.06); color: var(--c-text-mute); padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; font-size: 13px; }
.song-btn-cancel:hover { background: rgb(var(--c-text-rgb, 0 0 0) / 0.1); color: var(--c-text); }
.song-btn-save { background: var(--c-button); color: #fff; padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgb(var(--c-primary-rgb)/0.25); transition: box-shadow 0.2s, transform 0.2s; white-space: nowrap; font-size: 13px; }
.song-btn-save:hover { box-shadow: 0 6px 16px rgb(var(--c-primary-rgb)/0.35); }
.song-btn-del { background: transparent; color: var(--c-danger); padding: 8px 4px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 13px; white-space: nowrap; }
.song-btn-del:hover { background: rgb(var(--c-danger-rgb) / 0.1); }

/* ── JS 動態建立元素的樣式（自 inline style 整理至此） ── */
.songs-panel-title { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.song-url-clear { background: rgb(var(--c-text-rgb, 0 0 0) / 0.06); border: none; color: var(--c-text-mute); cursor: pointer; padding: 8px 12px; font-size: 12px; border-radius: 8px; font-weight: 600; white-space: nowrap; transition: background 0.2s; }
.song-url-clear:hover { background: rgb(var(--c-text-rgb, 0 0 0) / 0.12); }
.song-view-cover { width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--c-primary-char); }
.song-view-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.icon-picker-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--c-primary-border); background: transparent; transition: background 0.15s, border-color 0.15s; }
.icon-picker-cell.selected { border: 2px solid var(--c-primary); background: var(--c-primary-mute); }
.poster-edit-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgb(0 0 0 / 0.55); border: none; color: #fff; font-size: 13px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10; }
.poster-cell:hover .poster-edit-btn { display: flex; }

/* ── View Mode Specific ── */
.song-embed-wrap { width: 100%; border-radius: var(--radius-sm); overflow: hidden; background: var(--c-primary-char); display: none; border: none; }
.song-embed-wrap iframe { width: 100%; border: none; display: block; }
.lyric-toggle {
  background: rgb(var(--c-text-rgb, 0 0 0) / 0.04); border: none; border-radius: var(--radius-sm); padding: 10px 14px; color: var(--c-text-mute);
  display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s, color 0.2s; font-family: inherit;
}
.lyric-toggle:hover { background: rgb(var(--c-text-rgb, 0 0 0) / 0.08); color: var(--c-text); }
.lyric-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.lyric-content.expanded { grid-template-rows: 1fr; }
.lyric-inner { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.song-lyrics-display {
  font-size: 14px; line-height: 1.8; color: var(--c-text-mute); white-space: pre-wrap; word-break: break-word;
  padding: 12px 14px; background: rgb(var(--c-text-rgb, 0 0 0) / 0.03); border-radius: var(--radius-sm);
  cursor: pointer;
}

/* 檢視模式：封面+播放器（左）與歌詞（右）固定左右分欄，收合/展開都一致 */
.song-card { container-type: inline-size; }
.song-view-body { display: flex; flex-direction: row; align-items: flex-start; gap: 16px; }
/* 封面與播放器固定窄欄，避免在寬面板被撐成超大 */
.song-media { display: flex; flex-direction: column; gap: 16px; min-width: 0; flex: 0 0 320px; max-width: 320px; }
.song-view-body .lyric-wrapper { flex: 1 1 auto; min-width: 0; min-height: 0; }
/* 卡片本身夠窄時（例如未收合左側故事檢視）回到上下排列，避免封面被擠壓 */
@container (max-width: 560px) {
  .song-view-body { flex-direction: column; }
  .song-media { flex: none; max-width: none; }
}

/* ── Settings: Avatars & Background ─────────────────── */
.settings-divider {
  border: none;
  border-top: 1px solid var(--c-primary-border);
  margin: 12px 0;
}

.avatar-row {
  display: flex;
  gap: 8px;
  padding: 4px 0;
}

.avatar-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  flex: 1 1 0;
  min-width: 0;
}

.avatar-slot-img {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1.5px dashed var(--c-primary-border);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--c-text-mute);
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
  position: relative;
}
.avatar-slot:hover .avatar-slot-img {
  border-color: var(--c-primary);
  background: var(--c-primary-mute);
  color: var(--c-primary);
}
.avatar-slot-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
}
/* 有圖片時，hover 顯示相機覆蓋層 */
.avatar-slot-img .avatar-hover-overlay {
  position: absolute;
  inset: 0;
  border-radius: 6px;
  background: rgb(0 0 0 / 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
  color: #fff;
}
.avatar-slot:hover .avatar-slot-img .avatar-hover-overlay { opacity: 1; }

.avatar-slot-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--c-hint);
  text-align: center;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: text;
}

/* ── Background Image in Middle Column ──────────────── */
#mid-bg {
  position: absolute;
  inset: 0 -1px; /* -1px 蓋過 col-mid 的 1px 邊框，避免縫隙透出未模糊背景 */
  background-size: cover;
  background-position: center;
  z-index: 0;
  display: none;
  transition: opacity 0.5s;
}
#mid-overlay {
  position: absolute;
  inset: 0 -1px; /* 同上 */
  background: rgb(var(--c-bg-rgb) / 0.10);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1;
  display: none;
  pointer-events: none;
}
body.has-bg #mid-bg,
body.has-bg #mid-overlay {
  display: block;
}

/* ── 有背景圖時讓 bg-layer 底色透明，讓 body 背景圖穿透 ── */
body.has-bg #bg-layer {
  background-color: transparent;
}

/* ── Story Mode 左右欄霧面玻璃（有背景圖時啟用）──────── */
body.has-bg:not(.site-mode) #col-left,
body.has-bg:not(.site-mode) #col-right {
  background: rgb(var(--c-bg-rgb) / 0.82);
  backdrop-filter: blur(24px) saturate(1.1);
  -webkit-backdrop-filter: blur(24px) saturate(1.1);
  border-left:  1px solid rgb(var(--c-text-rgb) / 0.10);
  border-right: 1px solid rgb(var(--c-text-rgb) / 0.10);
}
/* 淺色主題加強遮蔽，確保深色文字可讀 */
body.has-bg:not(.site-mode)[data-theme="LoveSong"] #col-left,
body.has-bg:not(.site-mode)[data-theme="LoveSong"] #col-right,
body.has-bg:not(.site-mode)[data-theme="WhiteNoise"] #col-left,
body.has-bg:not(.site-mode)[data-theme="WhiteNoise"] #col-right {
  background: rgb(var(--c-bg-rgb) / 0.92);
}
/* 中欄透明，讓背景圖直接透出 */
body.has-bg:not(.site-mode) #col-mid {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
}
/* Resizer 吃玻璃色，避免透出背景圖 */
body.has-bg:not(.site-mode) .col-resizer {
  background: rgb(var(--c-bg-rgb) / 0.82);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

/* ── Column Resizers ────────────────────────────────── */
.col-resizer {
  width: 4px;
  flex-shrink: 0;
  cursor: col-resize;
  background: transparent;
  transition: background 0.2s;
  position: relative;
  z-index: 10;
}
.col-resizer:hover,
.col-resizer.resizing { background: var(--c-primary); }

/* ── Scroll Action Buttons ───────────────────────────── */
.scroll-action-btns {
  position: absolute;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
#col-mid:hover .scroll-action-btns {
  opacity: 0.6;
  pointer-events: auto;
}
.scroll-action-btns:hover {
  opacity: 1 !important;
}
.scroll-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--c-primary-border);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  background: rgb(var(--c-bg-rgb) / 0.90);
  color: var(--c-primary);
  box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--c-primary);
}

/* ── Trash bin ──────────────────────────────────────── */
.trash-btn {
  justify-content: center;
  color: var(--c-text-mute);
  background: transparent;
  border: 1.5px dashed var(--c-primary-border);
}
.trash-btn.drag-over {
  background: rgb(var(--c-danger-rgb) / 0.10);
  border-color: var(--c-danger);
  border-style: solid;
  color: var(--c-danger);
}
.trash-icon { font-size: 15px; transition: transform 0.2s; display: flex; align-items: center; }
.trash-btn.drag-over .trash-icon { transform: scale(1.2); }

/* ── Tool Links Zone ────────────────────────────────── */
#tool-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px 4px;
}
.tool-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  opacity: 0.45;
  transition: opacity 0.2s, background 0.2s;
  text-decoration: none;
  flex-shrink: 0;
}
.tool-link:hover {
  opacity: 1;
  background: rgb(var(--c-primary-rgb) / 0.10);
}

/* ── Folder hierarchy ───────────────────────────────── */
/* 父資料夾：較粗字重，作為層級的視覺主幹 */
.folder-item:not(.subfolder) .folder-label { font-weight: 600; }

/* ── Subfolder indent ───────────────────────────────── */
.folder-item.subfolder {
  padding-left: 34px;
  font-size: 12.5px;
  padding-top: 6px;
  padding-bottom: 6px;
}
/* 子資料夾：較淡的文字與圖示，視覺上從屬於父資料夾 */
.folder-item.subfolder .folder-label { color: var(--c-text-mute); font-weight: 400; }
.folder-item.subfolder .folder-icon { font-size: 13px; opacity: 0.5; }
/* 啟用時恢復主色，不被淡化規則覆蓋 */
.folder-item.subfolder.active .folder-label { color: var(--c-primary); font-weight: 600; }
.folder-item.subfolder.active .folder-icon { opacity: 1; }

/* 展開中的父資料夾：以主色標示，凸顯目前正展開子資料夾的母項 */
.folder-item.expanded-parent:not(.active) .folder-label,
.folder-item.expanded-parent:not(.active) .folder-icon { color: var(--c-primary); }
.folder-item.expanded-parent:not(.active) .folder-icon { opacity: 1; }

.folder-collapse-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  padding: 0;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--c-text-mute);
  opacity: 0.6;
  transition: transform 0.18s ease, opacity 0.15s;
  margin-right: -4px;
}
.folder-collapse-btn:hover { opacity: 1; }
.folder-collapse-btn.collapsed { transform: rotate(-90deg); }

/* ── Drag Ghost ─────────────────────────────────────── */
#drag-ghost {
  position: fixed;
  pointer-events: none;
  background: rgb(var(--c-bg-rgb) / 0.92);
  border: 1px solid var(--c-primary);
  border-radius: var(--radius-sm);
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--c-primary);
  box-shadow: var(--shadow-lg);
  z-index: 9999;
  display: none;
  white-space: nowrap;
  backdrop-filter: blur(8px);
}

/* ── Modern Modal ──────────────────────────────────────────── */
#modal-overlay {
  position: fixed;
  inset: 0;
  background: rgb(0 0 0 / 0.20);
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.modal-box {
  background: var(--c-bg);
  border: 1px solid rgb(var(--c-primary-rgb) / 0.12);
  border-radius: var(--radius-xl);
  padding: 24px;
  width: 360px;
  max-width: 90vw;
  box-shadow: var(--shadow-lg);
  text-align: center;
  animation: modalIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-title { font-size: 16px; font-weight: 600; line-height: 1.2; margin-bottom: 8px; color: var(--c-text); }
.modal-box.no-desc .modal-title { margin-bottom: 24px; }
.modal-desc { font-size: 13px; color: var(--c-text-mute); margin-bottom: 20px; white-space: pre-wrap; line-height: 1.6; }
body[data-theme="WhiteNoise"] .modal-desc { color: #a34520; }
.modal-custom-body { display: none; margin: 0 0 20px; text-align: left; }
.modal-checklist {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 320px;
  overflow: auto;
  padding: 14px;
  border: 1px solid var(--c-primary-border);
  border-radius: var(--radius-md);
  background: rgb(var(--c-primary-rgb) / 0.04);
}
.modal-check-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--c-text);
}
.modal-check-item input {
  width: 16px;
  height: 16px;
  accent-color: var(--c-primary);
}
.modal-check-item-main { font-weight: 600; }
.modal-check-item-sub { padding-left: 20px; color: var(--c-text-mute); }
.modal-check-separate {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--c-primary-border);
  cursor: pointer;
}

.modal-input-field, .modal-textarea-field {
  width: 100%; 
  padding: 12px 16px; 
  border: 1px solid var(--c-primary-border);
  border-radius: var(--radius-md);
  background: var(--c-bg);
  color: var(--c-text);
  margin-bottom: 24px;
  font-family: inherit;
  outline: none;
  display: none;
  font-size: 14px;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
}
.modal-input-field:focus,
.modal-textarea-field:focus {
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgb(var(--c-primary-rgb) / 0.20);
}
.modal-textarea-field { resize: vertical; min-height: 250px; line-height: 1.6; }

.modal-actions { display: flex; gap: 12px; justify-content: center; }
.modal-btn {
  padding: 7px 18px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: 0.2s;
}
.btn-cancel { 
  background: transparent; 
  color: var(--c-text); 
  border: 1px solid var(--c-primary-border); 
}
.btn-cancel:hover { background: rgb(var(--c-text-rgb, 0 0 0) / 0.06); }
.btn-danger { background: var(--c-danger); color: #fff; box-shadow: 0 4px 12px rgb(var(--c-danger-rgb) / 0.30); }
.btn-danger:hover { box-shadow: 0 6px 16px rgb(var(--c-danger-rgb) / 0.40); }
.btn-primary { background: var(--c-button); color: #fff; box-shadow: 0 4px 12px rgb(var(--c-primary-rgb) / 0.30); }
.btn-primary:hover { box-shadow: var(--shadow-float); }

/* ── Context Menu ───────────────────────────────────── */
#folder-menu {
  position: fixed;
  background: rgb(var(--c-bg-rgb) / 0.92);
  backdrop-filter: blur(12px);
  border: 1px solid rgb(var(--c-primary-rgb) / 0.12);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: 6px;
  z-index: 10001;
  display: none;
  flex-direction: column;
  min-width: 160px;
}
.folder-menu-item {
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  color: var(--c-text);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s, color 0.15s;
}
.folder-menu-item.danger { color: var(--c-danger); }
.folder-menu-item.danger:hover,
.tour-modal-del:hover { background: rgb(var(--c-danger-rgb) / 0.10); }
.folder-menu-divider { border-top: 1px solid var(--c-primary-border); margin: 4px 2px; }

/* ── Calendar Day Events Popup ──────────────────────── */
#cal-day-popup {
  position: fixed;
  background: rgb(var(--c-bg-rgb) / 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgb(var(--c-primary-rgb) / 0.12);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: 8px;
  z-index: 10001;
  display: none;
  flex-direction: column;
  min-width: 180px;
  max-width: 260px;
  max-height: 320px;
  overflow-y: auto;
}
#cal-day-popup .cal-popup-date {
  font-size: 12px;
  font-weight: 600;
  color: var(--c-text-mute);
  padding: 4px 8px 8px;
}
.cal-popup-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--c-text);
  user-select: none;
  transition: background 0.15s;
}
.cal-popup-item:hover { background: rgb(var(--c-primary-rgb) / 0.10); }
.cal-popup-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cal-popup-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal-popup-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-popup-folder { font-size: 11px; color: var(--c-text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ══════════════════════════════════════
   網點背景與滑鼠火焰特效
══════════════════════════════════════ */
#bg-layer {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -1;
  pointer-events: none;
  background-color: var(--c-bg);
  background-image: radial-gradient(rgb(var(--c-text-rgb) / 0.08) 1px, transparent 1px);
  background-size: 24px 24px;
}
#bg-layer::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: radial-gradient(rgb(var(--c-text-rgb) / 0.25) 2px, transparent 2px);
  background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(circle 120px at var(--mouse-x, -500px) var(--mouse-y, -500px), black 0%, transparent 100%);
  mask-image: radial-gradient(circle 120px at var(--mouse-x, -500px) var(--mouse-y, -500px), black 0%, transparent 100%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}
#bg-layer::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(
    circle 150px at var(--mouse-x, -500px) var(--mouse-y, -500px),
    rgb(var(--c-fire) / 0.20) 0%,
    rgb(var(--c-fire) / 0.07) 40%,
    transparent 100%
  );
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
  animation: flameFlicker 3s infinite alternate ease-in-out;
}
body.site-mode:hover #bg-layer::before,
body.site-mode:hover #bg-layer::after {
  opacity: 1;
}
@keyframes flameFlicker {
  0%   { filter: blur(2px); transform: scale(1); }
  50%  { filter: blur(5px); transform: scale(1.05); }
  100% { filter: blur(2px); transform: scale(0.95); }
}

/* ══════════════════════════════════════════════════════════
   OFFICIAL SITE
══════════════════════════════════════════════════════════ */
#official-site {

  flex-direction: column;

  height: calc(100vh - 44px);
  background: transparent;

}
body.site-mode #official-site { display: flex; }
body.site-mode #col-left,
body.site-mode .col-resizer,
body.site-mode #col-mid,
body.site-mode #col-right { display: none; }

#site-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid rgb(var(--c-text-rgb) / 0.08);
  padding: 0 40px;
  flex-shrink: 0;
  background: rgb(var(--c-bg-rgb) / 0.85);
  backdrop-filter: blur(8px);

}
.site-nav-item {

.site-nav-item::after {

body[data-theme="cyberpunk"] .site-nav-item.active { color: var(--c-primary); }
body[data-theme="cyberpunk"] .site-nav-item.active::after { background: var(--c-primary); }

#site-content { flex: 1; overflow-y: auto; isolation: isolate; }
.site-page { display: none; }
.site-page.active {
  display: block;
  max-width: 1100px;
  margin-left: auto;
  margin-right: auto;
  width: 100%;
  box-sizing: border-box;
}

/* ── Poster Masonry ── */
#page-poster { padding: 60px 40px 0; }
.poster-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  grid-auto-rows: auto;
  grid-auto-flow: dense;
  gap: 4px;
  padding: 4px;
}
.poster-cell {
  position: relative;
  overflow: hidden;
  cursor: pointer;
  background: rgb(var(--c-bg-rgb) / 0.6);
  border-radius: 0;
  box-shadow: 0 4px 16px rgb(var(--shadow-color) / 0.12);
  /* Masonry: 根據資料屬性設置寬高比 */
  aspect-ratio: var(--aspect-ratio, 1);
  /* 自動跨越多欄以保持比例 */
  grid-column: span var(--col-span, 1);
  break-inside: avoid;
}
.poster-cell img { 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
  display: block; 
  transition: transform 0.4s ease; 
}
.poster-cell:hover img { transform: scale(1.05); }
.poster-cell-overlay {
  position: absolute; inset: 0;
  background: rgb(0 0 0 / 0);
  transition: background 0.2s;
}
.poster-cell:hover .poster-cell-overlay { background: rgb(0 0 0 / 0.15); }
.poster-add-cell {
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  gap: 8px;
  cursor: pointer;
  background: rgb(var(--c-button) / 0.30);
  border: 1px dashed rgb(var(--c-text-rgb) / 0.15);
  border-radius: 0;
  color: var(--c-text-mute); 
  font-size: 12px;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
  aspect-ratio: 1;
  grid-column: span 1;
}
.poster-add-cell:hover { background: var(--c-primary-mute); border-color: var(--c-primary); color: var(--c-primary); }
.poster-add-icon,
.poster-modal-upload-placeholder span { font-size: 28px; font-weight: 300; line-height: 1; }

/* 響應式調整欄數 */
@media (max-width: 1200px) {
  .poster-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}
@media (max-width: 768px) {
  .poster-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (max-width: 480px) {
  .poster-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
}

/* ── CG Notebook ── */
.cg-nb-fab {
  position: fixed; right: 12px; top: 50%;
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgb(var(--c-text-rgb) / 0.06);
  border: 1px solid var(--c-primary-border);
  color: var(--c-text-mute);
  cursor: pointer; z-index: 60; opacity: 0.45;
  transform: translateY(-50%);
  transition: opacity .25s, background .25s, color .25s, transform .25s;
}
.cg-nb-fab:hover { opacity: 1; background: var(--c-button); color: #fff; transform: translateY(-50%) scale(1.08); }
.cg-nb-fab.cg-nb-hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) scale(0.6); }
.cg-nb-fab svg { width: 20px; height: 20px; }
.cg-nb-overlay {
  position: fixed; inset: 0; z-index: 70;
  background: rgb(0 0 0 / 0.28);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.cg-nb-overlay.open { opacity: 1; pointer-events: auto; }
.cg-nb-drawer {
  position: fixed; top: 44px; right: 0; height: calc(100vh - 44px);
  width: 340px; max-width: 86vw;
  background: rgb(var(--c-bg-rgb) / 0.97);
  border-left: 1px solid var(--c-primary-border);
  box-shadow: -8px 0 32px rgb(var(--shadow-color) / 0.18);
  transform: translateX(100%); transition: transform .28s ease;
  z-index: 71; display: flex; flex-direction: column;
  box-sizing: border-box; padding: 18px 16px 16px;
}
.cg-nb-drawer.open { transform: translateX(0); }
.cg-nb-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cg-nb-title { font-size: 14px; font-weight: 600; color: var(--c-text); }
.cg-nb-close { background: none; border: none; color: var(--c-text-mute); cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 6px; }
.cg-nb-close:hover { color: var(--c-text); }
.cg-nb-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.cg-nb-tab {
  flex: 1; text-align: center; font-size: 12px; padding: 7px 4px;
  border-radius: 6px; cursor: pointer; color: var(--c-text-mute);
  background: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .2s, color .2s; user-select: none;
}
.cg-nb-tab:hover { color: var(--c-text); }
.cg-nb-tab.active { background: rgb(var(--c-text-rgb) / 0.10); color: var(--c-text); }
.cg-nb-text {
  flex: 1; width: 100%; resize: none; box-sizing: border-box;
  background: rgb(var(--c-text-rgb) / 0.04);
  border: 1px solid var(--c-primary-border); border-radius: 6px;
  padding: 11px 12px; color: var(--c-text); font-size: 13px;
  line-height: 1.7; font-family: inherit;
}
.cg-nb-text:focus { outline: none; border-color: var(--c-button); }
.cg-nb-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--c-text-mute); }
.cg-nb-copy {
  display: flex; align-items: center; gap: 5px;
  background: none; border: 1px solid var(--c-primary-border);
  border-radius: 6px; padding: 5px 10px; color: var(--c-text-mute);
  cursor: pointer; font-size: 11px; transition: background .2s, color .2s;
}
.cg-nb-copy:hover { background: rgb(var(--c-text-rgb) / 0.08); color: var(--c-text); }
.cg-nb-copy svg { width: 13px; height: 13px; }

/* ── IG Detail Modal ── */
@keyframes igModalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to   { opacity: 1; transform: scale(1)    translateY(0); }
}

#ig-modal-overlay {
  position: fixed; inset: 0;
  background: transparent;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 9000; display: none;
  align-items: center; justify-content: center;
}
#ig-modal-overlay.open { display: flex; }
#ig-modal-overlay.open .ig-modal-box {
  animation: igModalIn 0.22s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

/* 翻頁按鈕 — SVG 箭頭 */
#ig-modal-nav-prev, #ig-modal-nav-next {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px; border-radius: 50%;
  background: rgb(var(--c-primary-rgb) / 0.85);
  border: 1px solid rgb(var(--c-primary-rgb) / 0.4);
  color: #fff;
  cursor: pointer; display: none; padding: 0;
  align-items: center; justify-content: center;
  transition: background 0.18s, border-color 0.18s, transform 0.18s;
  z-index: 9010; flex-shrink: 0;
  backdrop-filter: blur(6px);
}
#ig-modal-overlay.open #ig-modal-nav-prev,
#ig-modal-overlay.open #ig-modal-nav-next { display: flex; }
#ig-modal-nav-prev { left: 20px; }
#ig-modal-nav-next { right: 20px; }
#ig-modal-nav-prev:hover {
  background: rgb(var(--c-primary-rgb) / 1);
  border-color: rgb(var(--c-primary-rgb) / 0.8);
  transform: translateY(-50%) translateX(-2px);
}
#ig-modal-nav-next:hover {
  background: rgb(var(--c-primary-rgb) / 1);
  border-color: rgb(var(--c-primary-rgb) / 0.8);
  transform: translateY(-50%) translateX(2px);
}
#ig-modal-nav-prev.hidden, #ig-modal-nav-next.hidden { opacity: 0; pointer-events: none; }

/* Modal 主體 */
.ig-modal-box {
  display: grid;
  grid-template-columns: 1fr 300px;
  width: min(920px, calc(100vw - 120px));
  height: min(640px, 88vh);
  background: var(--c-bg);
  border-radius: 12px;
  border: 1px solid rgb(var(--c-primary-rgb) / 0.10);
  overflow: hidden;
  box-shadow: 0 32px 96px rgb(0 0 0 / 0.65), 0 0 0 1px rgb(255 255 255 / 0.04);
  position: relative;
}

/* 左側圖片 */
.ig-modal-img-wrap {
  background: #080808;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  position: relative;
}
.ig-modal-img-wrap img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}

/* 右側 */
.ig-modal-right {
  display: flex; flex-direction: column;
  border-left: 1px solid rgb(var(--c-primary-rgb) / 0.10);
  background: rgb(var(--c-bg-rgb) / 0.98);
  overflow: hidden;
}

/* 右側頂部 header bar */
.ig-modal-header {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 14px 16px 12px;
  border-bottom: 1px solid rgb(var(--c-primary-rgb) / 0.08);
  flex-shrink: 0;
}

.ig-modal-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: transparent; border: none;
  color: var(--c-text-mute); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.ig-modal-close:hover {
  background: rgb(var(--c-primary-rgb) / 0.10);
  color: var(--c-primary);
}

/* Caption 區 */
.ig-modal-caption-wrap {
  flex: 1; overflow-y: auto;
  padding: 18px 20px 14px;
  display: flex; flex-direction: column;
}

.ig-modal-caption-textarea {
  flex: 1;
  background: transparent;
  border: none;
  border-radius: 0;
  color: var(--c-text);
  font-family: inherit;
  font-size: 13.5px;
  line-height: 1.8;
  padding: 0;
  resize: none;
  outline: none;
  width: 100%;
  min-height: 0;
  transition: color 0.2s;
}
.ig-modal-caption-textarea::placeholder { color: var(--c-hint); }

/* Footer */
.ig-modal-footer {
  flex-shrink: 0;
  padding: 14px 20px 16px;
  border-top: 1px solid rgb(var(--c-primary-rgb) / 0.08);
  display: flex; flex-direction: column; gap: 10px;
  background: rgb(var(--c-bg-rgb) / 0.95);
}
.ig-modal-actions { display: flex; align-items: center; gap: 8px; }

/* 章節關聯 chip — ig-modal & poster-modal 共用 */
.chapter-wrap { display: flex; flex-direction: column; gap: 6px; }
.chapter-hidden-select {
  width: 100%; padding: 8px 10px; border-radius: 6px;
  border: 1px solid rgb(var(--c-text-rgb) / 0.15);
  background: rgb(var(--c-text-rgb) / 0.05); color: var(--c-text);
  font-size: 13px; font-family: inherit; outline: none;
  color-scheme: light; /* 強制 OS 下拉選單使用淺色（深/霓虹主題下可讀） */
}
.chapter-hidden-select option {
  background: #fff; color: #222;
}
.chapter-tag {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgb(var(--c-text-rgb) / 0.07); border-radius: 6px;
  padding: 6px 10px; width: fit-content;
}
.chapter-link {
  font-size: 12px; font-weight: 600; color: var(--c-primary);
  background: none; border: none; cursor: pointer; font-family: inherit; padding: 0;
}
.chapter-link:hover { text-decoration: underline; }
.chapter-remove {
  font-size: 11px; color: var(--c-text-mute); background: none; border: none;
  cursor: pointer; padding: 0; opacity: 0.6; transition: opacity 0.15s, color 0.15s;
}
.chapter-remove:hover { opacity: 1; color: var(--c-danger); }
/* 刪除：icon only，靠左 */
.ig-modal-del-btn {
  margin-right: auto;
  padding: 7px 10px;
  border: none; border-radius: var(--radius-md);
  background: transparent;
  color: var(--c-text-mute);
  font-size: 12px; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: background 0.15s, color 0.15s;
}
.ig-modal-del-btn:hover {
  background: rgb(var(--c-danger-rgb) / 0.10);
  color: var(--c-danger);
}

/* 取消 */
.ig-modal-cancel-btn {
  padding: 7px 16px;
  border: 1px solid rgb(var(--c-primary-rgb) / 0.15);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--c-text-mute);
  font-size: 12.5px; font-weight: 500; font-family: inherit;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.ig-modal-cancel-btn:hover {
  background: rgb(var(--c-primary-rgb) / 0.07);
  border-color: rgb(var(--c-primary-rgb) / 0.28);
  color: var(--c-text);
}

/* 儲存 */
.ig-modal-save-btn {
  padding: 7px 18px;
  border: none; border-radius: var(--radius-md);
  background: var(--c-button);
  color: #fff;
  font-size: 12.5px; font-weight: 700; font-family: inherit;
  cursor: pointer;
  transition: opacity 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 10px rgb(85 139 255 / 0.30);
}
.ig-modal-save-btn:hover {
  opacity: 0.88;
  box-shadow: 0 4px 16px rgb(85 139 255 / 0.45);
}

/* ── Music ── */
#page-music { padding: 60px 40px; }
.music-page-header { position: relative; margin-bottom: 40px; width: 100%; }
.music-page-title,
.tour-page-title {
  font-size: 28px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase;
  background: var(--c-button);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-align: center;
  padding-bottom: 16px;
  border-bottom: 1px solid rgb(var(--c-text-rgb) / 0.15);
}
.btn-minimal-add {
  background: rgb(var(--c-text-rgb) / 0.05);
  border: 1px solid var(--c-primary-border);
  color: var(--c-text); width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.3s, color 0.3s, border-color 0.3s, transform 0.3s;
  position: absolute; right: 0; top: 0;
}
.btn-minimal-add:hover {
  background: var(--c-button); color: #fff; border-color: var(--c-button);
  transform: rotate(90deg) scale(1.1);
}
.music-grid { display: flex; flex-direction: column; align-items: flex-start; gap: 32px; width: 100%; }

/* Card */
.music-card {
  display: flex; flex-direction: row; align-items: stretch;
  border-radius: 3px;
  background: rgb(var(--c-bg-rgb) / 0.85);
  border: 1px solid var(--c-primary-border);
  border-top: 1px solid rgb(var(--c-text-rgb) / 0.12);
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 12px rgb(var(--shadow-color) / 0.15);
  transition: box-shadow 0.3s, background 0.6s ease;
  position: relative; width: fit-content; max-width: 100%; height: 160px;
}

/* Cover */
.music-cover {
  position: absolute; top: 0; left: 0;
  width: 160px; height: 160px;
  background: linear-gradient(135deg, #3a3a3a 0%, #1a1a1a 100%);
  z-index: 10; overflow: hidden;
  border-right: 1px solid var(--c-primary-border);
  border-radius: 3px 0 0 3px;
}
.music-cover img,
.poster-modal-upload-area img,
.member-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.music-cover-title {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 30px 12px 12px;
  background: linear-gradient(to top, color-mix(in srgb, var(--c-button) 25%, rgba(0,0,0,0.85)) 0%, color-mix(in srgb, var(--c-button) 5%, rgba(0,0,0,0.3)) 60%, transparent 100%);
  font-size: 14px; font-weight: 600; letter-spacing: 1px; color: #fff;
  z-index: 3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
.music-cover-upload {
  position: absolute; inset: 0; z-index: 4;
  background: rgba(0,0,0,0);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.3s, background 0.3s;
  font-size: 11px; font-weight: 600; color: #fff;
  letter-spacing: 2px; gap: 8px; flex-direction: column; cursor: pointer;
}
.music-cover:hover .music-cover-upload {
  opacity: 1;
  background: color-mix(in srgb, var(--c-button) 25%, rgba(0,0,0,0.65));
  backdrop-filter: blur(2px);
}
.music-cover-placeholder {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: rgb(var(--c-text-rgb) / 0.2);
}

/* Vinyl */
.music-vinyl-wrapper {
  position: absolute; top: 8px; left: 60px;
  width: 144px; height: 144px; border-radius: 50%;
  z-index: 5; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: -1px 0 5px rgb(var(--shadow-color) / 0.15), 1px 0 4px rgb(var(--shadow-color) / 0.10);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), filter 0.3s;
}
.music-vinyl-wrapper:hover { transform: scale(1.05) translateX(4px); filter: brightness(1.2); }
.music-vinyl-disc {
  width: 100%; height: 100%; border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, #0d0d0d 0%, #0d0d0d 8%, transparent 8%),
    radial-gradient(circle at 50% 50%, transparent 66%, #1a1a1a 67%, #050505 100%),
    repeating-radial-gradient(circle at 50% 50%, #111 0px, #111 2px, #181818 3px, #181818 4px),
    #0d0d0d;
  box-shadow: inset 0 0 16px rgba(255,255,255,0.12);
}
@keyframes spin-vinyl { 100% { transform: rotate(360deg); } }
.music-card.is-playing .music-vinyl-disc { animation: spin-vinyl 4s linear infinite; }

/* Default space — 包裝紙：以封面主色為底 */
.music-default-space {
  width: 234px; height: 160px; flex-shrink: 0;
  background:
    linear-gradient(
      105deg,
      rgb(var(--cover-rgb, var(--c-bg-rgb)) / 0.45) 0%,
      rgb(var(--cover-rgb, var(--c-bg-rgb)) / 0.25) 60%,
      rgb(var(--cover-rgb, var(--c-bg-rgb)) / 0.10) 100%
    );
  transition: background 0.6s ease;
}

/* Expand panel */
.music-expand-wrap {
  display: flex; flex-direction: row; align-items: stretch;
  overflow: hidden; width: 0; opacity: 0;
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
  flex-shrink: 0;
}
.music-card.is-open .music-expand-wrap { opacity: 1; }

/* Player panel */
.music-player-panel {
  width: 320px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 0 32px;
  border-left: 1px solid var(--c-primary-border);
  box-sizing: border-box; overflow: hidden;
  background: rgb(var(--c-text-rgb) / 0.03);
}
.music-player-panel .play-btn { width: 48px; height: 48px; }
.music-mp3-bar { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.music-mp3-time { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 11px; font-weight: 600; color: var(--c-text-mute); letter-spacing: 1px; }
.music-mp3-seek {
  width: 100%; appearance: none; height: 4px;
  border-radius: 2px; background: rgb(var(--c-text-rgb) / 0.12); cursor: pointer; outline: none;
}
.music-mp3-seek::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c-button); cursor: pointer; }
.music-embed-wrap { width: 100%; border-radius: 3px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
.music-embed-wrap iframe { width: 100%; border: none; display: block; filter: grayscale(20%); transition: filter 0.3s; }
.music-embed-wrap iframe:hover { filter: grayscale(0%); }

/* Play btn (global) */
.play-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--c-button); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: transform 0.2s;
}
.play-btn:hover { transform: scale(1.1); }
.play-btn svg { margin-left: 2px; fill: #fff !important; }

.music-upload-mp3 {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--c-text-mute);
  cursor: pointer; padding: 4px 0; transition: color 0.2s;
  background: none; border: none; text-transform: uppercase; letter-spacing: 1px; font-family: inherit;
}
.music-upload-mp3:hover { color: var(--c-button); }

/* Lyrics panel */
.music-lyrics-panel {
  width: 420px; flex-shrink: 0;
  display: flex; flex-direction: column;
  padding: 10px 28px 10px 32px;
  border-left: 1px solid var(--c-primary-border);
  border-right: 1px solid var(--c-primary-border);
  box-sizing: border-box; overflow: hidden;
  background-color: rgb(var(--c-text-rgb) / 0.03);
  background-image: linear-gradient(rgb(var(--c-text-rgb) / 0.05) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--c-text-rgb) / 0.05) 1px, transparent 1px);
  background-size: 12px 12px;
}
.music-lyrics-label {
  font-size: 11px; font-weight: 500; letter-spacing: 60px;
  color: var(--c-button); text-transform: uppercase;
  margin-bottom: 16px; flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
}
.music-lyrics-label::after { content: ""; flex: 1; height: 1px; background: var(--c-primary-border); }
.music-lyrics-text {
  flex: 1; overflow-y: auto;
  font-size: 14px; line-height: 2.2; color: var(--c-text);
  white-space: pre-line;
  background: transparent;
}
.music-lyrics-text::-webkit-scrollbar { width: 4px; }
.music-lyrics-text::-webkit-scrollbar-thumb { background: rgb(var(--c-primary-rgb) / 0.2); border-radius: 4px; }
.music-lyrics-text::-webkit-scrollbar-thumb:hover { background: var(--c-button); }


.music-empty-state {
  text-align: center; padding: 80px 20px; color: var(--c-hint);
  font-size: 13px; width: 100%;
}

/* ── Tour ── */
#page-tour { padding: 60px 40px; }
.tour-page-header { position: relative; margin-bottom: 32px; }
.tour-table-head {
  display: grid;
  grid-template-columns: 100px 2fr 100px 100px 1.5fr 36px;
  padding: 10px 20px; gap: 16px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--c-text-mute);
  border-bottom: 1px solid rgb(var(--c-text-rgb) / 0.10);
}
.tour-table-head > span:nth-child(5) { padding-left: 3px; }
.tour-row {
  display: grid;
  grid-template-columns: 100px 2fr 100px 100px 1.5fr 36px;
  padding: 18px 20px; gap: 16px; align-items: center;
  border-bottom: 1px solid rgb(var(--c-text-rgb) / 0.06);
  transition: background 0.15s, box-shadow 0.15s; cursor: default;
  background: rgb(var(--c-bg-rgb) / 0.6);
  box-shadow: 0 2px 8px rgb(var(--shadow-color) / 0.08);
}
/* 每個 grid 子欄都加 min-width:0，防止內容撐破欄寬 */
.tour-row > * { min-width: 0; overflow: hidden; }
/* 狀態欄含 focus-ring 特效，不能 clip */
.tour-row:hover { background: rgb(var(--c-bg-rgb) / 0.8); box-shadow: 0 4px 12px rgb(var(--shadow-color) / 0.12); }
.tour-date-cell { display: flex; flex-direction: column; gap: 2px; }
.tour-date-main { font-size: 14px; font-weight: 700; color: var(--c-text); }
.tour-title-cell { display: flex; flex-direction: column; gap: 3px; align-self: start; }
.tour-title-main { font-size: 14px; font-weight: 600; color: var(--c-text); }
.tour-location,
.member-stat { font-size: 12px; color: var(--c-text-mute); }
.tour-time-cell { font-size: 13px; color: var(--c-text-mute); }
.tour-badge {
  display: inline-flex; align-items: center;
  padding: 0 10px; height: 30px; border-radius: 4px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  white-space: nowrap; flex-shrink: 0;
}
.tour-badge.done { background: rgb(16 185 129 / 0.12); color: #10b981; }
.tour-badge.upcoming { background: rgb(var(--c-primary-rgb) / 0.12); color: var(--c-primary); }
.tour-badge.tbd { background: rgb(var(--c-text-rgb) / 0.08); color: var(--c-text-mute); }
.tour-body-preview { font-size: 14px; color: var(--c-text); }
.tour-link-cell { display: flex; justify-content: flex-start; align-items: center; gap: 8px; overflow: visible; }
/* 章節連結插槽：固定佔位避免 ✎ 按鈕水平漂移 */
.tour-chapter-slot { display: inline-flex; align-items: center; min-width: 0; }
.tour-chapter-link {
  font-size: 12px; font-weight: 700; color: var(--c-primary);
  cursor: pointer; display: flex; align-items: center; gap: 4px;
  padding: 0 10px; height: 30px; border-radius: 4px; background: transparent;
  border: 1.5px dashed rgb(var(--c-primary-rgb) / 0.5); font-family: inherit;
  transition: border-color 0.2s, background 0.2s;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tour-chapter-link:hover { border-color: var(--c-primary); background: rgb(var(--c-primary-rgb) / 0.06); }
.tour-row-edit-btn {
  width: 28px; height: 28px; border-radius: 6px;
  background: transparent; border: none; color: var(--c-text-mute);
  font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s, background 0.15s;
  flex-shrink: 0; justify-self: center;
}
.tour-row:hover .tour-row-edit-btn,
.tour-row:focus-within .tour-row-edit-btn { opacity: 1; }
/* 觸控裝置沒有 hover，按鈕永久顯示，避免無法編輯 */
@media (hover: none) {
  .tour-row-edit-btn { opacity: 1; }
}
/* 響應式：平板 ≤900px — 隱藏「時間」欄，縮小固定欄 */
@media (max-width: 900px) {
  .tour-table-head,
  .tour-row {
    grid-template-columns: 100px 2fr 100px 1.5fr 36px;
    gap: 10px; padding: 14px 14px;
  }
  .tour-time-cell { display: none; }
  .tour-table-head > *:nth-child(4) { display: none; }
}
/* 響應式：手機 ≤600px — 卡片模式，每筆行程獨立區塊 */
@media (max-width: 600px) {
  .tour-table-head { display: none; }
  .tour-row {
    display: flex; flex-direction: column; align-items: flex-start;

  .tour-date-cell { flex-direction: row; align-items: baseline; gap: 6px; }

  .tour-link-cell { width: 100%; }

/* 標題必填錯誤提示 */

/* 可編輯欄位（地點 / 時間）：點擊輸入 */
.tour-editable {

  border: 1px solid transparent;
  min-height: 1.2em;
  outline: none;

  overflow: hidden;

  transition: background 0.15s, border-color 0.15s;
}
.tour-editable:hover { background: rgb(var(--c-text-rgb) / 0.05); }
.tour-editable:focus {

  border-color: rgb(var(--c-primary-rgb) / 0.4);
  box-shadow: 0 0 0 2px rgb(var(--c-primary-rgb) / 0.12);
  white-space: normal;
  overflow: visible;
}
.tour-editable:empty::before {
