  color: var(--c-text-mute);
  opacity: 0.6;
}

#tour-modal-overlay {
  position: fixed; inset: 0;
  background: rgb(0 0 0 / 0.35); z-index: 10010;
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
}
#tour-modal-overlay.open { display: flex; }
.tour-modal-box {
  background: var(--c-bg);
  border: 1px solid rgb(var(--c-primary-rgb) / 0.15);
  border-radius: 8px; padding: 32px; width: 520px; max-width: 92vw;
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 20px;
}
.tour-modal-title { font-size: 18px; font-weight: 700; color: var(--c-text); letter-spacing: 1px; }
.tour-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tour-modal-field { display: flex; flex-direction: column; gap: 6px; }
.tour-modal-field.full { grid-column: 1 / -1; }
.tour-modal-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--c-hint); }
.tour-modal-input, .tour-modal-select, .tour-modal-textarea {
  background: rgb(var(--c-text-rgb) / 0.05); border: 1px solid rgb(var(--c-text-rgb) / 0.10);
  border-radius: 4px; padding: 10px 14px; color: var(--c-text); font-size: 14px;
  font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.tour-modal-input:focus, .tour-modal-select:focus, .tour-modal-textarea:focus {
  border-color: var(--c-primary); box-shadow: 0 0 0 3px rgb(var(--c-primary-rgb) / 0.12);
}
.tour-modal-select option { background: var(--c-bg); color: var(--c-text); }
.tour-modal-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
.tour-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.tour-modal-cancel {
  padding: 6px 14px; border: 1px solid rgb(var(--c-text-rgb) / 0.15);
  border-radius: 8px; background: transparent; color: var(--c-text-mute);
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s;
}
.tour-modal-cancel:hover { background: rgb(var(--c-text-rgb) / 0.06); }
.tour-modal-save {
  padding: 6px 16px; border: none; border-radius: 8px;
  background: var(--c-button); color: #fff; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgb(var(--c-primary-rgb) / 0.30);
  transition: box-shadow 0.2s;
}
.tour-modal-save:hover { box-shadow: 0 6px 18px rgb(var(--c-primary-rgb) / 0.40); }
.tour-modal-del {
  padding: 6px 12px; border: none; border-radius: 8px; background: transparent;
  color: var(--c-danger); font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: inherit; margin-right: auto; transition: background 0.2s;
}
/* ── Poster Modal ── */
#poster-modal-overlay {
  position: fixed; inset: 0;
  background: rgb(0 0 0 / 0.65); backdrop-filter: blur(6px);
  z-index: 8000; display: none;
  align-items: center; justify-content: center;
}
#poster-modal-overlay.open { display: flex; }
.poster-modal-box {
  background: var(--c-bg); border-radius: 4px;
  padding: 0; width: min(680px, 95vw);
  box-shadow: 0 8px 32px rgb(0 0 0 / 0.28);
  display: flex; flex-direction: column; overflow: hidden;
}
.poster-modal-layout { display: grid; grid-template-columns: 1fr 1.1fr; }
.poster-modal-right {
  display: flex; flex-direction: column;
  padding: 20px; gap: 12px;
  border-left: 1px solid var(--c-primary-border);
}
.poster-modal-upload-area {
  aspect-ratio: 1/1; cursor: pointer; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: var(--c-primary-mute); transition: background 0.2s;
  position: relative;
}
.poster-modal-upload-area:hover { background: rgb(var(--c-primary-rgb) / 0.08); }
.poster-modal-upload-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--c-hint); font-size: 12px; pointer-events: none;
}
/* ── About ── */
#page-about { padding: 60px 40px; }
.about-page-title {
  font-size: 28px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  background: var(--c-button);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  padding-bottom: 16px;
  margin-bottom: 56px;
  border-bottom: 1px solid rgb(var(--c-text-rgb) / 0.15);
}
.members-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.member-card {
  display: flex; flex-direction: column; border-radius: 0; overflow: hidden; border: none;
  opacity: 0; transform: translateY(24px);
  animation: memberFadeUp 0.5s ease forwards;
  position: relative; z-index: 1;
  background: rgb(var(--c-bg-rgb) / 0.8);
  box-shadow: 0 4px 16px rgb(var(--shadow-color) / 0.12);
}
@keyframes memberFadeUp {
  to { opacity: 1; transform: translateY(0); }
}
.member-photo {
  aspect-ratio: 3/4; background: rgb(var(--c-bg-rgb)); overflow: hidden;
  display: flex; align-items: center; justify-content: center; color: rgb(var(--c-primary-rgb) / 0.25); font-size: 48px;
  border: 1px solid var(--c-primary-border);
}
.member-info { padding: 20px 0 0 12px; display: flex; flex-direction: column; gap: 6px; }
.member-name { font-size: 16px; font-weight: 700; color: var(--c-text); }
.member-role { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--c-primary); }
.member-bio { font-size: 13px; color: var(--c-text-mute); margin-top: 10px; line-height: 1.8; }
.member-bio:empty { display: none; margin-top: 0; }
.member-stats { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.member-stat *, .member-role *, .member-name *, .member-bio * { color: inherit !important; background-color: transparent !important; font-family: inherit !important; font-size: inherit !important; }
.member-stat[contenteditable], .member-name[contenteditable], .member-role[contenteditable], .member-bio[contenteditable] {
  outline: none; cursor: text; border-radius: 3px; padding: 2px 4px; margin: -2px -4px;
  transition: background 0.2s;
}
.member-stat[contenteditable]:hover, .member-name[contenteditable]:hover, .member-role[contenteditable]:hover, .member-bio[contenteditable]:hover {
  background: rgb(var(--c-primary-rgb) / 0.06);
}
.member-stat[contenteditable]:focus, .member-name[contenteditable]:focus, .member-role[contenteditable]:focus, .member-bio[contenteditable]:focus {
  background: rgb(var(--c-primary-rgb) / 0.10);
}

@media (max-width: 1120px) {
  #page-about { padding: 40px 32px; }
  .members-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 32px; }
}

/* ══════════════════════════════════════════════════════════
   MOBILE RESPONSIVE
══════════════════════════════════════════════════════════ */

/* 行動裝置瀏覽器工具列會吃掉 vh，改用 dvh 動態視口高度 */
@supports (height: 100dvh) {
  body { height: 100dvh; }
  #official-site { height: calc(100dvh - 44px); }
  .cg-nb-drawer { top: 44px; height: calc(100dvh - 44px); }
}

/* 手機版抽屜切換按鈕（桌面隱藏） */
#mobile-left-btn, #mobile-right-btn {
  display: none;
  width: 34px; height: 34px;
  border: none; border-radius: 8px;
  background: transparent; color: var(--c-text-mute);
  cursor: pointer; flex-shrink: 0;
  align-items: center; justify-content: center;
  transition: background 0.2s, color 0.2s;
}
#mobile-left-btn:active, #mobile-right-btn:active,
body.mobile-left-open #mobile-left-btn,
body.mobile-right-open #mobile-right-btn {
  background: rgb(var(--c-primary-rgb) / 0.12);
  color: var(--c-primary);
}
#mobile-drawer-overlay { display: none; }

@media (max-width: 768px) {
  /* ── Topbar：隱藏置中品牌字、按鈕縮成 icon-only ── */
  #app-topbar { padding: 0 8px; gap: 6px; }
  #app-topbar .brand { display: none; }
  .topbar-mode-btn { padding: 4px 10px; font-size: 11px; letter-spacing: 0; }
  #topbar-right { width: auto; gap: 4px; }
  #export-all-btn span, #import-all-btn span { display: none; }
  #export-all-btn, #import-all-btn { min-width: 32px; width: 32px; padding: 0; }
  body:not(.site-mode) #mobile-left-btn,
  body:not(.site-mode) #mobile-right-btn { display: flex; }

  /* ── Story Mode：三欄改成「中欄主畫面 + 左右抽屜」── */
  .col-resizer { display: none !important; }
  .col-toggle-btn { display: none !important; }
  /* 全螢幕模式在手機上失去意義，強制還原欄位顯示 */
  body.mid-fullscreen #col-right,
  body.right-fullscreen #col-mid { display: flex !important; }

  body:not(.site-mode) #col-left {
    position: fixed; top: 44px; left: 0; bottom: 0;
    width: min(300px, 85vw) !important;
    height: auto;
    z-index: 300;
    transform: translateX(calc(-100% - 24px));
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    background: rgb(var(--c-bg-rgb) / 0.96);
    backdrop-filter: blur(24px) saturate(1.1);
    -webkit-backdrop-filter: blur(24px) saturate(1.1);
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  body.mobile-left-open:not(.site-mode) #col-left {
    transform: translateX(0);
    box-shadow: 12px 0 40px rgb(0 0 0 / 0.35);
  }

  body:not(.site-mode) #col-right {
    position: fixed; top: 44px; right: 0; bottom: 0;
    width: min(320px, 88vw) !important;
    min-width: 0 !important;
    z-index: 300;
    transform: translateX(calc(100% + 24px));
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    background: rgb(var(--c-bg-rgb) / 0.96);
    backdrop-filter: blur(24px) saturate(1.1);
    -webkit-backdrop-filter: blur(24px) saturate(1.1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  body.mobile-right-open:not(.site-mode) #col-right {
    transform: translateX(0);
    box-shadow: -12px 0 40px rgb(0 0 0 / 0.35);
  }

  #mobile-drawer-overlay {
    display: block;
    position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
    background: rgb(0 0 0 / 0.40);
    z-index: 290;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  body.mobile-left-open #mobile-drawer-overlay,
  body.mobile-right-open #mobile-drawer-overlay {
    opacity: 1; pointer-events: auto;
  }

  /* 中欄佔滿全寬 */
  #col-mid { border-left: none; border-right: none; }
  #mid-header { padding: 12px 14px; font-size: 15px; }
  #message-list { padding: 16px 14px 40px; }
  .msg-row { padding: 16px 10px; margin: 0 -10px; gap: 10px; }
  .msg-avatar { width: 36px; height: 36px; font-size: 14px; }
  .msg-col { max-width: 84%; }
  .msg-bubble { padding: 12px 14px; }
  .scroll-action-btns { bottom: 16px; right: 12px; }

  /* ── Official Site ── */
  #site-nav { padding: 0; }
  .site-nav-item { flex: 1; text-align: center; padding: 14px 4px; letter-spacing: 1.5px; }
  .site-nav-item::after { left: 12px; right: 12px; }

  #page-poster { padding: 20px 10px 0; }
  #page-music, #page-tour, #page-about { padding: 32px 16px; }
  .music-page-title, .tour-page-title, .about-page-title { font-size: 22px; letter-spacing: 2px; }
  .about-page-title { margin-bottom: 32px; }

  /* Music：卡片改直向堆疊，展開面板佔滿寬度 */
  .music-grid { gap: 24px; }
  .music-card { width: 100%; height: auto; flex-direction: column; }
  .music-default-space { width: 100%; height: 160px; }
  .music-expand-wrap { width: 100% !important; flex-direction: column; }
  .music-card:not(.is-open) .music-expand-wrap { display: none; }
  .music-player-panel {
    width: 100%; padding: 24px 20px;
    border-left: none; border-top: 1px solid var(--c-primary-border);
  }
  .music-lyrics-panel {
    width: 100%; padding: 16px 20px;
    border-left: none; border-right: none;
    border-top: 1px solid var(--c-primary-border);
    max-height: 45vh;
  }
  .music-lyrics-label { letter-spacing: 8px; }

  /* IG 詳情 Modal：改直向（上圖下文） */
  .ig-modal-box {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr);
    width: calc(100vw - 16px);
    height: min(640px, 88vh);
  }
  .ig-modal-right { border-left: none; border-top: 1px solid rgb(var(--c-primary-rgb) / 0.10); }
  #ig-modal-nav-prev, #ig-modal-nav-next { width: 36px; height: 36px; }
  #ig-modal-nav-prev { left: 6px; }
  #ig-modal-nav-next { right: 6px; }

  /* Poster 上傳 Modal：左右改上下 */
  .poster-modal-box { max-height: 88vh; overflow-y: auto; }
  .poster-modal-layout { grid-template-columns: 1fr; }
  .poster-modal-right { border-left: none; border-top: 1px solid var(--c-primary-border); }

  /* Tour Modal：欄位改單欄 */
  .tour-modal-box { padding: 20px; }
  .tour-modal-grid { grid-template-columns: 1fr; }

  /* CG 筆記抽屜 */
  .cg-nb-fab { right: 8px; }

  /* iOS Safari：輸入框字級 <16px 聚焦時會自動放大頁面 */
  .modal-input-field, .modal-textarea-field,
  .tour-modal-input, .tour-modal-select, .tour-modal-textarea,
  .new-folder-input, .cg-nb-text { font-size: 16px; }
}

@media (max-width: 520px) {
  .members-grid { grid-template-columns: 1fr; gap: 32px; }
  .member-photo { aspect-ratio: 1/1; }
}

/* 觸控裝置：沒有 hover，需要常駐顯示的互動元素 */
@media (hover: none) {
  #col-mid .scroll-action-btns { opacity: 0.55; pointer-events: auto; }
  .folder-item .folder-btns { display: flex; }
  .music-cover-upload { opacity: 0.001; } /* 保持可點擊觸發上傳 */
}

<script>
'use strict';

/* ══════════════════════════════════════════════════════════
   IndexedDB — Posters & Song Covers
══════════════════════════════════════════════════════════ */
let _idb = null;

let _idbPromise = null;

function openPosterDB() {
  if (_idb) return Promise.resolve(_idb);
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('tak_fire_db', 4);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('posters')) {
        db.createObjectStore('posters', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('song_covers')) {
        db.createObjectStore('song_covers', { keyPath: 'songId' });
      }
      if (!db.objectStoreNames.contains('app_assets')) {
        db.createObjectStore('app_assets', { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains('song_mp3s')) {
        db.createObjectStore('song_mp3s', { keyPath: 'songId' });
      }
      if (!db.objectStoreNames.contains('messages')) {
        const ms = db.createObjectStore('messages', { keyPath: 'id' });
        ms.createIndex('fp', 'fp', { unique: false });
        ms.createIndex('ts', 'ts', { unique: false });
      }
    };
    req.onsuccess = e => {
      _idb = e.target.result;
      _idbPromise = null;
      _idb.onversionchange = () => { _idb.close(); _idb = null; _idbPromise = null; };
      _idb.onclose = () => { _idb = null; _idbPromise = null; };
      resolve(_idb);
    };
    req.onerror = e => { _idbPromise = null; reject(e.target.error); };
    req.onblocked = () => { _idb = null; _idbPromise = null; };
  });
  return _idbPromise;
}

/* ── 泛用 IDB CRUD（單一 store 的 getAll / get / put / delete 樣板） ── */
async function idbGetAll(store) {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, 'readonly').objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbGet(store, key) {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, 'readonly').objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbPut(store, record) {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(record);
    tx.oncomplete = resolve;
    tx.onerror    = e => reject(e.target.error);
  });
}

async function idbDelete(store, key) {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = resolve;
    tx.onerror    = e => reject(e.target.error);
  });
}

const idbGetAllPosters = () => idbGetAll('posters');
const idbPutPoster     = (record) => idbPut('posters', record);
const idbDeletePoster  = (id) => idbDelete('posters', id);

/* ── Poster objectURL cache ── */
const _posterUrlCache = new Map(); // id → objectURL

function getPosterObjectUrl(record) {
  if (_posterUrlCache.has(record.id)) return _posterUrlCache.get(record.id);
  const url = URL.createObjectURL(record.blob);
  _posterUrlCache.set(record.id, url);
  return url;
}

/* ── App Asset IDB helpers ── */
const _assetUrlCache = new Map(); // key → objectURL

const idbGetAsset = (key) => idbGet('app_assets', key);
const idbPutAsset = (key, blob) => idbPut('app_assets', { key, blob });

function setAssetUrl(key, blob) {
  if (_assetUrlCache.has(key)) {
    URL.revokeObjectURL(_assetUrlCache.get(key));
    _assetUrlCache.delete(key);
  }
  const objectUrl = URL.createObjectURL(blob);
  _assetUrlCache.set(key, objectUrl);
  S[key] = objectUrl;
}

// 回傳實際載入成功的 key 陣列，讓 boot 判斷是否需要補刷 UI
async function loadAllAssets() {
  const keys = ['avatarChar', 'avatarPlayer', 'bgImage'];
  const loaded = [];
  await Promise.all(keys.map(async key => {
    try {
      const rec = await idbGetAsset(key);
      if (rec?.blob instanceof Blob) { setAssetUrl(key, rec.blob); loaded.push(key); }
    } catch (e) {
      console.warn('loadAllAssets:', key, e);
    }
  }));
  return loaded;
}

/* ── Song Cover IDB helpers ── */
const idbGetAllCovers = () => idbGetAll('song_covers');
const idbPutCover     = (record) => idbPut('song_covers', record); // { songId, blob, fileName }
const idbDeleteCover  = (songId) => idbDelete('song_covers', songId);

/* ── Cover objectURL cache ── */
const _coverUrlCache = new Map(); // songId → objectURL

function getCoverObjectUrl(songId, blob) {
  if (_coverUrlCache.has(songId)) return _coverUrlCache.get(songId);
  const url = URL.createObjectURL(blob);
  _coverUrlCache.set(songId, url);
  return url;
}

function revokeCoverUrl(songId) {
  if (_coverUrlCache.has(songId)) {
    URL.revokeObjectURL(_coverUrlCache.get(songId));
    _coverUrlCache.delete(songId);
  }
}

/* ── Song MP3 IDB helpers ── */
const _mp3UrlCache = new Map(); // songId → objectURL

function revokeMp3Url(songId) {
  if (_mp3UrlCache.has(songId)) {
    URL.revokeObjectURL(_mp3UrlCache.get(songId));
    _mp3UrlCache.delete(songId);
  }
}

const idbGetAllMp3s = () => idbGetAll('song_mp3s');
const idbPutMp3     = (record) => idbPut('song_mp3s', record); // { songId, blob, fileName }
const idbDeleteMp3  = (songId) => idbDelete('song_mp3s', songId);

/* ── Messages IDB helpers ── */
function msgFingerprint(m) {
  return m.type === 'msg'
    ? `${m.tsStr}|${m.name}|${(m.lines[0] || '').slice(0, 40)}`
    : `sep:${m.ts}`;
}

async function idbPutMessages(records) {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('messages', 'readwrite');
    const store = tx.objectStore('messages');
    records.forEach(r => store.put(r));
    tx.oncomplete = resolve;
    tx.onerror = e => reject(e.target.error);
  });
}

async function idbGetMessagesByIds(ids) {
  if (!ids || ids.length === 0) return [];
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('messages', 'readonly');
    const store = tx.objectStore('messages');
    const results = [];
    let pending = ids.length;
    ids.forEach(id => {
      const req = store.get(id);
      req.onsuccess = () => {
        if (req.result) results.push(req.result);
        if (--pending === 0) resolve(results);
      };
      req.onerror = () => { if (--pending === 0) resolve(results); };
    });
  });
}

async function idbGetAllMessageIds() {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('messages', 'readonly');
    const req = tx.objectStore('messages').getAllKeys();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = e => reject(e.target.error);
  });
}

async function idbGetUnclassifiedMessages(classifiedSet) {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('messages', 'readonly');
    const results = [];
    const req = tx.objectStore('messages').openCursor();
    req.onsuccess = e => {
      const cursor = e.target.result;
      if (!cursor) {
        results.sort((a, b) => (a.ts - b.ts) || (a.seq ?? 0) - (b.seq ?? 0));
        resolve(results);
        return;
      }
      if (!classifiedSet.has(cursor.value.id)) results.push(cursor.value);
      cursor.continue();
    };
    req.onerror = e => reject(e.target.error);
  });
}

async function idbDeleteMessages(ids) {
  if (!ids || ids.length === 0) return;
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('messages', 'readwrite');
    const store = tx.objectStore('messages');
    ids.forEach(id => store.delete(id));
    tx.oncomplete = resolve;
    tx.onerror = e => reject(e.target.error);
  });
}

async function idbGetAllFingerprints() {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('messages', 'readonly');
    const req = tx.objectStore('messages').index('fp').getAllKeys();
    req.onsuccess = () => resolve(new Set(req.result || []));
    req.onerror = e => reject(e.target.error);
  });
}

async function idbUpdateMessage(msg) {
  const db = await openPosterDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('messages', 'readwrite');
    tx.objectStore('messages').put(msg);
    tx.oncomplete = resolve;
    tx.onerror = e => reject(e.target.error);
  });
}

/* ── 啟動時從 IDB 讀取所有封面，填回 song.cover ── */
async function loadAllCoverUrls() {
  try {
    const records = await idbGetAllCovers();
    records.forEach(rec => {
      if (!(rec.blob instanceof Blob)) return;
      const song = S.songs.find(s => s.id === rec.songId);
      if (song) {
        song.cover = getCoverObjectUrl(rec.songId, rec.blob);
      }
    });
  } catch(e) { console.warn('loadAllCoverUrls:', e); }
}

async function loadAllMp3Urls() {
  try {
    const records = await idbGetAllMp3s();
    records.forEach(rec => {
      if (!(rec.blob instanceof Blob)) return;
      const song = S.songs.find(s => s.id === rec.songId);
      if (!song) return;
      revokeMp3Url(song.id);
      const objectUrl = URL.createObjectURL(rec.blob);
      _mp3UrlCache.set(song.id, objectUrl);
      song.mp3Url = objectUrl;
      song.mp3FileName = rec.fileName || '';
    });
  } catch(e) { console.warn('loadAllMp3Urls:', e); }
}

async function loadAllMemberPhotos() {
  try {
    await Promise.all(SS.members.map(async (m, idx) => {
      const keyById = m?.id ? `member_photo_${m.id}` : null;
      const legacyKey = `member_photo_${idx}`;
      let rec = null;
      if (keyById) rec = await idbGetAsset(keyById).catch(() => null);
      if (!rec) rec = await idbGetAsset(legacyKey).catch(() => null);
      if (!rec?.blob || !(rec.blob instanceof Blob)) return;
      // 釋放舊的 objectURL（若有）
      if (m.photo && m.photo.startsWith('blob:')) URL.revokeObjectURL(m.photo);
      SS.members[idx].photo = URL.createObjectURL(rec.blob);
      // 舊版索引 key 讀到後，遷移到穩定 id key
      if (keyById && !await idbGetAsset(keyById).catch(() => null)) {
        await idbPutAsset(keyById, rec.blob).catch(() => {});
      }
    }));
  } catch(e) { console.warn('loadAllMemberPhotos:', e); }
}

async function blobToBase64(blob) {
  const buffer = await blob.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  let binary = '';
  for (let i = 0; i < bytes.length; i += chunkSize) {
    const chunk = bytes.subarray(i, i + chunkSize);
    binary += String.fromCharCode.apply(null, chunk);
  }
  return btoa(binary);
}

async function exportStoreRecords(storeName) {
  const db = await openPosterDB();
  const records = await new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = e => reject(e.target.error);
  });
  const out = [];
  for (const rec of records) {
    if (rec?.blob instanceof Blob) {
      out.push({
        ...rec,
        blob: {
          type: rec.blob.type || 'application/octet-stream',
          size: rec.blob.size,
          base64: await blobToBase64(rec.blob)
        }
      });
    } else {
      out.push(rec);
    }
  }
  return out;
}

async function exportAllData() {
  saveNow();
  const idb = {};
  for (const name of IMPORT_STORES) {
    idb[name] = await exportStoreRecords(name);
  }
  const payload = {
    app: 'take_fire',
    version: 2,
    exportedAt: new Date().toISOString(),
    localStorage: {
      tak_fire_v2: lsGet('tak_fire_v2'),
      tak_fire_v2_sys: lsGet('tak_fire_v2_sys'),
      tak_fire_site_v1: lsGet('tak_fire_site_v1')
    },
    idb
  };
  const _d = new Date();
  const stamp = `${toDateStr(_d)}_${String(_d.getHours()).padStart(2,'0')}-${String(_d.getMinutes()).padStart(2,'0')}`;
  const fileName = `take_fire_backup_${stamp}.json`;
  const json = JSON.stringify(payload);
  const blob = new Blob([json], { type: 'application/json' });

  const fallbackDownload = () => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 30000);
    showModal({
      title: t('msg.exportDone'),
      desc: tf('msg.exportedFile', fileName),
      confirmText: t('msg.ok')
    });
  };

  // 優先使用 File System Access API（可選擇儲存位置）
  if (typeof window.showSaveFilePicker === 'function') {
    let handle;
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{ description: t('backupDesc'), accept: { 'application/json': ['.json'] } }]
      });
    } catch (e) {
      if (e.name === 'AbortError') return; // 使用者取消
      // 沙箱／iframe／權限政策不允許時，退回 blob 下載
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') { fallbackDownload(); return; }
      throw e;
    }
    try {
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      showModal({
        title: t('msg.exportDone'),
        desc: t('msg.exportSavedToPath'),
        confirmText: t('msg.ok')
      });
    } catch (e) {
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') { fallbackDownload(); return; }
      throw e;
    }
  } else {
    fallbackDownload();
  }
}

const IMPORT_STORES = ['posters', 'song_covers', 'app_assets', 'song_mp3s', 'messages'];

// 清空並以 idbData（exportStoreRecords 格式：blob 已轉 base64）還原指定的 IDB stores。
// 供 importAllData 的正式匯入與失敗後的還原（rollback）共用，確保兩者行為一致。
async function writeStoresFromRecords(idbData, stores) {
  const db = await openPosterDB();

  await new Promise((resolve, reject) => {
    const tx = db.transaction(stores, 'readwrite');
    stores.forEach(name => tx.objectStore(name).clear());
    tx.oncomplete = resolve;
    tx.onerror = e => reject(e.target.error);
  });

  for (const storeName of stores) {
    const records = idbData[storeName];
    if (!Array.isArray(records) || records.length === 0) continue;

    // 先預處理（base64 → Blob）並驗證所有資料；任一筆失敗就整個 store 中止
    let processed;
    try {
      processed = records.map(rec => {
        if (rec?.blob && typeof rec.blob === 'object' && rec.blob.base64) {
          const { type, base64 } = rec.blob;
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
          return { ...rec, blob: new Blob([bytes], { type: type || 'application/octet-stream' }) };
        }
        return rec;
      });
    } catch (e) {
      console.error(`writeStoresFromRecords [${storeName}]: invalid base64, store skipped`, e);
      continue;
    }

    const BATCH = 50;
    for (let i = 0; i < processed.length; i += BATCH) {
      const batch = processed.slice(i, i + BATCH);
      await new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        batch.forEach(rec => store.put(rec));
        tx.oncomplete = resolve;
        tx.onerror = e => reject(e.target.error);
        tx.onabort = e => reject(e.target.error || new Error('tx aborted'));
      });
    }
  }
}

async function importAllData(file) {
  if (file && file.size === 0) {
    throw new Error(t('msg.emptyFile'));
  }
  let payload;
  try {
    let text = await file.text();
    // 去除 UTF-8 BOM（部分編輯器另存會加上，會讓 JSON.parse 在第一個字元失敗）
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    payload = JSON.parse(text);
  } catch(e) {
    console.error('importAllData parse failed:', e);
    throw new Error(`${t('msg.parseFail')} (${e?.name || ''}: ${e?.message || e})`);
  }

  if (payload?.app !== 'take_fire') {
    throw new Error(t('msg.notTakeFire'));
  }

  const lsKeys = ['tak_fire_v2', 'tak_fire_v2_sys', 'tak_fire_site_v1'];

  // 匯入前先備份目前的 localStorage 與 IDB 內容，若中途失敗就整批還原，
  // 避免出現「部分 store 已被新資料覆蓋、部分還沒寫入」的半新半舊毀損狀態。
  const lsBackup = {};
  lsKeys.forEach(k => { lsBackup[k] = lsGet(k); });
  const idbBackup = {};
  for (const name of IMPORT_STORES) {
    idbBackup[name] = await exportStoreRecords(name);
  }

  try {
    // 1. 清空並寫回 localStorage
    lsKeys.forEach(k => lsRemove(k));
    const ls = payload.localStorage || {};
    if (ls.tak_fire_v2)      lsSet('tak_fire_v2',      ls.tak_fire_v2);
    if (ls.tak_fire_v2_sys)  lsSet('tak_fire_v2_sys',  ls.tak_fire_v2_sys);
    if (ls.tak_fire_site_v1) lsSet('tak_fire_site_v1', ls.tak_fire_site_v1);

    // 2. 清空並還原 IDB
    await writeStoresFromRecords(payload.idb || {}, IMPORT_STORES);
  } catch (e) {
    console.error('importAllData failed, rolling back to pre-import data:', e);
    try {
      lsKeys.forEach(k => { if (lsBackup[k] == null) lsRemove(k); else lsSet(k, lsBackup[k]); });
      await writeStoresFromRecords(idbBackup, IMPORT_STORES);
      e.message = `${e.message}\n${t('imp.rolledBack')}`;
    } catch (rollbackErr) {
      console.error('importAllData: rollback also failed, data may be inconsistent', rollbackErr);
      e.message = `${e.message}\n${t('imp.rollbackFailed')}`;
    }
    throw e;
  }
}

let _curLang = 'zh-TW';

function t(key, fallback) {
  const dict = I18N[_curLang] || I18N['zh-TW'];
  if (dict && Object.prototype.hasOwnProperty.call(dict, key)) return dict[key];
  if (I18N['zh-TW'] && Object.prototype.hasOwnProperty.call(I18N['zh-TW'], key)) return I18N['zh-TW'][key];
  return fallback != null ? fallback : key;
}

function tf(key, ...args) {
  let s = t(key, null);
  if (s == null) s = key;
  let i = 0;
  return s.replace(/%s/g, () => (i < args.length ? String(args[i++]) : '%s'));
}

function applyI18n(root) {
  const scope = root || document;
  scope.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    const v = t(k, null);
    if (v != null) el.textContent = v;
  });
  scope.querySelectorAll('[data-i18n-title]').forEach(el => {
    const k = el.getAttribute('data-i18n-title');
    const v = t(k, null);
    if (v != null) el.setAttribute('title', v);
  });
  scope.querySelectorAll('[data-i18n-aria]').forEach(el => {
    const k = el.getAttribute('data-i18n-aria');
    const v = t(k, null);
    if (v != null) el.setAttribute('aria-label', v);
  });
  scope.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const k = el.getAttribute('data-i18n-placeholder');
    const v = t(k, null);
    if (v != null) el.setAttribute('placeholder', v);
  });
  try { document.documentElement.setAttribute('lang', _curLang); } catch(_) {}
}

function setLanguage(lang) {
  if (!I18N[lang]) lang = 'zh-TW';
  _curLang = lang;
  applyI18n();
}

const _memStorageFallback = new Map();
let _lsAvailable = null;
function getSafeLocalStorage() {
  if (_lsAvailable === false) return null;
  try {
    const s = window.localStorage;
    const probeKey = '__tf_ls_probe__';
    s.setItem(probeKey, '1');
    s.removeItem(probeKey);
    _lsAvailable = true;
    return s;
  } catch (_) {
    _lsAvailable = false;
    return null;
  }
}
function lsGet(key) {
  const s = getSafeLocalStorage();
  if (s) {
    try { return s.getItem(key); } catch (_) {}
  }
  return _memStorageFallback.has(key) ? _memStorageFallback.get(key) : null;
}
function lsSet(key, value) {
  const s = getSafeLocalStorage();
  if (s) {
    s.setItem(key, value);
    return true;
  }
  _memStorageFallback.set(key, String(value));
  return false;
}
function lsRemove(key) {
  const s = getSafeLocalStorage();
  if (s) {
    try { s.removeItem(key); } catch (_) {}
  }
  _memStorageFallback.delete(key);
}

function uid() {
  // 優先使用 crypto.randomUUID（現代瀏覽器都支援），避免批次匯入時碰撞
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  // Fallback：時間戳 + 12 字元 random
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 9) + Math.random().toString(36).slice(2, 7);
}

// 本地時區的 YYYY-MM-DD（不可用 toISOString，會有 UTC 時區位移）
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// 讓可點擊的非 button 元素支援鍵盤操作（Tab 聚焦、Enter / Space 觸發 click）
function addKeyActivation(el) {
  el.setAttribute('role', 'button');
  el.tabIndex = 0;
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  });
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function escAttr(s) {
  return esc(s).replace(/"/g, '&quot;');
}

// 白名單檢查：僅允許 http/https/mailto 與 blob:/data: 影音 URL
// 任何 javascript:、vbscript:、file: 等 schema 一律改回 # 以避免 XSS
function safeUrl(s) {
  if (typeof s !== 'string') return '#';
  const trimmed = s.trim();
  if (!trimmed) return '#';
  // 相對路徑（不含 schema）視為安全
  if (!/^[a-z][a-z0-9+.-]*:/i.test(trimmed)) return trimmed;
  if (/^(https?|mailto|blob|data):/i.test(trimmed)) return trimmed;
  return '#';
}

/* ══════════════════════════════════════════════════════════
   Persistence
══════════════════════════════════════════════════════════ */
const LS = 'tak_fire_v2';
const SAVE_DEBOUNCE_MS = 220;
let _saveTimer = null;
let _savePending = false;

function saveNow() {
  _savePending = false;
  try {
    const songsToSave = S.songs.map(s => {
      // cover 為 objectURL 不可持久化；_isNew / _isEditing 為 UI 暫時狀態，一併剝除
      const { cover, _isNew, _isEditing, ...rest } = s;
      return rest;
    });
    const persisted = lsSet(LS, JSON.stringify({
      folders     : S.folders,
      songs       : songsToSave,
      nameOrder   : S.nameOrder,
      folderSort  : S.folderSort,
      rightTab    : S.rightTab,
      calendarCollapsed: S.calendarCollapsed,
      collapsedFolders: [...S.collapsedFolders],
      roleLabels  : S.roleLabels
    }));
    if (!persisted) {
      notifyStorageError(new Error('localStorage unavailable'));
      console.warn('localStorage unavailable; data stored in memory fallback only.');
    }
  } catch(e) {
    console.warn('localStorage:', e);
    notifyStorageError(e);
  }
}

// 對儲存空間錯誤只彈一次 modal，避免反覆打擾（localStorage 與 IndexedDB 媒體檔案分開節流）
let _quotaWarned = false;
let _mediaQuotaWarned = false;
function notifyStorageError(err, kind = 'local') {
  const isQuota = err && (
    err.name === 'QuotaExceededError' ||
    err.code === 22 || err.code === 1014 ||
    /quota/i.test(err.message || '')
  );
  const isUnavailable = err && /localstorage unavailable/i.test(err.message || '');
  if (!isQuota && !isUnavailable) return;

  if (kind === 'media') {
    if (_mediaQuotaWarned) return;
    _mediaQuotaWarned = true;
    try {
      showModal({
        title: t('msg.mediaStorageFull'),
        desc: t('msg.mediaStorageFullDesc'),
        confirmText: t('msg.gotIt'),
        onConfirm: () => { _mediaQuotaWarned = false; }
      });
    } catch { _mediaQuotaWarned = false; }
    return;
  }

  if (_quotaWarned) return;
  _quotaWarned = true;
  try {
    showModal({
      title: t('msg.storageFull'),
      desc: t('msg.storageFullDesc'),
      confirmText: t('msg.gotIt'),
      onConfirm: () => { _quotaWarned = false; }
    });
  } catch { _quotaWarned = false; }
}

function save() {
  _savePending = true;
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    _saveTimer = null;
    if (_savePending) saveNow();
  }, SAVE_DEBOUNCE_MS);
}

window.addEventListener('beforeunload', () => {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = null;
  if (_savePending) saveNow();
});

// 行動裝置上 beforeunload 不可靠；分頁隱藏（切換 App、鎖屏）時也 flush 一次
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
  if (_savePending) saveNow();
});

function load() {
  try {
    const d = JSON.parse(lsGet(LS) || 'null');
    if (!d) return;
    // 舊版資料遷移：若 localStorage 仍有 allMessages，遷移至 IDB 後刪除
    if (Array.isArray(d.allMessages) && d.allMessages.length > 0) {
      const toMigrate = d.allMessages.map(m => ({ ...m, fp: msgFingerprint(m) }));
      idbPutMessages(toMigrate).then(() => {
        // 遷移成功後清除舊 localStorage 鍵值，重新存回
        const cleaned = { ...d };
        delete cleaned.allMessages;
        try { lsSet(LS, JSON.stringify(cleaned)); } catch(e) {}
        // 補充 nameOrder
        toMigrate.forEach(m => { if (m.type === 'msg') registerName(m.name); });
        refreshUnclassifiedCount();
      }).catch(err => console.warn('migrate allMessages:', err));
    }
    S.songs = (d.songs || []).map(song => {
      if (!song) return song;
      const next = { ...song };
      const mp3 = String(next.mp3Url || '');
      if (mp3.startsWith('blob:') || mp3.startsWith('data:audio/')) {
        next.mp3Url = '';
      }
      delete next.cover;
      // 舊版曾誤將 UI 暫時狀態持久化，載入時清除
      delete next._isNew;
      delete next._isEditing;
      return next;
    });
    S.folders = (d.folders || []).map((f, i) => {
      const upgradedNotes = (f.notes || []).map(n => ({
        date: '', endDate: '', cat: 'life', ...n
      }));
      return { parentId: null, createdAt: Date.now() + i, ...f, notes: upgradedNotes };
    });
    S.nameOrder   = d.nameOrder   || [];
    S.folderSort  = d.folderSort  || 'desc';
    S.rightTab    = d.rightTab    || 'events';
    S.calendarCollapsed = !!d.calendarCollapsed;
    S.collapsedFolders = new Set(Array.isArray(d.collapsedFolders) ? d.collapsedFolders : []);
    S.roleLabels  = { character: '', player: '', ...(d.roleLabels || {}) };
    S.avatarChar  = null;
    S.avatarPlayer= null;
    S.bgImage     = null;
  } catch(e) {
    console.error('load() failed — localStorage 資料可能毀損：', e);
    // 保留原始字串到備份 key 以便後續手動還原
    try {
      const raw = lsGet(LS);
      if (raw) lsSet(LS + '_corrupted_' + Date.now(), raw);
    } catch {}
  }
}

/* ══════════════════════════════════════════════════════════
   Date Extraction Helper
══════════════════════════════════════════════════════════ */
function extractDateFromMsg(msg) {
  // sep 型訊息沒有 lines 欄位，直接視為無日期
  if (!msg || !Array.isArray(msg.lines)) return '';
  
  // 1. 優先從「對話內容」抓取 RP 時間 (例如：2月14日)
  const contentText = msg.lines.slice(0, 3).join(' ');
  
  // 找尋 YYYY年MM月DD日 或 YYYY-MM-DD
  let m = contentText.match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})[日]?/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  
  // 找尋 MM月DD日
  m = contentText.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  if (m) {
    // 若只有月日，則嘗試抓取系統發送時間的年份，若無則用當前年份
    let year = new Date().getFullYear();
    if (msg.tsStr) {
      const tsMatch = msg.tsStr.match(/^(\d{4})/);
      if (tsMatch) year = tsMatch[1];
    }
    return `${year}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  }

  // 2. 如果內容沒有提到時間，才退回到系統的發送時間 (msg.tsStr)
  if (msg.tsStr) {
    m = msg.tsStr.match(/(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})[日]?/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  }
  
  return '';
}

function extractEmbedUrl(input) {
  if (!input) return '';
  const iframeMatch = input.match(/src=["'](.*?)["']/i);
  if (iframeMatch) return iframeMatch[1];
  return input.trim();
}

function normalizeEmbedUrl(input) {
  const raw = extractEmbedUrl(input);
  if (!raw) return '';
  let src = raw.trim();
  if (!/^https?:\/\//i.test(src)) src = `https://${src.replace(/^\/+/, '')}`;

  let url;
  try {
    url = new URL(src);
  } catch (e) {
    return raw.trim();
  }

  const host = url.hostname.toLowerCase().replace(/^www\./, '');
  const pathname = url.pathname || '';

  if (host === 'open.spotify.com') {
    const m = pathname.match(/^\/(track|album|playlist|episode|show)\/([^/?#]+)/);
    if (m) return `https://open.spotify.com/embed/${m[1]}/${m[2]}`;
  }

  if (host === 'soundcloud.com' || host === 'm.soundcloud.com' || host === 'on.soundcloud.com') {
    return `https://w.soundcloud.com/player/?url=${encodeURIComponent(url.toString())}&color=%23a58bff&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&show_teaser=true`;
  }

  const sunoSong = url.toString().match(/(?:suno\.com|app\.suno\.ai)\/(?:song|s)\/([^/?]+)/);
  const sunoPlaylist = url.toString().match(/suno\.com\/playlist\/([^/?]+)/);
  if (sunoSong) {
    if (sunoSong[1].length < 30) return '';
    return `https://suno.com/embed/${sunoSong[1]}`;
  }
  if (sunoPlaylist) return `https://suno.com/embed/playlist/${sunoPlaylist[1]}`;

  if (host === 'youtu.be') {
    const vid = pathname.split('/').filter(Boolean)[0];
    if (vid) return `https://www.youtube.com/embed/${vid}`;
  }
  if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') {
    if (pathname === '/watch') {
      const vid = url.searchParams.get('v');
      if (vid) return `https://www.youtube.com/embed/${vid}`;
    }
    const embedded = pathname.match(/^\/embed\/([^/?#]+)/);
    if (embedded) return `https://www.youtube.com/embed/${embedded[1]}`;
  }

  return url.toString();
}

function extractCoverColor(imgEl, cardEl) {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 4;
    const ctx = c.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, 4, 4);
    const d = ctx.getImageData(1, 1, 2, 2).data; // 中心 2×2，避開純黑邊角
    const r = Math.round((d[0] + d[4] + d[8]  + d[12]) / 4);
    const g = Math.round((d[1] + d[5] + d[9]  + d[13]) / 4);
    const b = Math.round((d[2] + d[6] + d[10] + d[14]) / 4);
    cardEl.style.setProperty('--cover-rgb', `${r} ${g} ${b}`);
  } catch {}
}

function normalizeCoverSrc(input) {
  const raw = String(input || '').trim();
  if (!raw) return '';
  if (/^(data:image\/|blob:|https?:\/\/|file:\/\/)/i.test(raw)) return raw;
  if (/^[A-Za-z]:[\\/]/.test(raw)) {
    const p = raw.replace(/\\/g, '/');
    return encodeURI(`file:///${p}`);
  }
  if (raw.startsWith('/')) return encodeURI(raw);
  return encodeURI(raw);
}

function isEmbeddableMediaUrl(input) {
  if (!input) return false;
  let u;
  try {
    u = new URL(input);
  } catch (e) {
    return false;
  }
  const host = u.hostname.toLowerCase().replace(/^www\./, '');
  const path = u.pathname || '';
  if (host === 'youtube.com' || host === 'm.youtube.com') return path.startsWith('/embed/');
  if (host === 'open.spotify.com') return path.startsWith('/embed/');
  if (host === 'w.soundcloud.com') return path.startsWith('/player/');
  if (host === 'suno.com') return path.startsWith('/embed/');
  return false;
}

function buildEmbedHtml(url, size = 'large') {
  if (!url) return '';
  const src = normalizeEmbedUrl(url);
  if (src && isEmbeddableMediaUrl(src)) {
    const h = size === 'small' ? 80 : 120;
    return `<iframe src="${escAttr(src)}" height="${h}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
  }
  const pad    = size === 'small' ? '10px' : '14px';
  const linkP  = size === 'small' ? '6px 11px' : '7px 12px';
  return `<div style="padding:${pad};text-align:center;font-size:12px;color:var(--c-hint);"><a href="${escAttr(safeUrl(url))}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:${linkP};border-radius:6px;background:rgb(var(--c-primary-rgb)/0.16);color:var(--c-text);text-decoration:none;">${t('msg.openExtMusic')}</a></div>`;
}

/* ══════════════════════════════════════════════════════════
   Parser
══════════════════════════════════════════════════════════ */
const HEADER = /^\[([^\]]+)\]\s+(.+?):\s*(.*)/;

function parseTs(str) {
  if (!str) return 0;
  // 優先用 regex 解析 YYYY[/-]M[/-]D [HH:mm[:ss]] 格式以避開 Safari 對非 ISO 字串的 NaN
  const m = String(str).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) {
    const t = new Date(+m[1], +m[2] - 1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0)).getTime();
    if (!isNaN(t)) return t;
  }
  const d = new Date(String(str).replace(/\//g, '-'));
  return isNaN(d.getTime()) ? 0 : d.getTime();
}

function parseTxt(text) {
  const lines  = text.split(/\r?\n/);
  const result = [];
  let cur = null;
  let lastTs = 0;
  let seq = 0;

  function flush() {
    if (!cur) return;
    while (cur.lines.length && cur.lines[cur.lines.length - 1].trim() === '') cur.lines.pop();
    if (cur.lines.length) result.push(cur);
    cur = null;
  }

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^\[\*{3}\]\s*$/.test(line)) {
      if (cur) cur.lines.push('***');
      continue;
    }
    const m = HEADER.exec(line);
    if (m) {
      flush();
      const [, tsStr, name, rest] = m;
      const ts = parseTs(tsStr.trim());
      lastTs = ts || lastTs;
      cur = {
        id      : uid(),
        type    : 'msg',
        ts,
        seq     : seq++,
        tsStr   : tsStr.trim(),
        name    : name.trim(),
        lines   : [],
        folderId: null,
      };
      if (rest.trim()) cur.lines.push(rest);
      continue;
    }
    if (line.trim() === '***') {
      if (cur) cur.lines.push('***');
      continue;
    }
    if (cur) cur.lines.push(line);
  }
  flush();
  return result;
}

function registerName(name) {
  if (!S.nameOrder.includes(name)) S.nameOrder.push(name);
}

function roleOf(name) {
  const n = String(name || '').trim();
  if (/^Environment\s*\(system\)$/i.test(n)) return 'character';
  if (S.nameOrder.length === 0) return 'character';
  return S.nameOrder[0] === name ? 'character' : 'player';
}

function displayNameOf(name) {
  const role = roleOf(name);
  if (role === 'character') return getRoleLabel('character');
  if (role === 'player') return getRoleLabel('player');
  return name || '';
}

function isSystemDividerMsg(name) {
  return /^Environment\s*\(system\)$/i.test(String(name || '').trim());
}

/* ══════════════════════════════════════════════════════════
   Inline rendering
══════════════════════════════════════════════════════════ */
function renderLines(lines) {
  const parts = [];
  for (const line of lines) {
    if (line.trim() === '---' || line.trim() === '***' || /^\[\*{3}\]$/.test(line.trim())) {
      parts.push('<hr class="bubble-divider">');
      continue;
    }
    if (line.trim() === '') {
      parts.push('<span class="bubble-line bubble-blank"><br></span>');
      continue;
    }
    parts.push('<span class="bubble-line">' + renderInline(line) + '</span>');
  }
  return parts.join('\n');
}

function renderInline(text) {
  // 只配對 *內容* 格式 *）
  return text.split(/(\*[^*]+\*)/g).map(seg => {
    if (seg.length > 2 && seg[0] === '*' && seg[seg.length - 1] === '*') {
      return `<span class="t-action">${esc(seg.slice(1, -1))}</span>`;
    }
    return seg ? `<span class="t-speech">${esc(seg)}</span>` : '';
  }).join('');
}

/* ══════════════════════════════════════════════════════════
   Data helpers
══════════════════════════════════════════════════════════ */
function classifiedIds() {
  const set = new Set();
  S.folders.forEach(f => f.msgIds.forEach(id => set.add(id)));
  return set;
}

// visibleMsgs 現在直接回傳 S.allMessages（已是當前 view 的快取）
function visibleMsgs() {
  return S.allMessages;
}

function unclassifiedCount() {
  return S.msgCount;
}

// 從 IDB 重算未歸類計數（只在 boot 和 import 後呼叫）
async function refreshUnclassifiedCount() {
  try {
    const cls = classifiedIds();
    const allIds = await idbGetAllMessageIds();
    S.msgCount = allIds.filter(id => !cls.has(id)).length;
    renderFolders();
  } catch(e) {}
}

// 同步調整計數（不需 IDB，用於 delete / dropIntoFolder / 移回未歸類）
function adjustUnclassifiedCount(delta) {
  S.msgCount = Math.max(0, S.msgCount + delta);
  renderFolders();
}

/* ══════════════════════════════════════════════════════════
   View / Scroll Anchor Persistence
   - S.view: 當前資料夾 id；存進 localStorage 讓 reload 回到原資料夾
   - _viewScrollMap: 每個資料夾的最後可見訊息 id；切換 / reload 後回到該則
══════════════════════════════════════════════════════════ */
const LS_VIEW_STATE = 'tak_fire_view_v1';
const _viewScrollMap = new Map();
const VIEW_KEY_UNC = '__unc__';
const _viewKey = () => S.view === null ? VIEW_KEY_UNC : S.view;

function saveViewState() {
  try {
    lsSet(LS_VIEW_STATE, JSON.stringify({
      view: S.view,
      anchors: Object.fromEntries(_viewScrollMap),
    }));
  } catch(e) {}
}

function loadViewState() {
  try {
    const raw = lsGet(LS_VIEW_STATE);
    if (!raw) return;
    const d = JSON.parse(raw);
    // 還原 view（驗證 folder 仍存在）
    if (d.view === null) S.view = null;
    else if (typeof d.view === 'string' && S.folders.some(f => f.id === d.view)) S.view = d.view;
    // 還原 anchor map
    if (d.anchors && typeof d.anchors === 'object') {
      for (const [k, v] of Object.entries(d.anchors)) _viewScrollMap.set(k, v);
    }
  } catch(e) {}
}

// 抓 #message-list 視窗頂端第一則可見訊息的 id，存到當前 view 的 anchor
function captureCurrentScrollAnchor() {
  const list = $('message-list');
  if (!list) return;
  const topThreshold = list.getBoundingClientRect().top + 8;
  const els = list.querySelectorAll('[data-id]');
  for (const el of els) {
    if (el.getBoundingClientRect().bottom > topThreshold) {
      _viewScrollMap.set(_viewKey(), el.dataset.id);
      saveViewState();
      return;
    }
  }
}

// 等 renderMsgs 完成後，捲到 anchor 位置；找不到該訊息時不動
async function restoreScrollAnchor() {
  await _renderDonePromise;
  const id = _viewScrollMap.get(_viewKey());
  if (!id) return;
  const el = $('message-list').querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (el) el.scrollIntoView({ block: 'start' });
}

let _scrollSaveTimer = null;
function scheduleScrollCapture() {
  clearTimeout(_scrollSaveTimer);
  _scrollSaveTimer = setTimeout(captureCurrentScrollAnchor, 250);
}

// 清掉 folder.msgIds 中已不存在於 IDB 的孤立 ID（歷史遺留的失效引用）
// 在 boot 時呼叫一次；有清掉就 save 並 renderFolders 重算計數
async function pruneOrphanMsgIds() {
  try {
    const allIds = await idbGetAllMessageIds();
    const valid = new Set(allIds);
    let removed = 0;
    for (const f of S.folders) {
      const before = f.msgIds.length;
      f.msgIds = f.msgIds.filter(id => valid.has(id));
      removed += before - f.msgIds.length;
    }
    if (removed > 0) {
      save();
      renderFolders();
      console.info(`pruneOrphanMsgIds: removed ${removed} orphan id(s)`);
    }
  } catch(e) {
    console.warn('pruneOrphanMsgIds:', e);
  }
}

// 非同步載入當前 view 的訊息到 S.allMessages
async function loadViewMessages() {
  try {
    if (S.view === null) {
      const cls = classifiedIds();
      S.allMessages = await idbGetUnclassifiedMessages(cls);
    } else {
      const folder = S.folders.find(f => f.id === S.view);
      if (!folder) {
        // S.view 指向已被刪除的資料夾 — reset 回未歸類視圖以避免後續操作基於失效狀態
        S.view = null;
        const cls = classifiedIds();
        S.allMessages = await idbGetUnclassifiedMessages(cls);
        return;
      }
      // 父資料夾：合併自身 + 所有子資料夾的訊息，按 ts/seq 時序排
      const children = S.folders.filter(f => f.parentId === folder.id);
      if (children.length > 0) {
        const allIds = [...folder.msgIds, ...children.flatMap(c => c.msgIds)];
        const msgs = await idbGetMessagesByIds(allIds);
        msgs.sort((a, b) => (a.ts ?? 0) - (b.ts ?? 0) || (a.seq ?? 0) - (b.seq ?? 0));
        S.allMessages = msgs;
      } else {
        const msgs = await idbGetMessagesByIds(folder.msgIds);
        // 純子資料夾 / 無子的父資料夾：保持 msgIds 既有順序
        const orderMap = new Map(folder.msgIds.map((id, i) => [id, i]));
        msgs.sort((a, b) => (orderMap.get(a.id) ?? 0) - (orderMap.get(b.id) ?? 0));
        S.allMessages = msgs;
      }
    }
  } catch(e) { S.allMessages = []; }
}

/* ══════════════════════════════════════════════════════════
   Render — Messages
══════════════════════════════════════════════════════════ */
// Cancel token：每次新的 renderMsgs 呼叫都會讓上一次的批次失效
let _renderGeneration = 0;

// 當前 renderMsgs 完成後 resolve 的 Promise（供 jumpToEvent 等待）
let _renderDonePromise = Promise.resolve();

function buildMsgElement(msg, idx, msgs) {
  if (msg.type === 'sep') {
    const el = document.createElement('div');
    el.className = 'msg-separator';
    el.dataset.id = msg.id;
    el.textContent = '· · ·';
    return el;
  }

  if (isSystemDividerMsg(msg.name)) {
    const sys = document.createElement('div');
    sys.className = 'msg-system-divider';
    sys.dataset.id = msg.id;
    sys.dataset.idx = idx;
    const text = document.createElement('div');
    text.className = 'msg-system-text';
    text.innerHTML = renderLines(msg.lines);
    sys.appendChild(text);
    // 事件透過 #message-list 委派處理（見 initMessageListDelegation）
    return sys;
  }

  const role = roleOf(msg.name);
  const displayName = displayNameOf(msg.name);
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  row.dataset.id  = msg.id;
  row.dataset.idx = idx;

  if (S.selSet.has(msg.id)) {
    row.classList.add(msg.id === S.selAnchor ? 'sel-anchor' : 'sel-range');
  }

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  const avatarKey = role === 'character' ? 'avatarChar' : 'avatarPlayer';
  if (S[avatarKey]) {
    const img = document.createElement('img');
    img.src = S[avatarKey];
    avatar.appendChild(img);
  } else {
    avatar.textContent = (displayName[0] || '?');
  }

  const col = document.createElement('div');
  col.className = 'msg-col';

  const nameEl = document.createElement('div');
  nameEl.className = 'msg-name';
  nameEl.textContent = displayName;

  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';

  const timeEl = document.createElement('div');
  timeEl.className = 'msg-time';
  timeEl.textContent = formatTime(msg.tsStr);

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderLines(msg.lines);

  wrap.appendChild(bubble);
  wrap.appendChild(timeEl);

  col.appendChild(nameEl);
  col.appendChild(wrap);

  row.appendChild(avatar);
  row.appendChild(col);
  // 事件透過 #message-list 委派處理（見 initMessageListDelegation）

  return row;
}

/* ──────────────────────────────────────────────────────────
   訊息事件委派 — 把原本每筆訊息 3 個 listener 壓成 list 上 3 個
   靠 closest('[data-id]') 找回對應節點，idx 從 dataset.idx 讀
────────────────────────────────────────────────────────── */
function initMessageListDelegation() {
  const list = $('message-list');
  if (!list || list._delegationBound) return;
  list._delegationBound = true;

  // 捲動時 debounced 記錄當前 view 的可見訊息錨點
  list.addEventListener('scroll', scheduleScrollCapture, { passive: true });
  // 關閉 / 重新整理前最後一次保存（捕捉到還沒 debounce 觸發的位置）
  window.addEventListener('beforeunload', captureCurrentScrollAnchor);

  const findTarget = e => e.target.closest('.msg-row, .msg-system-divider');

  list.addEventListener('click', e => {
    const el = findTarget(e);
    if (!el) return;
    const msgId = el.dataset.id;
    const idx = +el.dataset.idx;
    handleClick(msgId, idx, S.allMessages);
  });

  list.addEventListener('dblclick', e => {
    const el = findTarget(e);
    if (!el) return;
    e.preventDefault();
    window.getSelection().removeAllRanges();
    editMessage(el.dataset.id);
  });

  list.addEventListener('mousedown', e => {
    const el = findTarget(e);
    if (!el) return;
    handleMouseDown(e, el.dataset.id);
  });
}

const RENDER_BATCH_SIZE = 40;
const _ric = typeof requestIdleCallback === 'function'
  ? (cb) => requestIdleCallback(cb, { timeout: 300 })
  : (cb) => setTimeout(cb, 0);

async function renderMsgs() {
  const gen = ++_renderGeneration;
  // 同步換上新的 promise，讓呼叫後立即 await _renderDonePromise 的程式
  // （如 jumpToEvent）等到的是「這一次」render 的完成
  let done;
  _renderDonePromise = new Promise(resolve => { done = resolve; });
  const list = $('message-list');
  list.innerHTML = `<div class="empty-state"><small>${t('msg.loading')}</small></div>`;
  await loadViewMessages();
  if (gen !== _renderGeneration) { done(); return; } // 已被新的呼叫取代

  const msgs = visibleMsgs();
  list.innerHTML = '';

  if (msgs.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <small>${t('msg.uploadEmpty')}</small>
      </div>`;
    done();
    return;
  }

  // 第一批同步渲染，避免空白感
  const firstBatch = msgs.slice(0, RENDER_BATCH_SIZE);
  const frag = document.createDocumentFragment();
  firstBatch.forEach((msg, i) => frag.appendChild(buildMsgElement(msg, i, msgs)));
  list.appendChild(frag);

  if (msgs.length <= RENDER_BATCH_SIZE) {
    done();
    return;
  }

  // 剩餘批次用 idle callback 分批追加
  let offset = RENDER_BATCH_SIZE;
  function appendNext() {
    if (gen !== _renderGeneration) { done(); return; }
    const batch = msgs.slice(offset, offset + RENDER_BATCH_SIZE);
    if (batch.length === 0) { done(); return; }
    const f = document.createDocumentFragment();
    batch.forEach((msg, i) => f.appendChild(buildMsgElement(msg, offset + i, msgs)));
    list.appendChild(f);
    offset += RENDER_BATCH_SIZE;
    if (offset < msgs.length) _ric(appendNext);
    else done();
  }
  _ric(appendNext);
}

function formatTime(tsStr) {
  if (!tsStr) return '';
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(tsStr)) return tsStr;
  const m = tsStr.match(/(\d{1,2}:\d{2})/);
  return m ? m[1] : '';
}

// 剪貼簿輔助函式
function copyTextToClipboard(text, callback) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(callback).catch(() => fallbackCopy(text, callback));
  } else {
    fallbackCopy(text, callback);
  }
}
function fallbackCopy(text, callback) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  try { document.execCommand('copy'); if(callback) callback(); } catch (err) {}
  document.body.removeChild(textArea);
}

/* ══════════════════════════════════════════════════════════
   Selection logic
══════════════════════════════════════════════════════════ */
function handleClick(msgId, idx, msgs) {
  if (S.isDragging) return;
  if (!S.selAnchor) {
    S.selAnchor = msgId;
    S.selEnd    = null;
    S.selSet    = new Set([msgId]);
  } else if (!S.selEnd) {
    if (msgId === S.selAnchor) {
      clearSel();
    } else {
      S.selEnd = msgId;
      // 不使用傳入的 idx（dataset.idx 在就地刪除訊息後會過期），改由陣列即時查找
      const ai = msgs.findIndex(m => m.id === S.selAnchor);
      const ci = msgs.findIndex(m => m.id === msgId);
      const lo = Math.min(ai, ci);
      const hi = Math.max(ai, ci);
      S.selSet = new Set();
      for (let i = lo; i <= hi; i++) {
        if (msgs[i]?.type === 'msg') S.selSet.add(msgs[i].id);
      }
    }
  } else {
    clearSel();
  }
  applySelectionDOM();
}

// 只更新選取狀態的 DOM class，不重新渲染整個列表
function applySelectionDOM() {
  const list = $('message-list');
  list.querySelectorAll('.msg-row, .msg-system-divider').forEach(el => {
    const id = el.dataset.id;
    el.classList.remove('sel-anchor', 'sel-range');
    if (S.selSet.has(id)) {
      el.classList.add(id === S.selAnchor ? 'sel-anchor' : 'sel-range');
    }
  });
}

function clearSel() {
  S.selAnchor = null;
  S.selEnd    = null;
  S.selSet    = new Set();
  const list = $('message-list');
  if (list) {
    list.querySelectorAll('.sel-anchor, .sel-range').forEach(el => {
      el.classList.remove('sel-anchor', 'sel-range');
    });
  }
}

/* ══════════════════════════════════════════════════════════
   Drag
══════════════════════════════════════════════════════════ */
function handleMouseDown(e, msgId) {
  if (!S.selSet.has(msgId)) return;
  if (e.detail > 1) return;
  e.preventDefault();
  S.mx = e.clientX;
  S.my = e.clientY;
  S.dragType = 'msg';
  S.dragTimer = setTimeout(() => startDrag(), 400);
}

// 拖曳期間共用的 folder rect 快取，避免每次 mousemove 都 reflow
let _dragFolderRects = [];
let _songDragCards = [];
let _songDragCardMap = new Map();
let _songDragHoverIdx = -1;
let _songDragHoverPos = '';
let _songDragRaf = 0;
let _songRenderCleanups = [];
function snapshotFolderRects() {
  _dragFolderRects = [...document.querySelectorAll('.folder-item[data-folder-id]')].map(el => ({
    el,
    fid: el.dataset.folderId,
    rect: el.getBoundingClientRect()
  }));
}

function snapshotSongDragRects() {
  _songDragCards = [...document.querySelectorAll('.song-card')].map(el => {
    const card = {
      el,
      idx: parseInt(el.dataset.idx, 10),
      rect: el.getBoundingClientRect()
    };
    return card;
  });
  _songDragCardMap = new Map(_songDragCards.map(card => [card.idx, card]));
}

function clearSongDragIndicators() {
  _songDragCards.forEach(({ el }) => el.classList.remove('drag-over-top', 'drag-over-bottom', 'dragging'));
  _songDragHoverIdx = -1;
  _songDragHoverPos = '';
}

function cleanupSongRenderResources() {
  _songRenderCleanups.forEach(fn => {
    try { fn(); } catch (_) {}
  });
  _songRenderCleanups = [];
}

function updateSongDragHover(clientX, clientY) {
  let nextIdx = -1;
  let nextPos = '';

  for (const { idx, rect: r } of _songDragCards) {
    if (idx === S.dragSongIdx) continue;
    if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
      nextIdx = idx;
      nextPos = clientY > r.top + r.height / 2 ? 'bottom' : 'top';
      break;
    }
  }

  if (nextIdx === _songDragHoverIdx && nextPos === _songDragHoverPos) return;

  if (_songDragHoverIdx !== -1) {
    const prev = _songDragCardMap.get(_songDragHoverIdx);
    prev?.el.classList.remove('drag-over-top', 'drag-over-bottom');
  }

  _songDragHoverIdx = nextIdx;
  _songDragHoverPos = nextPos;

  if (nextIdx !== -1) {
    const next = _songDragCardMap.get(nextIdx);
    next?.el.classList.add(nextPos === 'bottom' ? 'drag-over-bottom' : 'drag-over-top');
  }
}

function startFolderDrag(folderId) {
  S.isDragging   = true;
  S.dragType     = 'folder';
  S.dragFolderId = folderId;
  snapshotFolderRects();
  const folder   = S.folders.find(f => f.id === folderId);
  const ghost    = $('drag-ghost');
  ghost.textContent = tf('msg.moveFolder', folder?.name || '');
  ghost.style.display = 'block';
  ghost.style.left = (S.mx + 14) + 'px';
  ghost.style.top  = (S.my + 14) + 'px';
}

function startDrag() {
  S.isDragging = true;
  snapshotFolderRects();
  const ghost = $('drag-ghost');
  ghost.textContent = tf('msg.moveMsgs', S.selSet.size);
  ghost.style.display = 'block';
  ghost.style.left = (S.mx + 14) + 'px';
  ghost.style.top  = (S.my + 14) + 'px';
}

document.addEventListener('mousemove', e => {
  S.mx = e.clientX;
  S.my = e.clientY;

  // 火焰特效只在官網模式顯示，Story Mode 下不必每次 mousemove 都寫 CSS 變數
  if (document.body.classList.contains('site-mode')) {
    const bgLayer = document.getElementById('bg-layer');
    if (bgLayer) {
      bgLayer.style.setProperty('--mouse-x', e.clientX + 'px');
      bgLayer.style.setProperty('--mouse-y', e.clientY + 'px');
    }
  }

  if (!S.isDragging) return;

  const ghost = $('drag-ghost');
  ghost.style.left = (e.clientX + 14) + 'px';
  ghost.style.top  = (e.clientY + 14) + 'px';

  if (S.dragType === 'msg') {
    _dragFolderRects.forEach(({ el, rect: r }) => {
      const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      el.classList.toggle('drag-over', over);
    });

    const tr = $('trash-drop').getBoundingClientRect();
    const overTrash = e.clientX >= tr.left && e.clientX <= tr.right && e.clientY >= tr.top && e.clientY <= tr.bottom;
    $('trash-drop').classList.toggle('drag-over', overTrash);
    $('trash-label').textContent = overTrash ? tf('msg.deleteMsgsN', S.selSet.size) : t('left.trash');
  } else if (S.dragType === 'folder') {
    _dragFolderRects.forEach(({ el, fid, rect: r }) => {
      if (fid === '__unc__' || fid === S.dragFolderId) { el.classList.remove('drag-over'); return; }
      const target = S.folders.find(f => f.id === fid);
      if (target?.parentId) { el.classList.remove('drag-over'); return; }
      const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      el.classList.toggle('drag-over', over);
    });
  } else if (S.dragType === 'song') {
    if (!_songDragRaf) {
      const { clientX, clientY } = e;
      _songDragRaf = requestAnimationFrame(() => {
        _songDragRaf = 0;
        updateSongDragHover(clientX, clientY);
      });
    }
  }
});

document.addEventListener('mouseup', e => {
  clearTimeout(S.dragTimer);
  if (!S.isDragging) return;
  S.isDragging = false;
  $('drag-ghost').style.display = 'none';

  if (S.dragType === 'song') {
    if (_songDragRaf) {
      cancelAnimationFrame(_songDragRaf);
      _songDragRaf = 0;
    }
    let targetIdx = _songDragHoverIdx === -1
      ? -1
      : _songDragHoverPos === 'bottom'
        ? _songDragHoverIdx + 1
        : _songDragHoverIdx;
    clearSongDragIndicators();

    if (targetIdx !== -1) {
      if (S.dragSongIdx < targetIdx) targetIdx--;
      if (targetIdx !== S.dragSongIdx) {
        const [moved] = S.songs.splice(S.dragSongIdx, 1);
        S.songs.splice(targetIdx, 0, moved);
        save();
        renderSongsList();
      }
    }
    _songDragCards = [];
    _songDragCardMap = new Map();
    S.dragSongIdx = null;
    S.dragType = 'msg';
    return;
  }

  $('trash-drop').classList.remove('drag-over');
  $('trash-label').textContent = t('left.trash');
  document.querySelectorAll('.folder-item').forEach(el => el.classList.remove('drag-over'));

  if (S.dragType === 'folder') {
    let target = null;
    document.querySelectorAll('.folder-item[data-folder-id]').forEach(el => {
      const fid = el.dataset.folderId;
      if (fid === '__unc__' || fid === S.dragFolderId) return;
      const tf = S.folders.find(f => f.id === fid);
      if (tf?.parentId) return;
      const r = el.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
        target = fid;
      }
    });
    if (target) {
      const dragged = S.folders.find(f => f.id === S.dragFolderId);
      if (dragged) {
        let p = target;
        let hasCycle = false;
        while (p) {
          if (p === dragged.id) { hasCycle = true; break; }
          p = S.folders.find(f => f.id === p)?.parentId || null;
        }
        if (!hasCycle) {
          dragged.parentId = target;
          renderFolders();
          save();
        }
      }
    }
    S.dragFolderId = null;
    S.dragType = 'msg';
    return;
  }

  const tr = $('trash-drop').getBoundingClientRect();
  if (e.clientX >= tr.left && e.clientX <= tr.right && e.clientY >= tr.top && e.clientY <= tr.bottom) {
    confirmDelete();
    return;
  }

  let target = null;
  document.querySelectorAll('.folder-item[data-folder-id]').forEach(el => {
    const r = el.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
      target = el.dataset.folderId;
    }
  });

  if (target) {
    if (target === '__unc__') {
      // 計算「目前有分類」的訊息數 — 這些訊息將被移回未歸類，故未歸類計數要 +restoredCount
      // 注意：必須在 mutation 之前計算，否則 some() 會找不到分類
      const restoredCount = [...S.selSet].filter(id => {
        return S.folders.some(f => f.msgIds.includes(id));
      }).length;
      S.folders.forEach(f => { f.msgIds = f.msgIds.filter(id => !S.selSet.has(id)); });
      clearSel();
      renderFolders();
      renderMsgs();
      renderRight();
      adjustUnclassifiedCount(restoredCount);
      save();
    } else {
      dropIntoFolder(target);
    }
  }
});

function dropIntoFolder(folderId) {
  const folder = S.folders.find(f => f.id === folderId);
  if (!folder) return;
  const cls = classifiedIds();
  const wasUnclassified = [...S.selSet].filter(id => !cls.has(id)).length;
  S.folders.forEach(f => { f.msgIds = f.msgIds.filter(id => !S.selSet.has(id)); });
  const have = new Set(folder.msgIds);
  S.selSet.forEach(id => { if (!have.has(id)) folder.msgIds.push(id); });
  const orderMap = new Map(S.allMessages.map((m, i) => [m.id, i]));
  folder.msgIds.sort((a, b) => (orderMap.get(a) ?? 0) - (orderMap.get(b) ?? 0));
  clearSel();
  renderFolders();
  renderMsgs();
  renderRight();
  adjustUnclassifiedCount(-wasUnclassified);
  save();
}

/* ══════════════════════════════════════════════════════════
   Modal System
══════════════════════════════════════════════════════════ */
let modalConfirmCallback = null;
let modalCancelCallback = null;

function showModal(opts) {
  $('modal-title').textContent = opts.title;
  const descEl = $('modal-desc');
  descEl.textContent = opts.desc || '';
  descEl.style.display = opts.desc ? '' : 'none';
  // 沒有 desc 時，標題底部要補回相當於上方 padding 的間距，避免標題偏上、上下留白不對稱
  $('modal-box').classList.toggle('no-desc', !opts.desc);
  $('modal-overlay').style.display = 'flex';
  
  const input = $('modal-input-field');
  const textarea = $('modal-textarea-field');
  const customBody = $('modal-custom-body');
  input.style.display = 'none';
  textarea.style.display = 'none';
  customBody.style.display = 'none';
  customBody.innerHTML = '';

  let activeField = null;
  if (opts.showInput) {
    input.style.display = 'block';
    input.value = opts.inputValue || '';
    activeField = input;
  } else if (opts.showTextarea) {
    textarea.style.display = 'block';
    textarea.value = opts.inputValue || '';
    activeField = textarea;
  } else if (opts.customHtml) {
    customBody.style.display = 'block';
    customBody.innerHTML = opts.customHtml;
    if (typeof opts.onOpen === 'function') opts.onOpen(customBody);
  }
  
  if (activeField) setTimeout(() => activeField.focus(), 50);
  
  const confirmBtn = $('modal-confirm');
  confirmBtn.className = 'modal-btn ' + (opts.confirmClass || 'btn-primary');
  confirmBtn.textContent = opts.confirmText || t('modal.confirm');
  $('modal-cancel').textContent = opts.cancelText || t('modal.cancel');

  modalConfirmCallback = () => {
    const val = typeof opts.valueResolver === 'function'
      ? opts.valueResolver(customBody)
      : (activeField ? activeField.value : null);
    if (opts.onConfirm) opts.onConfirm(val);
  };
  modalCancelCallback = () => {
    if (opts.onCancel) opts.onCancel();
  };
}

$('modal-cancel').addEventListener('click', () => {
  $('modal-overlay').style.display = 'none';
  if (modalCancelCallback) modalCancelCallback();
  modalConfirmCallback = null;
  modalCancelCallback = null;
});
$('modal-confirm').addEventListener('click', () => {
  $('modal-overlay').style.display = 'none';
  if (modalConfirmCallback) modalConfirmCallback();
  modalConfirmCallback = null;
  modalCancelCallback = null;
});

// Modal 鍵盤操作：Esc 取消、Enter 確認
// - textarea 中 Enter 是換行，不攔截
// - 焦點在按鈕上時交給瀏覽器原生行為（Enter 觸發該按鈕），避免蓋掉「取消」
document.addEventListener('keydown', e => {
  if ($('modal-overlay').style.display !== 'flex') return;
  if (e.key === 'Escape') { e.preventDefault(); $('modal-cancel').click(); return; }
  if (e.key !== 'Enter') return;
  if (e.target === $('modal-textarea-field') || e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  $('modal-confirm').click();
});

/* ══════════════════════════════════════════════════════════
   Edit / Delete Messages
══════════════════════════════════════════════════════════ */
function editMessage(msgId) {
  const msg = S.allMessages.find(m => m.id === msgId);
  if (!msg || msg.type !== 'msg') return;
  showModal({
    title: t('msg.edited'),
    desc: tf('msg.editingFor', msg.name),
    showTextarea: true,
    inputValue: msg.lines.join('\n'),
    confirmText: t('modal.save'),
    onConfirm: (val) => {
      if (val !== null) {
        const newLines = val.split(/\r?\n/);
        while (newLines.length && newLines[newLines.length - 1].trim() === '') newLines.pop();
        msg.lines = newLines;
        idbUpdateMessage(msg).catch(err => console.warn('idbUpdateMessage:', err));
        // 就地更新 bubble，避免重載整個訊息列表
        const eid = CSS.escape(msg.id);
        const row = document.querySelector(`.msg-row[data-id="${eid}"], .msg-system-divider[data-id="${eid}"]`);
        if (row) {
          const bubble = row.querySelector('.msg-bubble') || row.querySelector('.msg-system-text');
          if (bubble) bubble.innerHTML = renderLines(msg.lines);
        }
        save();
      }
    }
  });
}

function confirmDelete() {
  const count = S.selSet.size;
  showModal({
    title: t('msg.confirmDelete'),
    desc: tf('msg.deleteN', count),
    confirmClass: 'btn-danger',
    confirmText: t('modal.delete'),
    onConfirm: () => {
      const ids = [...S.selSet];
      const cls = classifiedIds();
      const wasUnclassified = ids.filter(id => !cls.has(id)).length;
      idbDeleteMessages(ids).catch(err => console.warn('idbDeleteMessages:', err));
      const idSet = new Set(ids);
      S.allMessages = S.allMessages.filter(m => !idSet.has(m.id));
      S.folders.forEach(f => { f.msgIds = f.msgIds.filter(id => !S.selSet.has(id)); });
      // 直接從 DOM 移除，避免重繪導致捲動位置跳回頂部
      const list = $('message-list');
      ids.forEach(id => {
        list.querySelector(`[data-id="${CSS.escape(id)}"]`)?.remove();
      });
      clearSel();
      renderFolders();
      renderRight();
      adjustUnclassifiedCount(-wasUnclassified);
      save();
    }
  });
}

function getFolderIcon(folder, isChild) {
  if (isChild) {
    const key = folder.icon || 'file';
    return FOLDER_ICONS[key] || FOLDER_ICONS.file;
  }
  return FOLDER_ICON_PARENT;
}

function makeFolderEl(folder, isChild) {
  const el = document.createElement('div');
  // 摺疊按鈕（只有父資料夾且有子資料夾才顯示）
  const hasChildren = !isChild && S.folders.some(f => f.parentId === folder.id);
  const isExpanded = hasChildren && !S.collapsedFolders.has(folder.id);

  el.className = 'folder-item' + (S.view === folder.id ? ' active' : '') + (isChild ? ' subfolder' : '') + (isExpanded ? ' expanded-parent' : '');
  el.dataset.folderId = folder.id;

  if (hasChildren) {
    const isCollapsed = S.collapsedFolders.has(folder.id);
    const collapseBtn = document.createElement('button');
    collapseBtn.className = 'folder-collapse-btn' + (isCollapsed ? ' collapsed' : '');
    collapseBtn.title = isCollapsed ? t('folder.expand') : t('folder.collapse');
    collapseBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>`;
    collapseBtn.addEventListener('mousedown', e => e.stopPropagation());
    collapseBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (S.collapsedFolders.has(folder.id)) {
        S.collapsedFolders.delete(folder.id);
      } else {
        S.collapsedFolders.add(folder.id);
      }
      save();
      renderFolders();
    });
    el.appendChild(collapseBtn);
  }

  const iconSpan = document.createElement('span');
  iconSpan.className = 'folder-icon';
  iconSpan.innerHTML = getFolderIcon(folder, isChild);
  el.appendChild(iconSpan);

  const labelSpan = document.createElement('span');
  labelSpan.className = 'folder-label';
  labelSpan.textContent = folder.name;
  el.appendChild(labelSpan);

  const countSpan = document.createElement('span');
  countSpan.className = 'folder-count';
  if (!isChild) {
    const childTotal = _childTotalMap.get(folder.id) || 0;
    countSpan.textContent = folder.msgIds.length + childTotal;
  } else {
    countSpan.textContent = folder.msgIds.length;
  }
  el.appendChild(countSpan);

  const btns = document.createElement('div');
  btns.className = 'folder-btns';
  const moreBtn = document.createElement('button');
  moreBtn.className = 'icon-btn';
  moreBtn.title = t('folder.more');
  moreBtn.textContent = '⋯';
  moreBtn.addEventListener('click', e => showFolderMenu(e, folder.id));
  btns.appendChild(moreBtn);
  el.appendChild(btns);

  el.addEventListener('click', () => switchView(folder.id, folder.name));
  addKeyActivation(el);
  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('button')) return;
    S.mx = e.clientX;
    S.my = e.clientY;
    S.dragTimer = setTimeout(() => startFolderDrag(folder.id), 400);
  });
  return el;
}

// 預先計算每個父資料夾的子資料夾訊息總和，避免在 makeFolderEl 中 O(n²)
let _childTotalMap = new Map();
function buildChildTotalMap() {
  _childTotalMap = new Map();
  for (const f of S.folders) {
    if (f.parentId) {
      _childTotalMap.set(f.parentId, (_childTotalMap.get(f.parentId) || 0) + f.msgIds.length);
    }
  }
}

function renderFolders() {
  buildChildTotalMap();
  const list = $('folder-list');
  list.innerHTML = '';

// 依當前 view 更新中欄標題；父資料夾若有子章節，附註「含子章節」表示目前是合併視圖
function updateMidHeaderTitle(title) {
  const folder = S.view === null ? null : S.folders.find(f => f.id === S.view);
  const name = title !== undefined
    ? title
    : (S.view === null ? t('folder.uncategorized') : (folder?.name || ''));
  const hasChildren = folder && !folder.parentId && S.folders.some(f => f.parentId === folder.id);
  $('mid-header-title').textContent = hasChildren ? `${name} · ${t('folder.withChildren')}` : name;
}

async function switchView(id, title) {
  // 切換前先記住當前 view 的捲動位置
  captureCurrentScrollAnchor();
  S.view = id;
  saveViewState();
  clearSel();
  const folder = S.folders.find(f => f.id === id);
  updateMidHeaderTitle(title);

  if (folder) {
    let targetDateStr = null;
    // 優先跳到此檢視（含子資料夾）最早的事件日期，與右側事件清單一致；
    // 子資料夾的事件不會被父資料夾自身的訊息日期蓋掉
    const eventDates = getEventFoldersForCurrentView()
      .flatMap(f => f.notes || [])
      .map(n => n.date)
      .filter(Boolean)
      .sort();
    if (eventDates.length > 0) targetDateStr = eventDates[0];
    else {
      await loadViewMessages();
      const msgs = visibleMsgs();
      if (msgs.length > 0) targetDateStr = extractDateFromMsg(msgs[0]);
    }
    const d = targetDateStr ? new Date(targetDateStr) : null;
    if (d && !isNaN(d.getTime())) {
      S.calDate = new Date(d.getFullYear(), d.getMonth(), 1);
    } else {
      // 無事件也無訊息日期可依據時，回到本月，避免停留在上一個資料夾的月份
      const now = new Date();
      S.calDate = new Date(now.getFullYear(), now.getMonth(), 1);
    }
  }

  renderFolders();
  renderMsgs().then(restoreScrollAnchor);
  renderRight();
}

function showFolderMenu(e, folderId) {
  e.stopPropagation();
  activeFolderIdForMenu = folderId;
  const menu = $('folder-menu');

  const isUnc = (folderId === '__unc__');
  const folder = S.folders.find(f => f.id === folderId);
  const isChild = !!(folder?.parentId);

  // 先決定項目可見性（影響選單高度），再顯示量尺寸並夾進視窗，
  // 避免對底部資料夾操作時選單被截掉
