<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Take Fire Official Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg-layer"></div>

<!-- ── App Topbar ─────────────────────────────────────── -->
<div id="app-topbar">
  <button id="mobile-left-btn" title="故事選單" aria-label="故事選單">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
  </button>
  <div class="topbar-mode-btns">
    <button class="topbar-mode-btn active" id="btn-story-mode">Story Mode</button>
    <button class="topbar-mode-btn" id="btn-site-mode">Official Site</button>
  </div>
  <div class="brand">TAKE FIRE</div>
  <div id="topbar-right">
    <button id="mobile-right-btn" title="事件與歌單" aria-label="事件與歌單">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
    </button>
    <input type="file" id="import-backup-input" accept=".json" hidden>
    <button id="import-all-btn" title="匯入備份" aria-label="匯入備份" data-i18n-title="topbar.importTip" data-i18n-aria="topbar.importTip">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span data-i18n="topbar.import">匯入</span>
    </button>
    <button id="export-all-btn" title="匯出全部備份" aria-label="匯出全部備份" data-i18n-title="topbar.exportTip" data-i18n-aria="topbar.exportTip">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
      <span data-i18n="topbar.export">匯出</span>
    </button>
    <button id="sys-settings-btn" title="系統設定" aria-label="系統設定" data-i18n-title="topbar.settingsTip" data-i18n-aria="topbar.settingsTip">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35C8.66 5.59 8.12 5.92 7.63 6.29L5.24 5.33a.488.488 0 0 0-.59.22L2.73 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </div>
</div>

<!-- ── Official Site ───────────────────────────────────── -->
<div id="official-site">
  <input type="file" id="poster-upload-input" accept="image/*" multiple hidden>
  <input type="file" id="music-cover-input" accept="image/*" hidden>
  <input type="file" id="music-mp3-input" accept="audio/mpeg,audio/mp3" hidden>

  <!-- Sub-nav -->
  <nav id="site-nav">
    <div class="site-nav-item active" data-page="poster">Photo</div>
    <div class="site-nav-item" data-page="music">Music</div>
    <div class="site-nav-item" data-page="tour">Tour</div>
    <div class="site-nav-item" data-page="about">Profile</div>
  </nav>

  <div id="site-content">
    <!-- POSTER -->
    <div id="page-poster" class="site-page active">
      <div class="about-page-title">Photo</div>
      <div id="poster-grid" class="poster-grid"></div>
    </div>

    <!-- MUSIC -->
    <div id="page-music" class="site-page">
      <div class="music-page-header">
        <div class="music-page-title">MUSIC</div>
        <button class="btn-minimal-add" id="music-add-btn" title="上架單曲" data-i18n-title="site.addSingle" aria-label="上架單曲" data-i18n-aria="site.addSingle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
      </div>
      <div id="music-grid" class="music-grid"></div>
    </div>

    <!-- TOUR -->
    <div id="page-tour" class="site-page">
      <div class="tour-page-header">
        <div class="tour-page-title">Tour</div>
        <button class="btn-minimal-add" id="tour-add-btn" title="新增工作行程" data-i18n-title="site.addTour" aria-label="新增工作行程" data-i18n-aria="site.addTour">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
      </div>
      <div class="tour-table-head">
        <span data-i18n="tour.date">日期</span><span data-i18n="tour.work">工作內容</span><span data-i18n="tour.place">地點</span><span data-i18n="tour.time">時間</span><span data-i18n="tour.status">狀態</span><span></span>
      </div>
      <div id="tour-list"></div>
    </div>

    <!-- ABOUT -->
    <div id="page-about" class="site-page">
      <div class="about-page-title">Profile</div>
      <div class="members-grid" id="members-grid"></div>
    </div>
  </div>

  <!-- CG 設定筆記（置於 site-content 外，避免被頂部 nav 的 stacking context 蓋住） -->
  <button class="cg-nb-fab" id="cg-nb-fab" type="button" title="CG 設定筆記" data-i18n-title="nb.title" aria-label="CG 設定筆記" data-i18n-aria="nb.title" style="display:none;">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
  </button>
  <div class="cg-nb-overlay" id="cg-nb-overlay"></div>
  <aside class="cg-nb-drawer" id="cg-nb-drawer" aria-hidden="true">
    <div class="cg-nb-head">
      <span class="cg-nb-title" data-i18n="nb.title">CG 設定筆記</span>
      <button class="cg-nb-close" id="cg-nb-close" type="button" aria-label="關閉">&times;</button>
    </div>
    <div class="cg-nb-tabs" id="cg-nb-tabs"></div>
    <textarea class="cg-nb-text" id="cg-nb-text" placeholder="輸入此角色的 CG 圖片設定…" data-i18n-placeholder="nb.placeholder"></textarea>
    <div class="cg-nb-foot">
      <button class="cg-nb-copy" id="cg-nb-copy" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        <span class="cg-nb-copy-lbl" data-i18n="nb.copy">複製</span>
      </button>
      <span style="display:flex; align-items:center; gap:10px;">
        <span id="cg-nb-saved" style="opacity:0; transition:opacity .3s;">✓ <span data-i18n="nb.saved">已自動儲存</span></span>
        <span id="cg-nb-count"></span>
      </span>
    </div>
  </aside>
</div>


<!-- IG Detail Modal -->
<div id="ig-modal-overlay">
  <button id="ig-modal-nav-prev" aria-label="上一張" data-i18n-aria="a11y.prevImage"><svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M8 1.5L2 8.5l6 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="ig-modal-box" id="ig-modal-box">
    <div class="ig-modal-img-wrap">
      <img id="ig-modal-img" src="" alt="">
    </div>
    <div class="ig-modal-right">
      <div class="ig-modal-header">
        <button class="ig-modal-close" id="ig-modal-close" aria-label="關閉" data-i18n-aria="a11y.close">✕</button>
      </div>
      <div class="ig-modal-caption-wrap">
        <textarea class="ig-modal-caption-textarea" id="ig-modal-caption" placeholder="新增說明文字…" data-i18n-placeholder="igm.captionPh"></textarea>
      </div>
      <div class="ig-modal-footer">
        <div class="chapter-wrap">
          <div id="ig-chapter-tag" class="chapter-tag" style="display:none">
            <button id="ig-modal-chapter" type="button" class="chapter-link"></button>
            <button id="ig-chapter-remove" type="button" class="chapter-remove" aria-label="移除章節連結" data-i18n-aria="a11y.removeChapter">✕</button>
          </div>
          <select id="ig-modal-folder" class="chapter-hidden-select">
            <option value="" data-i18n="igm.chapterPh">— 選擇章節 —</option>
          </select>
        </div>
        <div class="ig-modal-actions">
          <button class="ig-modal-del-btn" id="ig-modal-del" data-i18n="modal.delete">刪除</button>
          <button class="ig-modal-cancel-btn" id="ig-modal-cancel" data-i18n="modal.cancel">取消</button>
          <button class="ig-modal-save-btn" id="ig-modal-save" data-i18n="modal.save">儲存</button>
        </div>
      </div>
    </div>
  </div>
  <button id="ig-modal-nav-next" aria-label="下一張" data-i18n-aria="a11y.nextImage"><svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M2 1.5l6 7-6 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<!-- Tour Modal -->
<div id="tour-modal-overlay">
  <div class="tour-modal-box">
    <div class="tour-modal-title" id="tour-modal-title" data-i18n="tm.titleAdd">新增工作行程</div>
    <div class="tour-modal-grid">
      <div class="tour-modal-field">
        <div class="tour-modal-label" data-i18n="tour.date">日期</div>
        <input type="date" id="tm-date" class="tour-modal-input">
      </div>
      <div class="tour-modal-field">
        <div class="tour-modal-label" data-i18n="tour.time">時間</div>
        <input type="text" id="tm-time" class="tour-modal-input" placeholder="例：19:00 或全天" data-i18n-placeholder="tm.timePh">
      </div>
      <div class="tour-modal-field full">
        <div class="tour-modal-label" data-i18n="tour.work">工作內容</div>
        <input type="text" id="tm-title" class="tour-modal-input" placeholder="MV 拍攝、錄音、演出…" data-i18n-placeholder="tm.titlePh">
      </div>
      <div class="tour-modal-field full">
        <div class="tour-modal-label" data-i18n="tour.place">地點</div>
        <input type="text" id="tm-location" class="tour-modal-input" placeholder="錄音室、場地名稱…" data-i18n-placeholder="tm.locPh">
      </div>
      <div class="tour-modal-field full">
        <div class="tour-modal-label" data-i18n="tm.note">備註</div>
        <textarea id="tm-body" class="tour-modal-textarea" placeholder="其他細節…" data-i18n-placeholder="tm.notePh"></textarea>
      </div>
      <div class="tour-modal-field full">
        <div class="tour-modal-label" data-i18n="tm.linkChapter">連結故事章節（選填）</div>
        <select id="tm-folder" class="tour-modal-select">
          <option value="" data-i18n="tm.notDone">— 尚未完成 —</option>
        </select>
      </div>
    </div>
    <div class="tour-modal-actions">
      <button class="tour-modal-del" id="tm-del" style="display:none" data-i18n="modal.delete">刪除</button>
      <button class="tour-modal-cancel" id="tm-cancel" data-i18n="modal.cancel">取消</button>
      <button class="tour-modal-save" id="tm-save" data-i18n="modal.save">儲存</button>
    </div>
  </div>
</div>

<!-- ── Poster Modal ── -->
<div id="poster-modal-overlay">
  <div class="poster-modal-box">
    <div class="poster-modal-layout">
      <div class="poster-modal-upload-area" id="pm-upload-area">
        <img id="pm-preview" style="display:none; width:100%; height:100%; object-fit:cover;">
        <div class="poster-modal-upload-placeholder" id="pm-placeholder">
          <span>＋</span>
          <div data-i18n="pm.uploadHint">點擊上傳圖片</div>
        </div>
      </div>
      <div class="poster-modal-right">
        <textarea id="pm-caption" class="tour-modal-textarea" placeholder="說明文字…" data-i18n-placeholder="pm.captionPh" style="flex:1; resize:none;"></textarea>
        <div class="chapter-wrap">
          <div id="pm-chapter-tag" class="chapter-tag" style="display:none">
            <button id="pm-folder-link" type="button" class="chapter-link"></button>
            <button id="pm-chapter-remove" type="button" class="chapter-remove" aria-label="移除章節連結" data-i18n-aria="a11y.removeChapter">✕</button>
          </div>
          <select id="pm-folder" class="chapter-hidden-select">
            <option value="" data-i18n="igm.chapterPh">— 選擇章節 —</option>
          </select>
        </div>
        <div class="tour-modal-actions" style="margin-top:auto; padding:0;">
          <button class="tour-modal-del" id="pm-del" style="display:none" data-i18n="modal.delete">刪除</button>
          <button class="tour-modal-cancel" id="pm-cancel" data-i18n="modal.cancel">取消</button>
          <button class="tour-modal-save" id="pm-save" data-i18n="modal.save">儲存</button>
        </div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="pm-file-input" accept="image/*" hidden>

<!-- ── Left Column ─────────────────────────────────────── -->
<div id="col-left">
  <input type="file" id="file-input" accept=".txt" multiple hidden>
  <input type="file" id="avatar-char-input" accept="image/*" hidden>
  <input type="file" id="avatar-player-input" accept="image/*" hidden>
  <input type="file" id="bg-input" accept="image/*" multiple hidden>
  
  <button class="btn-modern upload-btn" id="upload-btn">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="opacity: 0.8;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    <span data-i18n="left.upload">匯入 .txt 檔案</span>
  </button>

  <!-- Avatar & Background row -->
  <div class="avatar-row">
    <div class="avatar-slot" id="avatar-char-slot" title="點擊更換樂團頭像" data-i18n-title="left.avatarCharTip">
      <div class="avatar-slot-img" id="avatar-char-img">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="avatar-slot-label" id="avatar-char-name" data-i18n="left.avatarChar">樂團</div>
    </div>
    <div class="avatar-slot" id="avatar-player-slot" title="點擊更換玩家頭像" data-i18n-title="left.avatarPlayerTip">
      <div class="avatar-slot-img" id="avatar-player-img">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="avatar-slot-label" id="avatar-player-name" data-i18n="left.avatarPlayer">玩家</div>
    </div>
    <div class="avatar-slot" id="bg-slot" title="點擊管理對話背景" data-i18n-title="left.bgTip">
      <div class="avatar-slot-img" id="bg-slot-img">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </div>
      <div class="avatar-slot-label" id="bg-slot-label" data-i18n="left.bg">背景</div>
    </div>
  </div>

  <hr class="settings-divider">

  <div class="sec-header-row">
    <div class="sec-label">Stories</div>
    <div style="display: flex; gap: 4px;">
      <button class="icon-btn" id="add-folder-btn" title="新增資料夾" data-i18n-title="left.addFolder" aria-label="新增資料夾" data-i18n-aria="left.addFolder">＋</button>
      <button class="icon-btn" id="sort-folder-btn" title="切換排序" data-i18n-title="left.sortToggle" aria-label="切換排序" data-i18n-aria="left.sortToggle">▲</button>
    </div>
  </div>
  
  <div id="folder-list"></div>

  <!-- Trash and Settings zone -->
  <div id="left-bottom-zone" style="padding-top: 12px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
    <button class="btn-modern dashed trash-btn" id="trash-drop">
      <span class="trash-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 6h18v2H3V6zm2 3h14v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9zm4 2v7h2v-7H9zm4 0v7h2v-7h-2zM8 4h8v2H8V4z"/></svg>
      </span>
      <span id="trash-label" data-i18n="left.trash">拖曳至此刪除</span>
    </button>
    <div id="tool-links">
      <!-- LoveyDovey -->
      <a class="tool-link" href="https://www.loveydovey.ai" target="_blank" rel="noopener noreferrer" title="LoveyDovey" aria-label="LoveyDovey">
        <svg width="17" height="17" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M14.9969 2.13112C8.74684 1.94801 4.15254 4.22623 2.58498 9.12803C1.79863 11.587 2.16657 14.2071 3.05613 16.5604C3.94602 18.9145 5.32012 20.8972 6.38374 22.0123C6.63779 22.2786 6.73474 22.655 6.6403 23.0085L6.04827 25.2241C7.63116 24.6231 8.92089 24.0836 9.76759 23.5931C10.2802 23.2961 10.9402 23.4647 11.2417 23.9696C11.5432 24.4745 11.372 25.1245 10.8594 25.4215C9.48695 26.2166 7.2634 27.0556 4.84974 27.9342C4.473 28.0713 4.05009 27.9906 3.7527 27.7247C3.45531 27.4588 3.33288 27.052 3.4351 26.6694L4.4102 23.0203C3.24274 21.6761 1.92535 19.6483 1.03787 17.3005C0.0458648 14.6762 -0.446782 11.5478 0.53086 8.49074C2.50181 2.32757 8.28788 -0.187596 15.0609 0.0108377C22.9835 0.242952 29.3448 7.22147 27.7547 14.3435C26.3597 20.5916 19.941 22.9251 14.9777 22.6924C9.65252 22.4427 5.43862 17.7502 4.94452 12.8842C4.56838 9.17981 6.45516 6.09234 9.88354 5.54113C11.1263 5.34133 12.1302 5.734 12.8801 6.23199C13.2051 6.44783 13.5048 6.70197 13.7597 6.93806C14.0731 6.71407 14.4388 6.47815 14.8388 6.26494C15.6383 5.83876 16.7053 5.43285 17.8194 5.53155C20.8659 5.80144 23.0324 8.28988 23.0324 11.4417C23.0324 14.1215 21.3905 16.7415 18.0439 17.7708C17.4762 17.9454 16.8723 17.6336 16.6951 17.0745C16.5178 16.5154 16.8343 15.9206 17.402 15.746C19.8373 14.997 20.8788 13.206 20.8788 11.4417C20.8788 9.28709 19.4639 7.80701 17.6265 7.64424C17.1307 7.60031 16.5138 7.78402 15.8637 8.13052C15.2341 8.46613 14.6945 8.8893 14.3973 9.1495C13.9761 9.5182 13.3376 9.50475 12.9328 9.11866C12.8215 9.0125 12.7169 8.90812 12.6147 8.80612C12.3171 8.50908 12.0397 8.23224 11.6761 7.99078C11.2391 7.70058 10.7837 7.5457 10.2305 7.63465C8.21738 7.95831 6.79241 9.76754 7.08744 12.6731C7.49135 16.6509 10.9745 20.381 15.0801 20.5735C19.5477 20.783 24.5828 18.6737 25.6513 13.8879C26.8972 8.30807 21.8362 2.3315 14.9969 2.13112Z" fill="#FF2E7F"/></svg>
      </a>
      <!-- NotebookLM -->

<!-- ── Middle Column ───────────────────────────────────── -->
<div class="col-resizer" id="resizer-left"></div>
<div id="col-mid">
  <button id="toggle-mid-col" class="col-toggle-btn" title="Fullscreen 中間欄" aria-label="Fullscreen 中間欄" data-i18n-title="mid.fullscreenTip" data-i18n-aria="mid.fullscreenTip"></button>
  <!-- 中間背景圖層 -->
  <div id="mid-bg"></div>
  <div id="mid-overlay"></div>
  
  <div id="mid-header">
    <span id="mid-header-title" data-i18n="mid.defaultTitle">未歸類故事</span>
    <button id="msg-search-btn" class="icon-btn" title="搜尋訊息" data-i18n-title="search.open" aria-label="搜尋訊息" data-i18n-aria="search.open">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </div>
  
  <!-- 訊息列表模式 -->
  <div id="message-list"></div>

  <!-- 快速捲動按鈕 -->
  <div class="scroll-action-btns">
    <button id="btn-scroll-top" class="scroll-btn" title="回到頂部" data-i18n-title="mid.scrollTop" aria-label="回到頂部" data-i18n-aria="mid.scrollTop">▲</button>
    <button id="btn-scroll-bottom" class="scroll-btn" title="回到底部" data-i18n-title="mid.scrollBottom" aria-label="回到底部" data-i18n-aria="mid.scrollBottom">▼</button>
  </div>

  <!-- 觸控裝置選取訊息後的操作列（無法拖曳時用來歸類／刪除） -->
  <div id="sel-action-bar" role="toolbar">
    <span id="sel-action-count"></span>
    <button type="button" class="sel-action-btn" id="sel-action-move" data-i18n="sel.move">移到資料夾</button>
    <button type="button" class="sel-action-btn danger" id="sel-action-del" data-i18n="sel.delete">刪除</button>
    <button type="button" class="sel-action-close" id="sel-action-clear" aria-label="取消選取" data-i18n-aria="sel.clear">✕</button>
  </div>
</div>

<!-- ── Right Column ────────────────────────────────────── -->
<div class="col-resizer" id="resizer-right"></div>
<div id="col-right" data-tab="events">
  <button id="toggle-right-col" class="col-toggle-btn" title="Fullscreen 右欄" aria-label="Fullscreen 右欄" data-i18n-title="right.fullscreenTip" data-i18n-aria="right.fullscreenTip"></button>
  <div id="right-header-tabs" class="right-tabs">
    <button id="tab-events" class="right-tab active" data-i18n="right.tabEvents">事件</button>
    <button id="tab-songs" class="right-tab" data-i18n="right.tabSongs">樂團歌單</button>
  </div>
  
  <!-- 右欄行事曆區塊 -->
  <div id="right-calendar-wrap" style="display:none;">
    <div class="cal-header" id="cal-header-toggle" style="cursor: pointer; user-select: none;" title="點擊展開/收起行事曆" data-i18n-title="cal.toggleTip">
      <button id="cal-prev" class="icon-btn">◀</button>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span id="cal-title"></span>
        <span id="cal-toggle-icon" style="font-size: 10px; transition: transform 0.3s; opacity: 0.6;">▼</span>
      </div>
      <button id="cal-next" class="icon-btn">▶</button>
    </div>
    <div id="cal-body-container">
      <div id="cal-body-wrap">
        <div class="cal-weekdays">
          <span data-i18n="cal.sun">日</span><span data-i18n="cal.mon">一</span><span data-i18n="cal.tue">二</span><span data-i18n="cal.wed">三</span><span data-i18n="cal.thu">四</span><span data-i18n="cal.fri">五</span><span data-i18n="cal.sat">六</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
      </div>
    </div>
  </div>
  
  <div id="right-header" style="padding: 12px 16px; font-size: 14px; font-weight: 600; color: var(--c-text); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;"></div>

  <!-- 右欄筆記與歌曲區塊 -->
  <div id="note-list"></div>
  <div id="song-list"></div>
</div>

<!-- ── Drag Ghost ──────────────────────────────────────── -->
<div id="drag-ghost"></div>

<!-- ── Mobile Drawer Overlay ───────────────────────────── -->
<div id="mobile-drawer-overlay"></div>

<!-- ── Modal ───────────────────────────────────────────── -->
<div id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-title" id="modal-title" data-i18n="modal.confirm">確認</div>
    <div class="modal-desc" id="modal-desc"></div>
    <div id="modal-custom-body" class="modal-custom-body"></div>
    <input type="text" id="modal-input-field" class="modal-input-field" />
    <textarea id="modal-textarea-field" class="modal-textarea-field"></textarea>
    <div class="modal-actions">
      <button class="modal-btn btn-cancel" id="modal-cancel" data-i18n="modal.cancel">取消</button>
      <button class="modal-btn" id="modal-confirm" data-i18n="modal.confirm">確認</button>
    </div>
  </div>
</div>

<!-- ── Settings Modal ──────────────────────────────────────── -->
<div id="settings-overlay" style="position: fixed; inset: 0; background: rgb(0 0 0 / 0.20); z-index: 10005; display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px);">
  <div class="modal-box" style="width: 360px; padding: 32px 24px;">
    <div class="modal-title" style="margin-bottom: 24px;" data-i18n="settings.title">系統設定</div>

    <div style="display: flex; flex-direction: column; gap: 20px; text-align: left; margin-bottom: 32px;">
      <div>
        <label style="color: var(--c-text-mute); display: block; margin-bottom: 8px; font-size: 13px;" data-i18n="settings.language">介面語言</label>
        <select id="set-lang" class="modal-input-field" style="display: block; margin-bottom: 0; width: 100%;">
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
      </div>
      <div>
        <label style="color: var(--c-text-mute); display: block; margin-bottom: 8px; font-size: 13px;" data-i18n="settings.theme">主題曲風</label>
        <select id="set-theme" class="modal-input-field" style="display: block; margin-bottom: 0; width: 100%;">
          <option value="jazz" selected data-i18n="theme.jazz">Jazz (深色)</option>
          <option value="LoveSong" data-i18n="theme.love">Love song (粉色)</option>
          <option value="WhiteNoise" data-i18n="theme.white">White Noise (淺色)</option>
          <option value="cyberpunk" data-i18n="theme.punk">Punk (霓虹)</option>
        </select>
      </div>
      <div>
        <label style="color: var(--c-text-mute); display: block; margin-bottom: 8px; font-size: 13px;" data-i18n="settings.font">介面字型</label>
        <select id="set-font" class="modal-input-field" style="display: block; margin-bottom: 0; width: 100%;">
          <option value="system" data-i18n="settings.font.system">系統無襯線 (預設)</option>
          <option value="serif" data-i18n="settings.font.serif">明體 / 襯線</option>
          <option value="rounded" data-i18n="settings.font.rounded">圓體</option>
        </select>
      </div>
      <div>
        <label style="color: var(--c-text-mute); display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500;" data-i18n="settings.fontSize">字體大小</label>
        <div style="display:flex; align-items:center; gap:10px;">
          <button id="set-font-dec" class="btn-modern" style="width:64px; justify-content:center; padding:8px 0; border:1px solid var(--c-primary-border); background:transparent; color:var(--c-text-mute);">A-</button>
          <div id="set-font-scale-label" style="flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--c-text);">100%</div>
          <button id="set-font-inc" class="btn-modern" style="width:64px; justify-content:center; padding:8px 0;">A+</button>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn btn-primary" id="settings-close-btn" style="width: 100%;" data-i18n="settings.done">完成</button>
    </div>
  </div>
</div>

<!-- ── Context Menu ──────────────────────────────────────── -->
<div id="folder-menu">
  <div class="folder-menu-item" id="menu-item-ren" data-i18n="menu.rename"> 重新命名</div>
  <div class="folder-menu-item" id="menu-item-icon" style="display:none" data-i18n="menu.icon"> 更改圖示</div>
  <div class="folder-menu-item" id="menu-item-exp" data-i18n="menu.exportTxt">匯出 TXT</div>
  <div class="folder-menu-item" id="menu-item-nest" data-i18n="menu.nest">移到…</div>
  <div class="folder-menu-divider" id="menu-item-div"></div>
  <div class="folder-menu-item danger" id="menu-item-del" data-i18n="menu.deleteFolder"> 刪除資料夾</div>
</div>

<!-- Icon Picker Modal -->
<div id="icon-picker-overlay" style="position:fixed;inset:0;background:rgb(0 0 0/0.20);z-index:10010;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);">
  <div style="background:var(--c-bg);border:1px solid rgb(var(--c-primary-rgb)/0.12);border-radius:var(--radius-xl);padding:28px 24px;width:300px;max-width:92vw;box-shadow:var(--shadow-lg);">
    <div style="font-size:15px;font-weight:600;color:var(--c-text);margin-bottom:20px;" data-i18n="iconPicker.title">更改子資料夾圖示</div>
    <div id="icon-picker-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button id="icon-picker-cancel" style="padding:8px 18px;border:1px solid rgb(var(--c-text-rgb)/0.12);border-radius:8px;background:transparent;color:var(--c-text-mute);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;" data-i18n="modal.cancel">取消</button>
      <button id="icon-picker-save" style="padding:8px 20px;border:none;border-radius:8px;background:var(--c-button);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;" data-i18n="modal.save">儲存</button>
    </div>
  </div>
</div>

<!-- ── 備份提醒橫幅 ─────────────────────────────────────── -->
<div id="backup-reminder" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z"/></svg>
  <span id="backup-reminder-text"></span>
  <button id="backup-reminder-export" type="button" data-i18n="backup.exportNow">立即匯出</button>
  <button id="backup-reminder-later" type="button" data-i18n="backup.later">稍後</button>
</div>

<!-- ── 全文搜尋 ─────────────────────────────────────────── -->
<div id="msg-search-overlay" role="dialog" aria-modal="true" aria-labelledby="msg-search-title">
  <div id="msg-search-panel">
    <div class="msg-search-head">
      <span id="msg-search-title" data-i18n="search.title">全文搜尋</span>
      <button id="msg-search-close" class="icon-btn" aria-label="關閉" data-i18n-aria="a11y.close">✕</button>
    </div>
    <div class="msg-search-controls">
      <input id="msg-search-input" type="search" autocomplete="off" spellcheck="false"
             placeholder="搜尋訊息內容…" data-i18n-placeholder="search.placeholder">
      <label class="msg-search-scope">
        <input id="msg-search-scope" type="checkbox">
        <span data-i18n="search.currentOnly">只搜尋目前資料夾</span>
      </label>
    </div>
    <div id="msg-search-status" role="status" aria-live="polite"></div>
    <div id="msg-search-results"></div>
  </div>
</div>

<script src="core.js"></script>
<script src="story.js"></script>
<script src="site.js"></script>
</body>
</html>
